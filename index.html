<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bestilling</title>
<meta name="description" content="Bestilling ud fra Winpos-eksporter (LTC, Perfume, Andet) med eksport til Order Heinemann, og varemodtagelse fra CDL-fil til Winpos-CSV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2430'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23E4572E' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ------------------------------------------------------------------
   Udtryk: et roligt, havgråt arbejdsbord. Alt der kræver handling
   er markeret med redningskrans-orange — intet andet bruger den farve.
   ------------------------------------------------------------------ */
:root{
  --fog:#E8EDEF; --paper:#FFFFFF; --paper-2:#F4F7F8; --sunk:#EDF1F3;
  --ink:#0F2430; --ink-2:#4B5E69; --ink-3:#8698A2; --line:#DCE3E6; --line-2:#C7D2D7;
  --rail:#0F2430; --rail-ink:#AFC0C8; --rail-hi:#FFFFFF; --rail-sel:#1D3B49; --rail-line:#22404E;
  --buoy:#E4572E; --buoy-ink:#B8401C; --buoy-soft:#FDEAE3;
  --warn:#94660E; --warn-soft:#FAF0D6;
  --sea:#1D6B5A; --sea-soft:#E1F0EA; --sea-line:#A9D3C4;
  --man:#3456C2; --man-soft:#E7ECFB;
  --c-ltc:#4F7CAC; --c-perfume:#9C5B8F; --c-andet:#B9862C;
  --r-lg:12px; --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fog:#0B161C; --paper:#11202A; --paper-2:#152731; --sunk:#0E1C24;
    --ink:#E2EAEE; --ink-2:#9CAFB9; --ink-3:#687E89; --line:#1E323D; --line-2:#2A424E;
    --rail:#07121A; --rail-ink:#93A6B0; --rail-hi:#FFFFFF; --rail-sel:#15303D; --rail-line:#15262F;
    --buoy:#F0764F; --buoy-ink:#F6967A; --buoy-soft:#3A1D14;
    --warn:#E3B55A; --warn-soft:#33280F;
    --sea:#5BC2A4; --sea-soft:#122F28; --sea-line:#24584A;
    --man:#93AEF5; --man-soft:#1A2747;
    --c-ltc:#82A8D6; --c-perfume:#CB8EBE; --c-andet:#DDAE5A;
  }
}
:root[data-theme="dark"]{
  --fog:#0B161C; --paper:#11202A; --paper-2:#152731; --sunk:#0E1C24;
  --ink:#E2EAEE; --ink-2:#9CAFB9; --ink-3:#687E89; --line:#1E323D; --line-2:#2A424E;
  --rail:#07121A; --rail-ink:#93A6B0; --rail-hi:#FFFFFF; --rail-sel:#15303D; --rail-line:#15262F;
  --buoy:#F0764F; --buoy-ink:#F6967A; --buoy-soft:#3A1D14;
  --warn:#E3B55A; --warn-soft:#33280F;
  --sea:#5BC2A4; --sea-soft:#122F28; --sea-line:#24584A;
  --man:#93AEF5; --man-soft:#1A2747;
  --c-ltc:#82A8D6; --c-perfume:#CB8EBE; --c-andet:#DDAE5A;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--fog);color:var(--ink);font:15px/1.5 'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }

/* ---------- Ramme: rail + arbejdsflade ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 12px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;color:var(--rail-hi);font-weight:700;font-size:16px;padding:2px 8px 18px}
.brand svg{flex-shrink:0}
.rgroup{padding:10px 0 6px;border-top:1px solid var(--rail-line)}
.rgroup:first-of-type{border-top:none}
.rh{display:flex;align-items:baseline;justify-content:space-between;padding:0 10px 6px;font-size:13px;color:var(--rail-ink);font-weight:500}
.rh b{color:var(--rail-hi);font-weight:600;font-size:14px}
.ri{display:grid;grid-template-columns:4px 1fr auto auto;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--rail-ink);padding:9px 10px 9px 8px;border-radius:9px;cursor:pointer;text-align:left;font-size:14.5px;transition:background .12s}
.ri:hover{background:rgba(255,255,255,.05);color:var(--rail-hi)}
.ri.on{background:var(--rail-sel);color:var(--rail-hi)}
.ri .bar{width:4px;height:22px;border-radius:2px;background:var(--cat,#56707d)}
.ri .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .val{font-size:13px;color:inherit;opacity:.85;white-space:nowrap}
.ri .val.dim{opacity:.55;font-weight:400}
.ri.drag{background:var(--sea);color:#fff}
.ring{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;border:2.5px solid var(--buoy);color:var(--rail-hi);font-size:11.5px;font-weight:700;line-height:1}
.ring.ok{border-color:transparent;color:var(--sea);padding:0}
.rail-foot{margin-top:auto;display:flex;gap:6px;padding-top:12px;border-top:1px solid var(--rail-line)}
.rf{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--rail-line);background:transparent;color:var(--rail-ink);border-radius:9px;padding:8px 6px;cursor:pointer;font-size:13.5px}
.rf:hover{color:var(--rail-hi);border-color:#3b5867}

.work{min-width:0;padding:30px 36px 80px}
@media (max-width:1100px){ .work{padding:24px 22px 70px} }

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;z-index:40;overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 6px 0 2px}
  .brand span{display:none}
  .rgroup{display:flex;gap:4px;padding:0;border:none}
  .rh{display:none}
  .ri{display:flex;gap:8px;padding:7px 10px 7px 7px;white-space:nowrap;width:auto}
  .ri .nm{overflow:visible}
  .ri .val{display:none}
  .ri > span:empty{display:none}
  .rail-foot{margin:0 0 0 auto;padding:0;border:none}
  .rf{padding:7px 9px}
  .rf span{display:none}
  .work{padding:20px 16px 60px}
}

/* ---------- Overskrift for arbejdsfladen ---------- */
.mh{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.mh .t{min-width:0;flex:1 1 420px}
.mh h1{margin:0;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
.mh h1.alert{color:var(--buoy-ink)}
.mh p{margin:6px 0 0;color:var(--ink-2);font-size:15px;max-width:68ch}
.mh .actions{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){ .mh h1{font-size:24px} }

.btn{border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:9px 15px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 10px}
.btn.quiet:hover{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{flex-shrink:0}

/* ---------- Paneler ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel h2{margin:0;font-size:17px;font-weight:700}
.panel .sub{margin:3px 0 14px;color:var(--ink-2);font-size:14px}

.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:none}
.issue .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue .nm span{font-size:13px;color:var(--ink-3)}
@media (max-width:600px){ .issue{grid-template-columns:minmax(0,1fr) auto} .issue .catl{display:none} .issue .tag{grid-column:1} }
.calm{display:flex;gap:14px;align-items:center;padding:6px 0 2px;color:var(--sea);font-weight:600;font-size:16px}
.calm svg{flex-shrink:0}

.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk);margin:4px 0 14px}
.dist i{display:block;height:100%;background:var(--cat)}
.dist i + i{border-left:2px solid var(--paper)}
.dist-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.dist-row .sw{width:12px;height:12px;border-radius:3px;background:var(--cat)}
.dist-row .v{font-weight:600;text-align:right}
.dist-row .l{color:var(--ink-3);font-size:13px;text-align:right;min-width:70px}

.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.toplist li:first-child{border-top:none}
.toplist .sw{width:4px;height:18px;border-radius:2px;background:var(--cat)}
.toplist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .v{white-space:nowrap;color:var(--ink-2)}
.toplist .v b{color:var(--ink)}

.rules{list-style:none;margin:0;padding:0}
.rules li{padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.rules li:first-child{border-top:none;padding-top:0}
.rules li b{color:var(--ink)}
.formula{display:block;margin-top:4px;color:var(--ink);font-weight:500}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:5px;white-space:nowrap;line-height:1.65}
.tag.red{background:var(--buoy-soft);color:var(--buoy-ink)}
.tag.amber{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--man-soft);color:var(--man)}
.tag.teal{background:var(--sea-soft);color:var(--sea)}
.tag.grey{background:var(--sunk);color:var(--ink-2)}
.catl{font-size:13px;font-weight:600;color:var(--cat);white-space:nowrap}
.catdot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cat);flex-shrink:0}

/* ---------- Upload-flade ---------- */
.drop{border:2px dashed var(--line-2);border-radius:var(--r-lg);background:var(--paper);padding:44px 24px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.drag{border-color:var(--sea);background:var(--sea-soft)}
.drop h2{margin:12px 0 4px;font-size:19px}
.drop p{margin:0 auto;color:var(--ink-2);max-width:52ch}
.drop .slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.slot{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 10px;font-size:13.5px;background:var(--paper)}
.slot.ok{border-color:var(--sea-line);color:var(--sea)}
.up-ico{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--sunk);color:var(--ink-2)}

.fileline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:-8px 0 16px}
.fileline b{color:var(--ink);font-weight:600}
.fileline .sp{flex:1}

/* ---------- Info-linje ---------- */
.info{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);background:var(--paper-2);border:1px solid var(--line);font-size:14px;color:var(--ink-2);margin-bottom:14px}
.info b{color:var(--ink)}
.info .x{margin-left:auto;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}

/* ---------- Værktøjslinje ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:10px;gap:2px;flex-wrap:wrap;border:1px solid var(--line)}
.seg button,.seg label{border:none;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button:hover,.seg label:hover{color:var(--ink)}
.seg .on,.seg label:has(input:checked){background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,36,48,.1)}
.seg input{display:none}
.seg .c{color:var(--ink-3);margin-left:6px;font-weight:500}
.seg .c.r{color:var(--buoy-ink);font-weight:700}

/* ---------- Tabel ---------- */
.tablewrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 210px);min-height:220px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
thead th{position:sticky;top:0;background:var(--paper-2);z-index:2;text-align:left;font-size:13px;font-weight:600;color:var(--ink-2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th.col-order,td.col-order{background:color-mix(in srgb,var(--sea-soft) 55%,var(--paper))}
thead th.col-order{background:color-mix(in srgb,var(--sea-soft) 80%,var(--paper-2));color:var(--sea)}
th.r,td.r{text-align:right;white-space:nowrap}
thead th .arr{font-size:10px;color:var(--sea)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--paper-2)}
tbody tr:hover td.col-order{background:color-mix(in srgb,var(--sea-soft) 75%,var(--paper))}
tr.st-red td:first-child{box-shadow:inset 4px 0 0 var(--buoy)}
tr.st-amber td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.zero td{color:var(--ink-3)}
tr.zero td.desc .d{color:var(--ink-2);font-weight:500}
td.desc{min-width:250px;max-width:400px}
td.desc .d{font-weight:600}
td.desc .why{font-size:12.5px;color:var(--ink-3);margin-top:2px}
td.code{font-size:13px;white-space:nowrap;color:var(--ink-3)}
td .u{font-size:11.5px;color:var(--ink-3);margin-left:3px;font-weight:400}
td.neg{color:var(--buoy-ink);font-weight:700}
td.newst{font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.su-in{width:60px;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);text-align:right}
.su-in.missing{border:2px solid var(--buoy);background:var(--buoy-soft);color:var(--buoy-ink)}
.su-in.missing::placeholder{color:var(--buoy-ink);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--paper)}
.qty button{border:none;background:transparent;width:30px;height:34px;cursor:pointer;font-size:17px;color:var(--ink-3)}
.qty button:hover{background:var(--sunk);color:var(--ink)}
.qty input{width:56px;border:none;text-align:center;height:34px;font-weight:700;font-size:16px;background:transparent}
.qty.has{border-color:var(--sea-line)}
.qty.has input{color:var(--sea)}
.qty.manual{border:2px solid var(--man)}
.qty.manual input{color:var(--man)}
.qty input:focus{outline:none}
.qty:focus-within{box-shadow:0 0 0 2px var(--sea)}
.sug{font-size:11.5px;color:var(--man);margin-top:3px}
tfoot td{position:sticky;bottom:0;background:var(--paper-2);font-weight:700;border-top:1px solid var(--line);padding:10px 12px;z-index:1}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty-state h3{margin:0 0 6px;color:var(--ink);font-size:16px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Modtagelse */
.inv-tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line-2);margin-bottom:16px}
.it{border:none;background:none;padding:10px 18px 12px;cursor:pointer;text-align:left;border-bottom:3px solid transparent;margin-bottom:-1px;min-width:150px;color:var(--ink-2)}
.it:hover{color:var(--ink)}
.it.on{border-bottom-color:var(--ink);color:var(--ink)}
.it .no{display:block;font-size:13px;font-weight:500}
.it .amt{display:block;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.it .st{display:block;font-size:12.5px;margin-top:1px}
.it .st.ok{color:var(--sea)} .it .st.bad{color:var(--buoy-ink);font-weight:600}
.rx-table td.chk,.rx-table th.chk{width:40px;text-align:center}
.rx-table input[type=checkbox]{width:18px;height:18px;accent-color:var(--sea);cursor:pointer;vertical-align:middle}
.rx-table tr.off td{color:var(--ink-3)}
.rx-table tr.off td.desc .d{text-decoration:line-through;color:var(--ink-3);font-weight:500}
.rx-table thead tr.f th{top:42px;padding:6px 6px;background:var(--paper);cursor:default}
.rx-table thead tr.f input{width:100%;min-width:56px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--paper);font-weight:400}
.rx-table thead tr.f input.act{border-color:var(--sea);background:var(--sea-soft)}

/* ---------- Dialoger ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,18,24,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:48px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--paper);border-radius:14px;max-width:640px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:780px}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:18px;font-weight:700}
.modal .body{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:24px;line-height:1;padding:2px 6px;border-radius:6px}
.x-btn:hover{background:var(--sunk);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lab{font-size:14px;font-weight:700}
.help{font-size:13px;color:var(--ink-2)}
.field input[type=number],.field input[type=text],.field select{padding:8px 10px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row3{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--sea);flex-shrink:0}
.note{padding:11px 13px;border-radius:var(--r);font-size:14px}
.note.ok{background:var(--sea-soft);color:var(--sea)}
.note.bad{background:var(--buoy-soft);color:var(--buoy-ink)}
.rules-table{width:100%;font-size:14px;border-collapse:collapse}
.rules-table th{font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);position:static;background:none;cursor:default}
.rules-table td{padding:5px 4px;border-bottom:1px solid var(--line)}

<script>
'use strict';
/* =====================================================================
   Shop Bestilling — én fil til GitHub Pages
   Bestilling:      Winpos-eksporter (LTC / Perfume / Andet) → Order Heinemann.xlsx
   Varemodtagelse:  CDL-fil fra Heinemann → CSV (Article, Qty, Price) til Winpos
   Alt kører i browseren; intet sendes nogen steder hen.
   ===================================================================== */

const CATS = {
  ltc:     { name:'LTC',     sub:'Slik, drikke, vin & spiritus', suMode:'strict',  color:'var(--c-ltc)' },
  perfume: { name:'Perfume', sub:'Parfume & kosmetik',            suMode:'none',    color:'var(--c-perfume)' },
  andet:   { name:'Andet',   sub:'Ure, legetøj, tilbehør',        suMode:'numeric', color:'var(--c-andet)' },
};
const CAT_KEYS = Object.keys(CATS);

/*  Særregler: "factor" = hvor mange lagerenheder én kasse er.
    Winpos lægger fejlagtigt "Quantity × factor" til lageret i "New stock",
    så reelt lager = New stock − Quantity × factor. Salget er i lagerenheder. */
const DEFAULT_SETTINGS = {
  v: 3,
  minShelf: { ltc:0, perfume:4, andet:4 },
  buffer: true,               // én ekstra kasse (sekundær enhed) oven i salget
  cover: 1,                   // bestil til X gange det solgte
  rounding: 'nearest',        // 'nearest' | 'up'
  showWinposStock: false,
  rules: [
    { match:'coca cola',   cats:'ltc', factor:24, step:99, unit:'kasser', note:'Lager og salg er i dåser, bestilling i kasser á 24. Bestilles i 99 kasser, når der er brug for det.' },
    { match:'fanta',       cats:'ltc', factor:24, step:99, unit:'kasser', note:'Lager og salg er i dåser, bestilling i kasser á 24. Bestilles i 99 kasser, når der er brug for det.' },
    { match:'capri sonne', cats:'ltc', factor:4,  step:1,  unit:'kasser', note:'Lager i 10-pakker. 1 kasse = 40 stk = 4 pakker.' },
  ],
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const K_SET='sb_settings_v3', K_SU='sb_su_memory_v1', K_SES='sb_session_v1', K_RX='sb_receive_v1', K_RXP='sb_receive_pref_v1', K_UI='sb_ui_v2';

function loadSettings(){
  const s = store.get(K_SET, null);
  const d = structuredClone(DEFAULT_SETTINGS);
  if (!s) return d;
  return Object.assign(d, s, { minShelf: Object.assign(d.minShelf, s.minShelf||{}) });
}
let settings = loadSettings();
let suMemory = store.get(K_SU, {});
let session  = store.get(K_SES, null) || { data:{}, overrides:{} };
for (const c of CAT_KEYS) session.overrides[c] = session.overrides[c] || {};
let rx = store.get(K_RX, null);
let rxPref = Object.assign({ autoZero:true, sep:';', dec:',', header:true, headers:['Article','Qty','Price/Qty'], mode:'split' }, store.get(K_RXP, {}));
const uiSaved = store.get(K_UI, {});
const ui  = { section: uiSaved.section || 'order', view: uiSaved.view || 'overview', filter:'all', q:'', sort:{key:null,dir:1}, hiddenInfo: uiSaved.hiddenInfo || {} };
const rui = { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} };
function saveUi(){ store.set(K_UI, { section:ui.section, view:ui.view, hiddenInfo:ui.hiddenInfo }); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null || isNaN(n)) ? '–' : Number(n).toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtq = n => fmt(n, Number.isInteger(Math.round(n*1000)/1000) ? 0 : 1);
const eur = (n, d=2) => fmt(n,d) + ' €';
const plural = (n, one, many) => `${fmt(n)} ${n===1 ? one : many}`;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800); }
const ICON = {
  up:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  dl:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>',
  sheet:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  print:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>',
  check:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  help:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>',
  gear:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  logo:'<svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10.5" fill="none" stroke="#E4572E" stroke-width="6"/><path d="M16 5.5v4M16 22.5v4M5.5 16h4M22.5 16h4" stroke="#fff" stroke-width="3"/></svg>',
};

/** Tal fra Winpos-celler: 46 · "46 Stk" · "9.872 0,33ltr" (punktum = tusind) · "2,5" */
function parseNum(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/ /g,' ').trim().match(/^-?[\d.,]+/);
  if (!m) return null;
  let s = m[0];
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/** Sekundær enhed tæller kun hvis det er et rent tal (12, 24 …) */
function parseSU(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v > 0 ? v : null;
  const s = String(v).trim();
  return /^\d+$/.test(s) && +s > 0 ? +s : null;
}
function detectWeek(name){ const m = String(name||'').match(/(?:week|uge|wk)[\s_-]*(\d{1,2})/i); return m ? +m[1] : null; }
function isoWeek(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(),0,1))) / 86400000 + 1) / 7);
}
function guessCat(name){
  const n = String(name||'').toLowerCase();
  if (/ltc/.test(n)) return 'ltc';
  if (/perfum|parfum/.test(n)) return 'perfume';
  if (/andet|other|misc/.test(n)) return 'andet';
  if (/cdl|transp/.test(n)) return 'cdl';
  return null;
}

/* =====================================================================
   Indbygget .xlsx-læser.
   Heinemanns CDL-filer er pakket med Windows-stier ("xl\worksheets\…"),
   som Excel-biblioteket ikke kan åbne. Denne læser klarer det.
   ===================================================================== */
async function inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('Ikke en .xlsx-fil');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/').replace(/^\/+/, '');
    files[name.toLowerCase()] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  return {
    async text(path){
      const f = files[path.replace(/\\/g,'/').replace(/^\/+/, '').toLowerCase()];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return new TextDecoder().decode(out).replace(/^﻿/, '');
    }
  };
}
async function readXlsxNative(buf){
  const z = unzip(buf);
  const P = s => new DOMParser().parseFromString(s, 'application/xml');
  const wbTxt = await z.text('xl/workbook.xml');
  if (!wbTxt) throw new Error('Mangler workbook.xml');
  const wb = P(wbTxt);
  const rels = {};
  const relTxt = await z.text('xl/_rels/workbook.xml.rels');
  if (relTxt) for (const r of P(relTxt).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
  const ss = [];
  const ssTxt = await z.text('xl/sharedStrings.xml');
  if (ssTxt) for (const si of P(ssTxt).getElementsByTagName('si')){
    let t = ''; for (const x of si.getElementsByTagName('t')) if (x.parentNode.nodeName !== 'rPh') t += x.textContent; ss.push(t);
  }
  const colIdx = ref => { const m = /^([A-Z]+)/.exec(ref||''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; };
  const out = [];
  let si = 0;
  for (const sh of wb.getElementsByTagName('sheet')){
    si++;
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = (rels[rid] || `worksheets/sheet${si}.xml`).replace(/\\/g,'/');
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    const txt = await z.text(target);
    if (!txt) continue;
    const doc = P(txt), aoa = [];
    let rAuto = 0;
    for (const row of doc.getElementsByTagName('row')){
      const ri = row.getAttribute('r') ? +row.getAttribute('r') - 1 : rAuto;
      rAuto = ri + 1;
      const arr = []; let cAuto = 0;
      for (const c of row.getElementsByTagName('c')){
        let ci = colIdx(c.getAttribute('r')); if (ci < 0) ci = cAuto; cAuto = ci + 1;
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : null;
        let val = null;
        if (t === 's') val = v != null ? ss[+v] : null;
        else if (t === 'inlineStr'){ const is = c.getElementsByTagName('t'); val = [...is].map(x=>x.textContent).join(''); }
        else if (t === 'str' || t === 'e') val = v;
        else if (t === 'b') val = v === '1';
        else if (v != null && v !== ''){ const n = +v; val = isNaN(n) ? v : n; }
        arr[ci] = val;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = null;
      aoa[ri] = arr;
    }
    for (let i = 0; i < aoa.length; i++) if (!aoa[i]) aoa[i] = [];
    out.push({ name: sh.getAttribute('name'), aoa });
  }
  if (!out.length) throw new Error('Ingen ark fundet');
  return out;
}
/** Læs regneark → [{name, aoa}] — indbygget læser til .xlsx, Excel-biblioteket til .xls */
async function readSheets(file){
  const buf = await file.arrayBuffer();
  const isZip = new Uint8Array(buf, 0, 2)[0] === 0x50 && new Uint8Array(buf, 0, 2)[1] === 0x4b;
  let nativeErr = null;
  if (isZip && typeof DecompressionStream !== 'undefined'){
    try { return await readXlsxNative(buf); } catch(e){ nativeErr = e; console.warn('Indbygget læser fejlede, prøver biblioteket', e); }
  }
  if (typeof XLSX === 'undefined') throw nativeErr || new Error('Excel-læseren kunne ikke indlæses (kræver internet første gang).');
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(n => ({ name:n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null }) }));
}

/* =====================================================================
   BESTILLING
   ===================================================================== */
function parseWinpos(aoa){
  let h = -1;
  for (let i=0;i<Math.min(aoa.length,60);i++){
    const r = (aoa[i]||[]).map(x => String(x??'').trim().toLowerCase());
    if (r.includes('code') && r.includes('description')) { h=i; break; }
  }
  if (h<0) throw new Error('Kunne ikke finde kolonnerne "Code" og "Description".');
  const head = aoa[h].map(x => String(x??'').trim().toLowerCase());
  const col = (...names) => { for (const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const C = {
    code: col('code'), desc: col('description'), sold: col('quantity'),
    stock: col('new stock','in stock','stock'), price: col('purchase price eur','purchase price'),
    su: col('secondary unit'), art: col('artikel nr','artikel nr.','article no'), unit: col('unit'),
  };
  const missing = ['code','desc','sold','stock'].filter(k => C[k]<0);
  if (missing.length) throw new Error('Mangler kolonner: ' + missing.join(', '));
  const meta = {};
  for (let i=0;i<h;i++){ const r=aoa[i]||[]; const k=String(r[1]??'').trim(); if(k && r[2]!=null) meta[k]=String(r[2]).trim(); }
  const rows = [];
  for (let i=h+1;i<aoa.length;i++){
    const r = aoa[i]||[];
    const code = r[C.code];
    if (code==null || String(code).trim()==='') continue;
    const desc = String(r[C.desc]??'').replace(/ /g,' ').trim();
    if (!desc) continue;
    rows.push({
      code: String(code).trim(), desc,
      sold: parseNum(r[C.sold]) ?? 0, stock: parseNum(r[C.stock]) ?? 0, stockRaw: String(r[C.stock]??'').trim(),
      price: C.price>=0 ? (parseNum(r[C.price]) ?? 0) : 0,
      suRaw: C.su>=0 ? (r[C.su]==null ? '' : String(r[C.su]).trim()) : '',
      art: C.art>=0 ? (r[C.art]==null ? '' : String(r[C.art]).trim()) : '',
      unit: C.unit>=0 ? String(r[C.unit]??'').trim() : '',
    });
  }
  return { meta, rows };
}

function roundTo(x, step, mode){
  if (x <= 0) return 0;
  return (mode==='up' ? Math.ceil(x/step - 1e-9) : Math.round(x/step + 1e-9)) * step;
}
function findRule(cat, desc){
  const d = desc.toLowerCase();
  return settings.rules.find(r => r.match && (!r.cats || r.cats.split(',').map(s=>s.trim()).includes(cat)) && d.includes(r.match.toLowerCase().trim())) || null;
}

/**
 * Beregning pr. linje
 *   Reel lager = New stock − solgt           (særregel: New stock − solgt × kassestørrelse)
 *   Mål        = solgt × dækning + 1 kasse buffer, dog mindst "min. på hylden"
 *   Bestil     = (mål − reel lager) rundet til sekundær enhed — 0 hvis reel lager dækker
 *   Nyt lager  = reel lager + bestil
 */
function calc(cat, row){
  const min = +settings.minShelf[cat] || 0;
  const cover = +settings.cover || 1;
  const flags = [];
  let su = 1, suSource = 'none', sug = 0, unit = '', why = '', real, soldDisp = row.sold, buf = 0;
  const rule = findRule(cat, row.desc);

  if (rule){
    const f = +rule.factor || 1, step = +rule.step || 1;
    unit = rule.unit || 'kasser';
    const realPcs = row.stock - row.sold * f;    // ret Winpos' fejl: den har lagt solgt × f til
    real = realPcs / f;                           // i kasser
    soldDisp = row.sold / f;                      // salget er i enkelt-stk → kasser
    buf = settings.buffer ? 1 : 0;
    const target = soldDisp * cover + buf;
    const need = target - real;
    su = step; suSource = 'rule';
    sug = need > 0 ? Math.ceil(need / step - 1e-9) * step : 0;
    why = need > 0
      ? `Solgt ${fmt(soldDisp,1)}${buf?' + 1 buffer':''} − reel ${fmt(real,1)} = mangler ${fmt(need,1)} ${unit} → ${sug}`
      : `Reel lager ${fmt(real,1)} ${unit} dækker salg ${fmt(soldDisp,1)}${buf?' + 1 buffer':''}`;
    flags.push({ c:'teal', t:`${fmt(row.sold)} stk solgt = ${fmt(soldDisp,1)} ${unit}` });
    if (realPcs < 0) flags.push({ c:'amber', t:'Solgt mere end lager' });
  } else {
    real = row.stock - row.sold;
    if (CATS[cat].suMode !== 'none'){
      const fromFile = parseSU(row.suRaw), mem = suMemory[row.code];
      if (mem){ su = mem; suSource = 'memory'; }
      else if (fromFile){ su = fromFile; suSource = 'file'; }
      else if (CATS[cat].suMode === 'strict'){ su = 1; suSource = 'missing'; flags.push({ c:'red', t:'Mangler sek. enhed' }); }
      else { su = 1; suSource = 'ignored'; }
    }
    buf = settings.buffer && (suSource==='file' || suSource==='memory') ? su : 0;
    const base = row.sold * cover + buf;
    const target = Math.max(base, min);
    const need = target - real;
    sug = need > 0 ? roundTo(need, su, settings.rounding) : 0;
    if (min > 0 && real + sug < min) sug = Math.ceil((min - real) / su) * su;
    if (sug === 0 && real <= 0 && row.sold > 0) sug = su;
    const tdesc = min > base ? `min. ${min} på hylden` : `solgt ${fmtq(row.sold*cover)}${buf ? ' + kasse '+buf : ''}`;
    why = need > 0
      ? `Mål ${fmtq(target)} (${tdesc}) − reel ${fmtq(real)} = mangler ${fmtq(need)}${su>1 ? ` → ${sug}` : ''}`
      : `Mål ${fmtq(target)} (${tdesc}) – reel lager ${fmtq(real)} dækker`;
    if (real < 0) flags.push({ c:'amber', t:'Solgt mere end lager' });
  }
  sug = Math.max(0, sug);

  const ov = session.overrides[cat][row.code];
  const manual = ov != null && ov !== '' && !isNaN(ov);
  const final = manual ? Math.max(0, +ov) : sug;
  if (manual) flags.push({ c:'blue', t:`Rettet (forslag ${sug})` });
  if (suSource === 'memory') flags.push({ c:'grey', t:'Sek. enhed husket' });
  const status = flags.some(f=>f.c==='red') ? 'red' : flags.some(f=>f.c==='amber') ? 'amber' : 'ok';
  return { real, newStock: real + final, soldDisp, su, suSource, buf, sug, final, manual, unit, rule, why, flags, status, value: final * (row.price||0) };
}

function computed(cat){
  const d = session.data[cat];
  return d ? d.rows.map(r => Object.assign({ cat }, r, calc(cat, r))) : [];
}
function summary(cat){
  const L = computed(cat);
  return {
    lines: L.length, order: L.filter(x=>x.final>0).length,
    units: L.reduce((a,x)=>a+x.final,0), value: L.reduce((a,x)=>a+x.value,0),
    red: L.filter(x=>x.status==='red').length, amber: L.filter(x=>x.status==='amber').length,
    manual: L.filter(x=>x.manual).length, list: L,
  };
}
function currentWeek(){ for (const c of CAT_KEYS){ const w = session.data[c]?.week; if (w) return w; } return isoWeek(); }
function saveSession(){ store.set(K_SES, session); }

async function loadOrderFile(cat, file){
  try{
    const sheets = await readSheets(file);
    const { meta, rows } = parseWinpos(sheets[0].aoa);
    if (!rows.length) throw new Error('Ingen varelinjer fundet.');
    const g = guessCat(file.name);
    if (g && g !== cat && CATS[g] && !confirm(`Filnavnet "${file.name}" ligner ${CATS[g].name}, men du har valgt ${CATS[cat].name}. Fortsæt?`)) return;
    session.data[cat] = { fileName:file.name, meta, rows, week: detectWeek(file.name), loadedAt: Date.now() };
    session.overrides[cat] = {};
    saveSession();
    Object.assign(ui, { section:'order', view:cat, filter:'all', q:'', sort:{key:null,dir:1} }); saveUi();
    render();
    const s = summary(cat);
    toast(`${CATS[cat].name} indlæst: ${s.order} af ${s.lines} varer skal bestilles${s.red ? ', '+s.red+' skal tjekkes' : ''}`);
  }catch(e){ console.error(e); alert('Kunne ikke læse filen:\n' + e.message); }
}

function catRows(all){
  const q = ui.q.trim().toLowerCase();
  let L = all.filter(x => {
    if (ui.filter==='order' && !(x.final>0)) return false;
    if (ui.filter==='check' && x.status==='ok') return false;
    if (ui.filter==='manual' && !x.manual) return false;
    if (q && !(x.desc.toLowerCase().includes(q) || x.code.includes(q) || x.art.includes(q))) return false;
    return true;
  });
  const { key, dir } = ui.sort;
  if (key){
    const get = { code:x=>+x.code||x.code, art:x=>+x.art||x.art, desc:x=>x.desc.toLowerCase(), sold:x=>x.soldDisp, stock:x=>x.stock,
      real:x=>x.real, su:x=>x.su, price:x=>x.price, final:x=>x.final, newStock:x=>x.newStock, value:x=>x.value }[key];
    L = L.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  } else {
    const rank = { red:0, amber:1, ok:2 };
    L = L.slice().sort((a,b)=> rank[a.status]-rank[b.status]);
  }
  return L;
}

function renderCatBody(cat, all){
  all = all || computed(cat);
  const showSU = CATS[cat].suMode !== 'none', showStock = settings.showWinposStock;
  const extra = (showSU?1:0) + (showStock?1:0);
  const L = catRows(all);
  $('#tbody').innerHTML = L.map(x => rowHtml(x, showSU, showStock)).join('') ||

}

function rowHtml(x, showSU, showStock){
  const step = x.su || 1;
  const u = x.unit ? `<span class="u">${esc(x.unit)}</span>` : '';
  const dec = v => x.rule ? fmt(v, Number.isInteger(Math.round(v*10)/10) ? 0 : 1) : fmtq(v);
  let suCell = '';
  if (showSU){
    suCell = x.rule ? `<td class="r" title="Særregel: bestilles i hele ${x.rule.step}">${x.rule.step}${u}</td>`
      : `<td class="r"><input class="su-in ${x.suSource==='missing'?'missing':''}" data-su="${esc(x.code)}" inputmode="numeric"
          value="${x.suSource==='missing' || x.suSource==='ignored' ? '' : x.su}" placeholder="${x.suSource==='missing'?'?':'–'}" aria-label="Sekundær enhed"
          title="${x.suSource==='ignored' ? 'I filen: '+esc(x.suRaw)+' (ikke et tal, ignoreres)' : x.suSource==='file' ? 'Fra Winpos' : x.suSource==='memory' ? 'Husket (fil: '+esc(x.suRaw||'tom')+')' : 'Skriv antal pr. kasse. Huskes til næste uge.'}"></td>`;
  }
  const realTitle = x.rule ? `${fmt(x.stock)} − ${fmt(x.sold)} × ${x.rule.factor} = ${fmt(x.stock - x.sold*x.rule.factor)} stk` : `${fmt(x.stock)} − ${fmt(x.sold)}`;
  const tags = x.flags.filter(f => f.c!=='grey');
  return `<tr class="st-${x.status} ${x.final>0?'':'zero'}">
    <td class="code">${esc(x.code)}</td>
    <td class="code">${esc(x.art)}</td>
    <td class="desc"><div class="d">${esc(x.desc)}</div>
      ${tags.length?`<div class="tags">${tags.map(f=>`<span class="tag ${f.c}">${esc(f.t)}</span>`).join('')}</div>`:''}
      <div class="why">${esc(x.why)}</div></td>
    <td class="r">${dec(x.soldDisp)}${u}</td>
    ${showStock ? `<td class="r" title="${esc(x.stockRaw)}">${fmt(x.stock)}</td>` : ''}
    <td class="r ${x.real<0?'neg':''}" title="${esc(realTitle)}">${dec(x.real)}${u}</td>
    ${suCell}
    <td class="r col-order"><span class="qty ${x.manual?'manual':x.final>0?'has':''}">
      <button data-act="step" data-d="-${step}" data-code="${esc(x.code)}" tabindex="-1" aria-label="Færre">−</button>
      <input data-qty="${esc(x.code)}" inputmode="numeric" value="${x.final}" aria-label="Bestil ${esc(x.desc)}">
      <button data-act="step" data-d="${step}" data-code="${esc(x.code)}" tabindex="-1" aria-label="Flere">+</button></span></td>
    <td class="r newst ${x.newStock<0?'neg':''}">${dec(x.newStock)}${u}</td>
    <td class="r">${fmt(x.price,2)}</td>
    <td class="r">${x.final>0?eur(x.value):'–'}</td>
  </tr>`;
}

function setOverride(cat, code, val){
  const row = session.data[cat].rows.find(r=>r.code===code);
  const sug = calc(cat, row).sug;

  if (val==='' || isNaN(n) || n===sug) delete session.overrides[cat][code];
  else session.overrides[cat][code] = Math.max(0,n);
  saveSession();
  refreshOrder();
}

function exportLines(cats){
  const out = [];
  for (const c of cats) for (const x of computed(c)) if (x.final>0) out.push({ cat:c, code:x.code, art:x.art, qty:x.final, desc:x.desc });
  return out;
}
const asCell = v => (/^\d+$/.test(String(v)) && String(v).length < 16 ? Number(v) : String(v ?? ''));

function needXLSX(){ if (typeof XLSX==='undefined'){ toast('Excel-biblioteket er ikke indlæst – tjek internetforbindelsen'); return false; } return true; }
function doExport(){
  if (!needXLSX()) return;
  const cats = [...document.querySelectorAll('[name=ecat]:checked')].map(i=>i.value);
  const mode = document.querySelector('[name=emode]:checked').value;
  if (!cats.length){ toast('Vælg mindst én kategori'); return; }
  store.set('sb_export_pref', { cats, mode });
  const w = currentWeek();
  const groups = mode==='split' ? cats.map(c=>[c]) : [cats];
  let n = 0;
  for (const g of groups){
    const lines = exportLines(g);
    if (!lines.length) continue;
    const ws = XLSX.utils.aoa_to_sheet([['GH article no.','Customer article no.','Order quantity']].concat(lines.map(l=>[asCell(l.code), asCell(l.art), l.qty])));
    ws['!cols'] = [{wch:16},{wch:22},{wch:15}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Tabelle1');
    XLSX.writeFile(wb, `Order Heinemann Uge ${w}${mode==='split' ? ' ' + CATS[g[0]].name : ''}.xlsx`);
    n++;
  }
  $('#mExport').classList.remove('show');
  toast(n ? `${n} fil(er) downloadet` : 'Intet at eksportere');
}

/* =====================================================================
   VAREMODTAGELSE — CDL fra Heinemann → CSV til Winpos
   Gule linjer i CDL ("Ʃ 9502227809") er sumlinjen for én faktura.
   ===================================================================== */
const RX_COLS = [
  { k:'inv',   n:'Faktura',     h:['billing document'] },
  { k:'art',   n:'Article',     h:['article'] },
  { k:'desc',  n:'Beskrivelse', h:['article description'] },
  { k:'qty',   n:'Antal',       h:['delivery quantity'], num:true },
  { k:'price', n:'Pris/enhed',  h:['price per sales unit'], num:true },
  { k:'net',   n:'Nettoværdi',  h:['net value'], num:true },
  { k:'ref',   n:'Ordre',       h:['customer reference','po number'] },
  { k:'brand', n:'Brand',       h:['brand name'] },
  { k:'mgrp',  n:'Varegruppe',  h:['material group'] },
  { k:'unit',  h:['sales unit'], hidden:true },
  { k:'credit',h:['credit price'], num:true, hidden:true },
  { k:'gtin',  h:['gtin'], hidden:true },
];
const RX_SHOW = RX_COLS.filter(c=>!c.hidden);
function rxSave(){ store.set(K_RX, rx); }

function parseCDL(sheets){
  for (const { aoa } of sheets){
    let h = -1;
    for (let i=0;i<Math.min(aoa.length,40);i++){
      const r = (aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase());
      if (r.includes('billing document') && r.includes('article')) { h=i; break; }
    }
    if (h<0) continue;
    const head = aoa[h].map(x=>String(x??'').trim().toLowerCase());
    const idx = {}; for (const c of RX_COLS){ idx[c.k] = c.h.map(n=>head.indexOf(n)).find(i=>i>=0) ?? -1; }
    if (idx.art<0 || idx.qty<0 || idx.price<0) throw new Error('Mangler kolonnerne Article / Delivery Quantity / Price per Sales Unit.');
    const rows = [], sums = {}; let total = null;
    for (let i=h+1;i<aoa.length;i++){
      const r = aoa[i]||[];
      const inv = String(r[idx.inv]??'').trim();
      if (!inv) continue;
      if (inv.includes('Ʃ') || inv.includes('Σ')){
        const no = inv.replace(/[ƩΣ]/g,'').trim();
        const v = { qty: parseNum(r[idx.qty]) ?? 0, net: parseNum(r[idx.net]) ?? 0 };
        if (no) sums[no] = v; else total = v;
        continue;
      }
      const o = { id: rows.length };
      for (const c of RX_COLS){ const v = idx[c.k]>=0 ? r[idx[c.k]] : null; o[c.k] = c.num ? (parseNum(v) ?? 0) : String(v ?? '').trim(); }
      if (!o.art) continue;
      o.tester = /^T\s/.test(o.desc) || /^T8/i.test(o.mgrp);
      o.posm = /^X/i.test(o.mgrp) || /pseudo/i.test(o.brand) || /posm/i.test(o.ref);
      o.on = !(rxPref.autoZero && o.price === 0);
      rows.push(o);
    }
    if (rows.length) return { rows, sums, total };
  }
  throw new Error('Kunne ikke finde CDL-tabellen (kolonnerne "Billing Document" og "Article").');
}
async function rxLoad(file){
  try{
    const p = parseCDL(await readSheets(file));
    if (rx && rx.rows?.some(r=>!r.on && r.price!==0) && !confirm('Der er allerede en CDL med dine fravalg. Erstat den?')) return;
    rx = { fileName:file.name, loadedAt:Date.now(), rows:p.rows, sums:p.sums, total:p.total };
    rxSave();
    Object.assign(rui, { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} });
    ui.section = 'receive'; saveUi(); render();
    const off = p.rows.filter(r=>!r.on).length;
    toast(`${p.rows.length} linjer · ${rxInvoices().length} fakturaer${off ? ` · ${off} med pris 0 fravalgt` : ''}`);
  }catch(e){ console.error(e); alert('Kunne ikke læse CDL-filen:\n' + e.message); }
}
function rxInvoices(){
  if (!rx) return [];
  const m = new Map();
  for (const r of rx.rows){
    if (!m.has(r.inv)) m.set(r.inv, { no:r.inv, lines:0, qty:0, net:0, on:0, onNet:0, refs:new Set(), zero:0 });
    const v = m.get(r.inv);
    v.lines++; v.qty += r.qty; v.net += r.net; if (r.ref) v.refs.add(r.ref);
    if (r.on){ v.on++; v.onNet += r.net; }
    if (r.price===0) v.zero++;
  }
  return [...m.values()].map(v => { const s = rx.sums?.[v.no]; v.sum = s; v.check = s ? (Math.abs(s.net - v.net) < 0.05 && Math.abs(s.qty - v.qty) < 0.001 ? 'ok' : 'diff') : 'none'; return v; });
}
/** Excel-agtigt filter: tekst = indeholder · !tekst = indeholder ikke · tal: >5 <10 >=, <=, =0, <>0 */
function colMatch(col, val, f){
  f = f.trim(); if (!f) return true;
  if (col.num){
    const m = f.match(/^(>=|<=|<>|!=|>|<|=)\s*(-?[\d.,]+)$/);
    if (m){ const n = parseNum(m[2]);
      switch(m[1]){ case '>':return val>n; case '<':return val<n; case '>=':return val>=n; case '<=':return val<=n; case '=':return val===n; default:return val!==n; } }
    if (/^-?[\d.,]+$/.test(f)) return val === parseNum(f);
  }
  const neg = /^(!|<>)/.test(f), needle = f.replace(/^(!|<>)/,'').toLowerCase();
  const hit = String(val).toLowerCase().includes(needle);
  return neg ? !hit : hit;
}
function rxVisible(){
  if (!rx) return [];
  const q = rui.q.trim().toLowerCase();
  let L = rx.rows.filter(r => {
    if (rui.inv!=='all' && r.inv!==rui.inv) return false;
    if (rui.filter==='on' && !r.on) return false;
    if (rui.filter==='off' && r.on) return false;
    if (rui.filter==='zero' && r.price!==0) return false;
    if (rui.filter==='tester' && !r.tester) return false;
    if (q && !(r.desc.toLowerCase().includes(q) || r.art.includes(q) || r.brand.toLowerCase().includes(q) || (r.gtin||'').includes(q))) return false;
    for (const c of RX_SHOW){ const f = rui.colf[c.k]; if (f && !colMatch(c, r[c.k], f)) return false; }
    return true;
  });
  const { key, dir } = rui.sort;
  if (key){
    const col = RX_COLS.find(c=>c.k===key);
    const get = key==='on' ? (r=>r.on?1:0) : col?.num ? (r=>r[key]) : (r=>{ const v=r[key]; return /^\d+$/.test(v) ? +v : String(v).toLowerCase(); });
    L = L.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  }
  return L;
}

/* ---------- CSV ---------- */
const csvField = (v, sep) => { const s = String(v ?? ''); return /["\r\n]/.test(s) || s.includes(sep) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const csvNum = (n, dec) => { const s = String(Math.round(n*10000)/10000); return dec===',' ? s.replace('.', ',') : s; };
function buildCsv(rows, p){
  const sep = p.sep==='tab' ? '\t' : p.sep, out = [];
  if (p.header) out.push(p.headers.map(h=>csvField(h,sep)).join(sep));
  for (const r of rows) out.push([csvField(r.art,sep), csvNum(r.qty,p.dec), csvNum(r.price,p.dec)].join(sep));
  return out.join('\r\n') + '\r\n';
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function openCsv(){
  const invs = rxInvoices();
  const pre = rui.inv==='all' ? invs.map(i=>i.no) : [rui.inv];
  const seg = (name, opts, cur) => `<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${String(cur)===String(v)?'checked':''}>${l}</label>`).join('')}</div>`;
  $('#csvBody').innerHTML = `
    <div class="field"><span class="lab">Fakturaer</span>
      ${invs.map(i=>`<label class="check"><input type="checkbox" name="cinv" value="${esc(i.no)}" ${pre.includes(i.no)?'checked':''}>
        <span class="mono">${esc(i.no)}</span> <span class="help">${i.on} af ${i.lines} linjer · ${eur(i.onNet)}</span>
        ${i.check==='diff'?'<span class="tag red">sum afviger</span>':''}</label>`).join('')}</div>
    <div class="field"><span class="lab">Filer</span>${seg('cmode',[['split','Én fil pr. faktura'],['one','Én samlet fil']], rxPref.mode)}</div>
    <div class="row3">
      <div class="field"><span class="lab">Skilletegn</span>${seg('csep',[[';',' ; '],[',',' , '],['tab','Tab']], rxPref.sep)}</div>
      <div class="field"><span class="lab">Decimaltegn</span>${seg('cdec',[[',','0,64'],['.','0.64']], rxPref.dec)}</div>
      <div class="field"><span class="lab">Overskrift</span>${seg('chead',[['1','Med'],['0','Uden']], rxPref.header?'1':'0')}</div>
    </div>
    <div class="field" id="headNames"><span class="lab">Overskrifter</span>
      <div class="row3">${rxPref.headers.map((h,i)=>`<input type="text" data-hn="${i}" value="${esc(h)}">`).join('')}</div>
      <span class="help">Kolonnerne er altid Article · Delivery quantity · Price per Sales Unit (som fanen CSV PC).</span></div>
    <div class="field"><span class="lab">Forhåndsvisning</span><div class="csv-preview" id="csvPrev"></div></div>`;
  const upd = () => {
    const p = csvPrefFromForm();
    $('#headNames').style.display = p.header ? '' : 'none';
    const sel = [...document.querySelectorAll('[name=cinv]:checked')].map(i=>i.value);
    const rows = rx.rows.filter(r=>r.on && sel.includes(r.inv));
    $('#csvPrev').textContent = buildCsv(rows.slice(0,6), p).trimEnd().split('\r\n').join('\n') + (rows.length>6 ? `\n… (${rows.length} linjer i alt)` : '');
  };
  $('#csvBody').oninput = upd; $('#csvBody').onchange = upd; upd();
  $('#mCsv').classList.add('show');
}
function csvPrefFromForm(){
  const g = n => document.querySelector(`[name=${n}]:checked`)?.value;
  return Object.assign({}, rxPref, { mode:g('cmode'), sep:g('csep'), dec:g('cdec'), header:g('chead')==='1',
    headers:[0,1,2].map(i => document.querySelector(`[data-hn="${i}"]`)?.value ?? rxPref.headers[i]) });
}
function doCsv(){
  const p = csvPrefFromForm();
  rxPref = Object.assign(rxPref, p); store.set(K_RXP, rxPref);
  const sel = [...document.querySelectorAll('[name=cinv]:checked')].map(i=>i.value);
  if (!sel.length){ toast('Vælg mindst én faktura'); return; }
  const groups = p.mode==='split' ? sel.map(s=>[s]) : [sel];
  let n = 0;
  groups.forEach((g, gi) => {
    const rows = rx.rows.filter(r=>r.on && g.includes(r.inv));
    if (!rows.length) return;
    const name = p.mode==='split' ? `CSV PC ${g[0]}.csv` : `CSV PC ${sel.length===1 ? sel[0] : 'samlet ' + new Date().toISOString().slice(0,10)}.csv`;
    setTimeout(() => download(name, buildCsv(rows, p)), gi*400);
    n++;
  });
  $('#mCsv').classList.remove('show');
  toast(n ? `${n} CSV-fil(er) downloadet` : 'Ingen markerede linjer');
}

/* =====================================================================
   Indstillinger og hjælp
   ===================================================================== */
function openSettings(){
  const s = settings;
  $('#settingsBody').innerHTML = `
    <div class="field"><span class="lab">Bestilling</span>
      <label class="check"><input type="checkbox" id="setBuffer" ${s.buffer?'checked':''}> Bestil én ekstra kasse som buffer, så hylden ikke bliver tom</label>
      <label class="check"><input type="checkbox" id="setStock" ${s.showWinposStock?'checked':''}> Vis kolonnen "Lager i Winpos", så du kan sammenligne med Winpos</label></div>
    <div class="field"><span class="lab">Mindst på hylden</span>
      <div class="row3">${CAT_KEYS.map(c=>`<div class="field"><span class="help">${CATS[c].name}</span><input type="number" min="0" id="min_${c}" value="${s.minShelf[c]}"></div>`).join('')}</div></div>
    <div class="row3">
      <div class="field"><label for="setCover">Dæk salget</label>
        <select id="setCover">${[1,1.5,2,3].map(v=>`<option value="${v}" ${+s.cover===v?'selected':''}>${v===1?'1 × solgt':v+' × solgt'}</option>`).join('')}</select></div>
      <div class="field"><label for="setRound">Afrunding til kasse</label>
        <select id="setRound"><option value="nearest" ${s.rounding==='nearest'?'selected':''}>Til nærmeste (15 → 12, 20 → 24)</option><option value="up" ${s.rounding==='up'?'selected':''}>Altid op (15 → 24)</option></select></div>
      <div class="field"><label for="setTheme">Udseende</label>
        <select id="setTheme"><option value="">Følg computeren</option><option value="light">Lyst</option><option value="dark">Mørkt</option></select></div>
    </div>
    <div class="field"><span class="lab">Særregler (varenavnet indeholder …)</span>
      <table class="rules-table"><thead><tr><th>Tekst</th><th>1 kasse =</th><th>Bestil i hele</th><th>Enhed</th><th></th></tr></thead>
      <tbody id="rulesBody">${s.rules.map(ruleRow).join('')}</tbody></table>
      <div><button class="btn sm" data-act="add-rule">Tilføj regel</button></div>
      <span class="help"><b>1 kasse =</b> antal lagerenheder i én kasse (Cola: 24 dåser). Appen trækker solgt × dette tal fra Winpos' lager, fordi Winpos ganger forkert, og regner salget om til kasser.<br><b>Bestil i hele:</b> Cola bestilles i 99 kasser, når der er brug for det.</span></div>
    <div class="field"><span class="lab">Huskede sekundære enheder</span>
      <span class="help">${plural(Object.keys(suMemory).length,'vare','varer')} husket. <button class="btn sm" data-act="clear-su" ${Object.keys(suMemory).length?'':'disabled'}>Slet alle</button></span></div>`;
  $('#setTheme').value = store.get('sb_theme','');
  $('#mSettings').classList.add('show');
}
function ruleRow(r){
  return `<tr><td><input type="text" data-r="match" value="${esc(r.match)}" aria-label="Tekst"></td>
    <td><input type="number" min="1" data-r="factor" value="${r.factor}" style="width:76px" aria-label="1 kasse ="></td>
    <td><input type="number" min="1" data-r="step" value="${r.step||1}" style="width:76px" aria-label="Bestil i hele"></td>
    <td><input type="text" data-r="unit" value="${esc(r.unit||'kasser')}" style="width:86px" aria-label="Enhed"><input type="hidden" data-r="note" value="${esc(r.note||'')}"><input type="hidden" data-r="cats" value="${esc(r.cats||'ltc')}"></td>
    <td><button class="x-btn" data-act="del-rule" title="Slet regel" aria-label="Slet regel">×</button></td></tr>`;
}
function saveSettings(){
  for (const c of CAT_KEYS) settings.minShelf[c] = Math.max(0, parseInt($('#min_'+c).value,10)||0);
  settings.buffer = $('#setBuffer').checked;
  settings.cover = +$('#setCover').value || 1;
  settings.rounding = $('#setRound').value;
  settings.showWinposStock = $('#setStock').checked;
  settings.rules = [...document.querySelectorAll('#rulesBody tr')].map(tr => {
    const g = k => tr.querySelector(`[data-r="${k}"]`).value;
    const r = { match:g('match').trim(), factor:Math.max(1,+g('factor')||1), step:Math.max(1,+g('step')||1), unit:g('unit').trim()||'kasser', cats:g('cats')||'ltc', note:g('note') };
    const old = settings.rules.find(o=>o.match===r.match);
    if (!old || old.factor!==r.factor || old.step!==r.step) r.note = `1 kasse = ${r.factor}. Bestilles i hele ${r.step} ${r.unit}.`;
    return r;
  }).filter(r=>r.match);
  store.set(K_SET, settings);
  applyTheme($('#setTheme').value);
  $('#mSettings').classList.remove('show');
  render(); toast('Indstillinger gemt');
}
function applyTheme(v){ store.set('sb_theme', v); if (v) document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme; }

function openHelp(){
  $('#helpBody').innerHTML = `
    <div><h3>Bestilling hver uge</h3><ol>
      <li>Eksportér LTC, Perfume og Andet fra Winpos som Excel.</li>
      <li>Gå til <b>Samlet</b> og træk alle tre filer ind på én gang. Appen ser på filnavnet, hvilken der er hvilken.</li>
      <li>Overskriften fortæller, om noget skal tjekkes. Tryk <b>Ret</b> ud for en linje for at hoppe direkte til den.</li>
      <li>Ret antal i <b>Bestil</b>-feltet eller med − og +. Enter går til næste linje.</li>
      <li>Orange sekundær enhed betyder, at den mangler i Winpos. Skriv den, så huskes den til næste uge.</li>
      <li>Tryk <b>Order Heinemann</b> for at hente bestillingsfilen. <b>Overblik til Excel</b> giver hele beregningen som regneark.</li>
    </ol></div>
    <div><h3>Regnestykket</h3><ul>
      <li><b>Reel lager</b> = lager i Winpos − solgt. Det er det, du har nu.</li>
      <li><b>Bestil</b> = solgt${settings.buffer?' + én kasse buffer':''} − reel lager, rundet til sekundær enhed. Dækker lageret, bestilles 0.</li>
      <li><b>Nyt lager</b> = reel lager + bestil. Det er det, du har, når varerne er kommet.</li>
      <li>Perfume og Andet: altid mindst ${settings.minShelf.perfume} og ${settings.minShelf.andet} på hylden.</li>
      <li>Cola og Fanta: lager og salg er i dåser, men Winpos har lagt solgt × 24 til lageret. Appen trækker det fra igen og regner i kasser á 24.</li>
    </ul></div>
    <div><h3>Varemodtagelse</h3><ol>
      <li>Vælg <b>Fakturaer</b> og upload CDL-filen fra Heinemann.</li>
      <li>Hver faktura får sin egen fane. "Sum passer" betyder, at linjerne stemmer med den gule sumlinje.</li>
      <li>Linjer med pris 0 (testere og POSM) er fravalgt. Flueben styrer, hvad der kommer med.</li>
      <li>Tryk <b>CSV til Winpos</b>. Du får én fil pr. faktura.</li>
    </ol></div>
    <div><h3>Farver</h3><ul>
      <li><span class="tag red">Orange</span> skal rettes. <span class="tag amber">Gul</span> er værd at kigge på. <span class="tag blue">Blå</span> er rettet af dig. <span class="tag teal">Grøn</span> er en særregel.</li>
    </ul></div>
    <p class="help">Alt gemmes kun i din egen browser. Brug "Gem backup" under Indstillinger, hvis du skifter computer.</p>`;
  $('#mHelp').classList.add('show');
}

/* =====================================================================
   Render + hændelser
   ===================================================================== */
function render(){
  if (CATS[ui.view] === undefined && ui.view !== 'overview') ui.view = 'overview';
  renderRail();
  if (ui.section === 'receive') renderReceive(); else renderOrder();
}
function pickFile(cat){ const i = $('#file_'+cat); if (i){ i.value=''; i.click(); } }
async function loadAny(files){
  const unknown = [];
  for (const f of files){
    let c = guessCat(f.name);
    if (!c && ui.section==='receive') c = 'cdl';
    if (!c && ui.section==='order' && CATS[ui.view] && files.length===1) c = ui.view;
    if (c==='cdl') await rxLoad(f); else if (c) await loadOrderFile(c, f); else unknown.push(f.name);
  }
  if (CAT_KEYS.filter(c=>files.some(f=>guessCat(f.name)===c)).length > 1){ ui.section='order'; ui.view='overview'; saveUi(); render(); }
  if (unknown.length) toast('Kunne ikke se, hvilken kategori filen hører til: ' + unknown.join(', ') + '. Åbn kategorien og upload den der.');
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  switch (t.dataset.act){
    case 'nav': ui.section = t.dataset.s; if (t.dataset.v) ui.view = t.dataset.v; Object.assign(ui, { filter:'all', q:'', sort:{key:null,dir:1} }); saveUi(); render(); window.scrollTo({top:0}); break;
    case 'pick': pickFile(t.dataset.cat); break;
    case 'clear': if (confirm(`Fjern ${CATS[t.dataset.cat].name}-filen og dine rettelser?`)){ delete session.data[t.dataset.cat]; session.overrides[t.dataset.cat]={}; saveSession(); render(); } break;
    case 'filter': ui.filter = t.dataset.v; renderCat(ui.view); break;
    case 'sort': { const k=t.dataset.k; ui.sort = ui.sort.key===k ? {key:k,dir:-ui.sort.dir} : {key:k,dir:(['desc','code','art'].includes(k)?1:-1)}; renderCat(ui.view); break; }
    case 'step': { const cat=ui.view, x=computed(cat).find(r=>r.code===t.dataset.code); setOverride(cat, t.dataset.code, Math.max(0, x.final + (+t.dataset.d))); break; }
    case 'goto': Object.assign(ui, { section:'order', view:t.dataset.cat, filter:'all', q:t.dataset.code, sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'reset-ov': session.overrides[ui.view]={}; saveSession(); render(); toast('Rettelser nulstillet'); break;
    case 'hide-info': ui.hiddenInfo[t.dataset.cat] = true; saveUi(); render(); break;
    case 'print': window.print(); break;
    case 'export-order': openExport(); break;
    case 'do-export': doExport(); break;
    case 'copy-lines': copyLines(); break;
    case 'export-overview': exportOverview(); break;
    case 'settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-settings': if (confirm('Nulstil indstillinger til standard?')){ settings = structuredClone(DEFAULT_SETTINGS); store.set(K_SET,settings); openSettings(); render(); } break;
    case 'add-rule': $('#rulesBody').insertAdjacentHTML('beforeend', ruleRow({match:'',factor:24,step:1,unit:'kasser',cats:'ltc'})); break;
    case 'del-rule': t.closest('tr').remove(); break;
    case 'clear-su': if (confirm('Slet alle huskede sekundære enheder?')){ suMemory={}; store.set(K_SU,suMemory); t.disabled=true; render(); } break;
    case 'backup': { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify({settings,suMemory,rxPref,v:3},null,2)],{type:'application/json'})); a.download='shop-bestilling-backup.json'; a.click(); break; }
    case 'help': openHelp(); break;
    case 'close': t.closest('.modal-bg').classList.remove('show'); break;
    case 'rx-clear': if (confirm('Fjern CDL-filen og dine fravalg?')){ rx=null; store.del(K_RX); render(); } break;
    case 'rx-inv': rui.inv = t.dataset.v; renderReceive(); break;
    case 'rx-filter': rui.filter = t.dataset.v; renderReceive(); break;
    case 'rx-sort': { if (e.target.matches('input')) break; const k=t.dataset.k; rui.sort = rui.sort.key===k ? {key:k,dir:-rui.sort.dir} : {key:k,dir:RX_COLS.find(c=>c.k===k)?.num?-1:1}; renderReceive(); break; }
    case 'rx-all': { const on = t.dataset.v==='1', L = rxVisible(); L.forEach(r=>r.on=on); rxSave(); render(); toast(`${plural(L.length,'linje','linjer')} ${on?'sat flueben ved':'fravalgt'}`); break; }
    case 'rx-clearf': rui.colf = {}; renderReceive(); break;
    case 'rx-export': openCsv(); break;
    case 'do-csv': doCsv(); break;
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key==='Enter' || e.key===' ') && t.classList?.contains('drop')){ e.preventDefault(); t.click(); return; }
  if (e.key==='Enter' && (t.dataset?.qty!=null || t.dataset?.su!=null)){
    e.preventDefault();
    const attr = t.dataset.qty!=null ? 'data-qty' : 'data-su';
    const list = [...document.querySelectorAll(`[${attr}]`)];
    const next = list[list.indexOf(t) + (e.shiftKey?-1:1)]?.getAttribute(attr);
    const nextSel = next!=null ? `[${attr}="${CSS.escape(next)}"]` : '';
    t.dataset.nextSel = nextSel;
    t.blur();
    if (nextSel){ const n = document.querySelector(nextSel); if (n){ n.focus(); n.select(); } }
  }
  if (e.key==='Escape') document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id?.startsWith('file_') && t.files.length){
    const cat = t.id.slice(5), files = [...t.files];
    if (cat==='any') loadAny(files); else if (cat==='cdl') rxLoad(files[0]); else loadOrderFile(cat, files[0]);
    return;
  }
  if (t.id==='inRestore' && t.files[0]){
    t.files[0].text().then(txt => {
      try{ const j = JSON.parse(txt); if (j.settings && j.settings.v===3){ store.set(K_SET, j.settings); settings = loadSettings(); }
        if (j.suMemory) suMemory = j.suMemory; if (j.rxPref) rxPref = Object.assign(rxPref, j.rxPref);
        store.set(K_SU,suMemory); store.set(K_RXP, rxPref); openSettings(); render(); toast('Backup indlæst'); }
      catch(err){ alert('Filen er ikke en gyldig backup.'); }
    });
    return;
  }
  if (t.dataset.qty!=null){ const ns = t.dataset.nextSel; setOverride(ui.view, t.dataset.qty, t.value); if (ns){ const n=document.querySelector(ns); if(n){ n.focus(); n.select(); } } return; }
  if (t.dataset.su!=null){
    const v = parseSU(t.value), code = t.dataset.su, ns = t.dataset.nextSel;
    if (t.value.trim()==='') delete suMemory[code];
    else if (!v){ toast('Sekundær enhed skal være et helt tal'); render(); return; }
    else suMemory[code] = v;
    store.set(K_SU, suMemory);
    delete session.overrides[ui.view][code]; saveSession();
    refreshOrder(ns || undefined);
    toast(v ? `Sekundær enhed ${v} gemt. Den huskes til næste uge.` : 'Sekundær enhed fjernet');
    return;
  }
  if (t.dataset.rxon!=null){
    rx.rows[+t.dataset.rxon].on = t.checked; rxSave();
    const st = document.querySelector('.tablewrap')?.scrollTop;
    render(); const w=document.querySelector('.tablewrap'); if (w && st!=null) w.scrollTop = st;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='q'){ ui.q = t.value; renderCatBody(ui.view); return; }
  if (t.id==='rxQ'){ rui.q = t.value; rxRenderBody(); return; }
  if (t.dataset.colf!=null){ rui.colf[t.dataset.colf] = t.value; t.classList.toggle('act', !!t.value.trim()); rxRenderBody(); const b=$('#rxClearF'); if (b) b.disabled = !Object.values(rui.colf).some(x=>x&&x.trim()); }
});

['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  const z = e.target.closest?.('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach(x=>x.classList.toggle('drag', x===z));
}));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag')); });
document.addEventListener('drop', e => {
  e.preventDefault();
  document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));
  const files = [...(e.dataTransfer?.files||[])];
  if (!files.length) return;
  const z = e.target.closest?.('[data-drop]');
  const c = z?.dataset.drop;
  if (c && c!=='any' && files.length===1) return c==='cdl' ? rxLoad(files[0]) : loadOrderFile(c, files[0]);
  loadAny(files);
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('mousedown', e => { if (e.target===m) m.classList.remove('show'); }));

applyTheme(store.get('sb_theme',''));
render();
</script>
