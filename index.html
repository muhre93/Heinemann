<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bestilling</title>
<meta name="description" content="Bestilling ud fra Winpos-eksporter med eksport til Order Heinemann, og varemodtagelse fra CDL-fil til Winpos-CSV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2313243A'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23D4A23C' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF2F6; --card:#FFFFFF; --card-2:#F6F8FB; --sunk:#E9EEF4;
  --ink:#162334; --ink-2:#56667A; --ink-3:#8B98A9; --line:#DFE5EC; --line-2:#CDD6E0;
  --head:#13243A; --head-2:#1B3150; --head-ink:#C9D5E3;
  --gold:#D4A23C; --gold-ink:#9A6F14; --gold-soft:#FBF2DE;
  --ok:#2E9D72; --ok-soft:#E3F4EC; --warn:#C9921C; --warn-soft:#FBF0D9; --bad:#D9534B; --bad-soft:#FBE7E5; --man:#3C6CD6; --man-soft:#E6EDFC;
  --c-ltc:#4F86C6; --c-perfume:#C2649A; --c-andet:#3BA59A; --c-cosmetic:#8C6BD1;
  --r:12px; --shadow:0 1px 2px rgba(19,36,58,.05),0 4px 14px rgba(19,36,58,.05);
}
:root[data-theme="dark"]{
  --bg:#1A2533; --card:#223042; --card-2:#26364A; --sunk:#1D2a3A;
  --ink:#E7EDF4; --ink-2:#A9B6C6; --ink-3:#7A899C; --line:#304055; --line-2:#3B4D64;
  --head:#121C29; --head-2:#1C2B3E; --head-ink:#B5C3D3;
  --gold:#E2B04F; --gold-ink:#E9BE68; --gold-soft:#3A3222;
  --ok:#5BC496; --ok-soft:#1F3A33; --warn:#E7B94E; --warn-soft:#3A3322; --bad:#F07B72; --bad-soft:#43292C; --man:#8FB0F5; --man-soft:#26344F;
  --c-ltc:#6FA0DA; --c-perfume:#D683B2; --c-andet:#55BFB3; --c-cosmetic:#A58BE2;
  --shadow:0 1px 2px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
.wrap{max-width:1480px;margin:0 auto;padding:0 28px}
@media (max-width:720px){ .wrap{padding:0 16px} }

/* ---------- Topbjælke ---------- */
.top{background:var(--head);color:#fff}
.top .wrap{display:flex;align-items:center;gap:16px;padding-top:16px;padding-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto}
.brand .logo{width:46px;height:46px;border-radius:50%;background:var(--head-2);display:grid;place-items:center;border:2px solid rgba(255,255,255,.12)}
.brand .k{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15;color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.lang button{border:none;background:transparent;color:var(--head-ink);padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer}
.lang button.on{background:var(--gold);color:#1b1405}
.tb{border:1px solid rgba(255,255,255,.18);background:transparent;color:#E8EEF5;padding:8px 13px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.tb:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.05)}
.tb.gold{background:var(--gold);border-color:var(--gold);color:#1b1405}
.tb.gold:hover{filter:brightness(1.06)}
.tb.icon{padding:8px 10px}
.tb:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:720px){ .tb .lbl{display:none} .brand .logo{width:38px;height:38px} .brand h1{font-size:18px} }

/* ---------- Filbjælke ---------- */
.filebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);background:var(--card);border-radius:10px;padding:6px 8px 6px 11px;font-size:13.5px;font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cat)}
.chip .n{font-weight:500;color:var(--ink-3)}
.chip .x{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;padding:0 3px;border-radius:5px}
.chip .x:hover{color:var(--bad);background:var(--bad-soft)}
.chip.week{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-ink);padding-right:11px}
.chip.missing{border-style:dashed;color:var(--ink-3);font-weight:600;cursor:pointer;background:transparent}
.chip.missing:hover{border-color:var(--ink-3);color:var(--ink)}
.addbtn{border:1.5px solid var(--line-2);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13.5px;cursor:pointer}
.addbtn:hover{border-color:var(--ink-3)}

/* ---------- Faner ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-top:14px;overflow-x:auto}
.tab{border:none;background:none;padding:12px 15px 11px;font-weight:700;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center;font-size:14.5px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab .b{min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:11.5px;display:inline-grid;place-items:center;padding:0 6px}
.tab .cd{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.tabdesc{display:flex;gap:8px;align-items:center;color:var(--ink-2);margin:14px 0 18px;font-size:14px}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:800;cursor:help;flex-shrink:0;border:1px solid var(--line-2)}

/* ---------- Kort ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.card .sub{margin:3px 0 16px;color:var(--ink-2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.kpis{grid-template-columns:1fr}}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.kpi-body{display:flex;gap:20px;align-items:center}
.kpi-body svg{flex-shrink:0}
.legend-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:9px;align-items:center;font-size:13.5px}
.lg .sw{width:10px;height:10px;border-radius:3px;background:var(--cat)}
.lg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .v{font-weight:800}
.lg .p{color:var(--ink-3);font-size:12px;min-width:34px;text-align:right}
.bignum{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.bignum small{font-size:15px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:6px}
.delta{font-size:12.5px;font-weight:700;margin-top:4px}
.delta.up{color:var(--gold-ink)} .delta.down{color:var(--ok)}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.br{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.br .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.br .fl{height:100%;border-radius:4px;background:var(--cat)}
.br .v{text-align:right;font-weight:700}
.stat-rows{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13.5px}
.stat-rows div{display:flex;justify-content:space-between;gap:10px}
.stat-rows b.bad{color:var(--bad)} .stat-rows b.warn{color:var(--warn)} .stat-rows b.man{color:var(--man)}

.issue{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:none}
.issue .sw{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.issue b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue span.m{font-size:12.5px;color:var(--ink-3)}
@media (max-width:600px){ .issue{grid-template-columns:10px minmax(0,1fr) auto} .issue .tag{display:none} }
.allok{display:flex;gap:12px;align-items:center;color:var(--ok);font-weight:800;font-size:16px;padding:8px 0}
.top-list{list-style:none;margin:0;padding:0}
.top-list li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.top-list li:first-child{border-top:none}
.top-list .sw{width:10px;height:10px;border-radius:3px;background:var(--cat)}
.top-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-list .v{white-space:nowrap;color:var(--ink-2)}
.top-list .v b{color:var(--ink)}

.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:1.5}
.tag.red{background:var(--bad-soft);color:var(--bad)}
.tag.amber{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--man-soft);color:var(--man)}
.tag.teal{background:var(--ok-soft);color:var(--ok)}
.tag.grey{background:var(--sunk);color:var(--ink-2)}

/* ---------- Upload ---------- */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);background:var(--card);padding:56px 24px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover,.drop.drag{border-color:var(--gold);background:var(--gold-soft)}
.drop .ico{font-size:34px;line-height:1}
.drop h2{margin:14px 0 6px;font-size:20px;font-weight:800}
.drop p{margin:0 auto;color:var(--ink-2);max-width:56ch}
.drop .cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.drop .cats span{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line-2);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;background:var(--card)}
.drop .cats i{width:8px;height:8px;border-radius:50%;background:var(--cat)}

/* ---------- Værktøjslinje + tabel ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:10px;background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:10px;gap:2px;flex-wrap:wrap;border:1px solid var(--line)}
.seg button,.seg label{border:none;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.seg button:hover,.seg label:hover{color:var(--ink)}
.seg .on,.seg label:has(input:checked){background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg input{display:none}
.seg .c{color:var(--ink-3);margin-left:6px;font-weight:600}
.seg .c.r{color:var(--bad)}
.btn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1405}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--gold)}

.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 150px);min-height:220px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{position:sticky;top:0;background:var(--card-2);z-index:2;text-align:left;font-size:12.5px;font-weight:800;color:var(--ink-2);padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th .arr{font-size:10px;color:var(--gold)}
th.r,td.r{text-align:right;white-space:nowrap}
th.col-order{color:var(--gold-ink)}
td.col-order,th.col-order{background:color-mix(in srgb,var(--gold-soft) 55%,var(--card))}
thead th.col-order{background:color-mix(in srgb,var(--gold-soft) 85%,var(--card-2))}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card-2)}
tbody tr:hover td.col-order{background:color-mix(in srgb,var(--gold-soft) 80%,var(--card))}
tr.st-red td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.st-amber td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.zero td{color:var(--ink-3)}
tr.zero td.desc .d{color:var(--ink-2);font-weight:600}
td.desc{min-width:240px;max-width:400px}
td.desc .d{font-weight:700}
td.desc .why{font-size:12px;color:var(--ink-3);margin-top:2px}
td.code{font-size:13px;white-space:nowrap;color:var(--ink-3)}
td .u{font-size:11px;color:var(--ink-3);margin-left:3px;font-weight:600}
td.neg{color:var(--bad);font-weight:800}
td.newst{font-weight:800}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.su-in{width:62px;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);text-align:right}
.su-in.missing{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.su-in.missing::placeholder{color:var(--bad);font-weight:800}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--card)}
.qty button{border:none;background:transparent;width:30px;height:34px;cursor:pointer;font-size:17px;color:var(--ink-3)}
.qty button:hover{background:var(--sunk);color:var(--ink)}
.qty input{width:56px;border:none;text-align:center;height:34px;font-weight:800;font-size:16px;background:transparent}
.qty.has{border-color:var(--gold)}
.qty.manual{border:2px solid var(--man)} .qty.manual input{color:var(--man)}
.qty input:focus{outline:none} .qty:focus-within{box-shadow:0 0 0 2px var(--gold)}
tfoot td{position:sticky;bottom:0;background:var(--card-2);font-weight:800;border-top:1px solid var(--line);padding:10px 12px;z-index:1}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-2)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Modtagelse */
.inv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.inv{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.inv:hover{border-color:var(--line-2)}
.inv.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.inv .no{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.inv .amt{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:2px 0}
.inv .st{font-size:12.5px;font-weight:700}
.inv .st.ok{color:var(--ok)} .inv .st.bad{color:var(--bad)}
.inv .m{font-size:12.5px;color:var(--ink-2)}
.rx-table td.chk,.rx-table th.chk{width:44px;text-align:center}
.rx-table input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer;vertical-align:middle}
.rx-table tr.off td{color:var(--ink-3)}
.rx-table tr.off td.desc .d{text-decoration:line-through;color:var(--ink-3);font-weight:600}
.rx-table thead tr.f th{top:41px;padding:6px;background:var(--card);cursor:default}
.rx-table thead tr.f input{width:100%;min-width:56px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--card);font-weight:500}
.rx-table thead tr.f input.act{border-color:var(--gold);background:var(--gold-soft)}

/* ---------- Dialoger ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,28,.55);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:48px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:14px;max-width:640px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:780px}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:18px;font-weight:800}
.modal .body{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:24px;line-height:1;padding:2px 6px;border-radius:6px}
.x-btn:hover{background:var(--sunk);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lab{font-size:14px;font-weight:800}
.help{font-size:13px;color:var(--ink-2)}
.field input[type=number],.field input[type=text],.field select{padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row3,.row4{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--gold);flex-shrink:0}
.note{padding:11px 13px;border-radius:9px;font-size:14px}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)}
.rules-table{width:100%;font-size:14px;border-collapse:collapse}
.rules-table th{font-size:12.5px;color:var(--ink-2);font-weight:700;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);position:static;background:none;cursor:default}
.rules-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.rules-table input{width:100%;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--card)}
.csv-preview{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--sunk);border-radius:9px;padding:10px 12px;white-space:pre;overflow:auto;max-height:150px}
.helpdoc h3{font-size:16px;margin:0 0 6px}
.helpdoc ol,.helpdoc ul{margin:0;padding-left:20px}
.helpdoc li{margin:5px 0}

'use strict';
/* =====================================================================
   Shop Bestilling (DA/EN) — én fil til GitHub Pages
   ===================================================================== */
const CATS = {
  ltc:      { suMode:'strict',  color:'var(--c-ltc)' },
  perfume:  { suMode:'none',    color:'var(--c-perfume)' },
  andet:    { suMode:'numeric', color:'var(--c-andet)' },
  cosmetic: { suMode:'numeric', color:'var(--c-cosmetic)' },
};
const CAT_KEYS = Object.keys(CATS);

/* Særregler: factor = antal stk i én kasse. Winpos lægger fejlagtigt
   solgt × factor til lageret ("New stock"), så lager nu = New stock − solgt × factor.
   Salget er i stk og regnes om til kasser. step = der bestilles i hele "step" kasser. */
const DEFAULT_SETTINGS = {
  v: 4, lang: 'da', theme: 'light',
  minShelf: { ltc:0, perfume:4, andet:4, cosmetic:4 },
  buffer: true, cover: 1, rounding: 'nearest', showWinposStock: false, showCalc: false,
  rules: [
    { match:'coca cola',   cats:'ltc', factor:24, step:99 },
    { match:'fanta',       cats:'ltc', factor:24, step:99 },
    { match:'redbull',     cats:'ltc', factor:24, step:1 },
    { match:'capri sonne', cats:'ltc', factor:4,  step:1 },
  ],
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const K_SET='sb_settings_v4', K_SU='sb_su_memory_v1', K_SES='sb_session_v1', K_RX='sb_receive_v1', K_RXP='sb_receive_pref_v1', K_UI='sb_ui_v3', K_HIST='sb_history_v1';

function loadSettings(){
  const d = structuredClone(DEFAULT_SETTINGS);
  let s = store.get(K_SET, null);
  if (!s){
    const old = store.get('sb_settings_v3', null);           // flyt gamle indstillinger med
    if (old){ s = { minShelf: old.minShelf, buffer: old.buffer, cover: old.cover, rounding: old.rounding, showWinposStock: old.showWinposStock }; }
  }
  if (!s) return d;
  const out = Object.assign(d, s, { minShelf: Object.assign(d.minShelf, s.minShelf||{}) });
  if (!s.rules) out.rules = d.rules;
  return out;
}
let settings = loadSettings();
let suMemory = store.get(K_SU, {});
let session  = store.get(K_SES, null) || { data:{}, overrides:{} };
for (const c of CAT_KEYS) session.overrides[c] = session.overrides[c] || {};
let rx = store.get(K_RX, null);
let rxPref = Object.assign({ autoZero:true, sep:';', dec:',', header:true, headers:['Article','Qty','Price/Qty'], mode:'split' }, store.get(K_RXP, {}));
let history = store.get(K_HIST, []);
const uiSaved = store.get(K_UI, {});
const ui  = { tab: uiSaved.tab || 'overview', filter:'all', q:'', sort:{key:null,dir:1} };
const rui = { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} };
function saveUi(){ store.set(K_UI, { tab:ui.tab }); }
function saveSettingsStore(){ store.set(K_SET, settings); }

/** Tal fra Winpos-celler: 46 · "46 Stk" · "9.872 0,33ltr" (punktum = tusind) · "2,5" */
function parseNum(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/ /g,' ').trim().match(/^-?[\d.,]+/);
  if (!m) return null;
  let s = m[0];
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/** Sekundær enhed tæller kun hvis det er et rent tal (12, 24 …) */
function parseSU(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v > 0 ? v : null;
  const s = String(v).trim();
  return /^\d+$/.test(s) && +s > 0 ? +s : null;
}
function detectWeek(name){ const m = String(name||'').match(/(?:week|uge|wk)[\s_-]*(\d{1,2})/i); return m ? +m[1] : null; }
function isoWeek(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(),0,1))) / 86400000 + 1) / 7);
}
function guessCat(name){
  const n = String(name||'').toLowerCase();
  if (/cosm|hygi|hyg/.test(n)) return 'cosmetic';
  if (/ltc/.test(n)) return 'ltc';
  if (/perfum|parfum/.test(n)) return 'perfume';
  if (/andet|other|misc/.test(n)) return 'andet';
  if (/cdl|transp/.test(n)) return 'cdl';
  return null;
}


/* =====================================================================
   Indbygget .xlsx-læser.
   Heinemanns CDL-filer er pakket med Windows-stier ("xl\worksheets\…"),
   som Excel-biblioteket ikke kan åbne. Denne læser klarer det.
   ===================================================================== */
async function inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('Ikke en .xlsx-fil');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/').replace(/^\/+/, '');
    files[name.toLowerCase()] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  return {
    async text(path){
      const f = files[path.replace(/\\/g,'/').replace(/^\/+/, '').toLowerCase()];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return new TextDecoder().decode(out).replace(/^﻿/, '');
    }
  };
}
async function readXlsxNative(buf){
  const z = unzip(buf);
  const P = s => new DOMParser().parseFromString(s, 'application/xml');
  const wbTxt = await z.text('xl/workbook.xml');
  if (!wbTxt) throw new Error('Mangler workbook.xml');
  const wb = P(wbTxt);
  const rels = {};
  const relTxt = await z.text('xl/_rels/workbook.xml.rels');
  if (relTxt) for (const r of P(relTxt).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
  const ss = [];
  const ssTxt = await z.text('xl/sharedStrings.xml');
  if (ssTxt) for (const si of P(ssTxt).getElementsByTagName('si')){
    let t = ''; for (const x of si.getElementsByTagName('t')) if (x.parentNode.nodeName !== 'rPh') t += x.textContent; ss.push(t);
  }
  const colIdx = ref => { const m = /^([A-Z]+)/.exec(ref||''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; };
  const out = [];
  let si = 0;
  for (const sh of wb.getElementsByTagName('sheet')){
    si++;
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = (rels[rid] || `worksheets/sheet${si}.xml`).replace(/\\/g,'/');
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    const txt = await z.text(target);
    if (!txt) continue;
    const doc = P(txt), aoa = [];
    let rAuto = 0;
    for (const row of doc.getElementsByTagName('row')){
      const ri = row.getAttribute('r') ? +row.getAttribute('r') - 1 : rAuto;
      rAuto = ri + 1;
      const arr = []; let cAuto = 0;
      for (const c of row.getElementsByTagName('c')){
        let ci = colIdx(c.getAttribute('r')); if (ci < 0) ci = cAuto; cAuto = ci + 1;
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : null;
        let val = null;
        if (t === 's') val = v != null ? ss[+v] : null;
        else if (t === 'inlineStr'){ const is = c.getElementsByTagName('t'); val = [...is].map(x=>x.textContent).join(''); }
        else if (t === 'str' || t === 'e') val = v;
        else if (t === 'b') val = v === '1';
        else if (v != null && v !== ''){ const n = +v; val = isNaN(n) ? v : n; }
        arr[ci] = val;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = null;
      aoa[ri] = arr;
    }
    for (let i = 0; i < aoa.length; i++) if (!aoa[i]) aoa[i] = [];
    out.push({ name: sh.getAttribute('name'), aoa });
  }
  if (!out.length) throw new Error('Ingen ark fundet');
  return out;
}
/** Læs regneark → [{name, aoa}] — indbygget læser til .xlsx, Excel-biblioteket til .xls */
async function readSheets(file){
  const buf = await file.arrayBuffer();
  const isZip = new Uint8Array(buf, 0, 2)[0] === 0x50 && new Uint8Array(buf, 0, 2)[1] === 0x4b;
  let nativeErr = null;
  if (isZip && typeof DecompressionStream !== 'undefined'){
    try { return await readXlsxNative(buf); } catch(e){ nativeErr = e; console.warn('Indbygget læser fejlede, prøver biblioteket', e); }
  }
  if (typeof XLSX === 'undefined') throw nativeErr || new Error('Excel-læseren kunne ikke indlæses (kræver internet første gang).');
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(n => ({ name:n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null }) }));
}

/* =====================================================================
   BESTILLING
   ===================================================================== */
function parseWinpos(aoa){
  let h = -1;
  for (let i=0;i<Math.min(aoa.length,60);i++){
    const r = (aoa[i]||[]).map(x => String(x??'').trim().toLowerCase());
    if (r.includes('code') && r.includes('description')) { h=i; break; }
  }
  if (h<0) throw new Error('Kunne ikke finde kolonnerne "Code" og "Description".');
  const head = aoa[h].map(x => String(x??'').trim().toLowerCase());
  const col = (...names) => { for (const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const C = {
    code: col('code'), desc: col('description'), sold: col('quantity'),
    stock: col('new stock','in stock','stock'), price: col('purchase price eur','purchase price'),
    su: col('secondary unit'), art: col('artikel nr','artikel nr.','article no'), unit: col('unit'),
  };
  const missing = ['code','desc','sold','stock'].filter(k => C[k]<0);
  if (missing.length) throw new Error('Mangler kolonner: ' + missing.join(', '));
  const meta = {};
  for (let i=0;i<h;i++){ const r=aoa[i]||[]; const k=String(r[1]??'').trim(); if(k && r[2]!=null) meta[k]=String(r[2]).trim(); }
  const rows = [];
  for (let i=h+1;i<aoa.length;i++){
    const r = aoa[i]||[];
    const code = r[C.code];
    if (code==null || String(code).trim()==='') continue;
    const desc = String(r[C.desc]??'').replace(/ /g,' ').trim();
    if (!desc) continue;
    rows.push({
      code: String(code).trim(), desc,
      sold: parseNum(r[C.sold]) ?? 0, stock: parseNum(r[C.stock]) ?? 0, stockRaw: String(r[C.stock]??'').trim(),
      price: C.price>=0 ? (parseNum(r[C.price]) ?? 0) : 0,
      suRaw: C.su>=0 ? (r[C.su]==null ? '' : String(r[C.su]).trim()) : '',
      art: C.art>=0 ? (r[C.art]==null ? '' : String(r[C.art]).trim()) : '',
      unit: C.unit>=0 ? String(r[C.unit]??'').trim() : '',
    });
  }
  return { meta, rows };
}

function roundTo(x, step, mode){
  if (x <= 0) return 0;
  return (mode==='up' ? Math.ceil(x/step - 1e-9) : Math.round(x/step + 1e-9)) * step;
}
function findRule(cat, desc){
  const d = desc.toLowerCase();
  return settings.rules.find(r => r.match && (!r.cats || r.cats.split(',').map(s=>s.trim()).includes(cat)) && d.includes(r.match.toLowerCase().trim())) || null;
}



/* =====================================================================
   Beregning
   ===================================================================== */
function calc(cat, row){
  const min = +settings.minShelf[cat] || 0;
  const cover = +settings.cover || 1;
  const flags = [];
  let su = 1, suSource = 'none', sug = 0, unit = '', real, soldDisp = row.sold, buf = 0, cx;
  const rule = findRule(cat, row.desc);

  if (rule){
    const f = +rule.factor || 1, step = +rule.step || 1;
    unit = t('cs');
    const realPcs = row.stock - row.sold * f;       // ret Winpos-fejlen
    real = realPcs / f; soldDisp = row.sold / f;
    buf = settings.buffer ? 1 : 0;
    const target = soldDisp * cover + buf, need = target - real;
    su = step; suSource = 'rule';
    sug = need > 0 ? Math.ceil(need / step - 1e-9) * step : 0;
    cx = need > 0 ? { k:'need', s:soldDisp*cover, b:buf, r:real, n:need, rd:true } : { k:'ok', r:real, tg:target };
    flags.push({ c:'teal', t:t('fl_rule', f) });
    if (realPcs < 0) flags.push({ c:'amber', t:t('fl_neg') });
  } else {
    real = row.stock - row.sold;
    if (CATS[cat].suMode !== 'none'){
      const fromFile = parseSU(row.suRaw), mem = suMemory[row.code];
      if (mem){ su = mem; suSource = 'memory'; }
      else if (fromFile){ su = fromFile; suSource = 'file'; }
      else if (CATS[cat].suMode === 'strict'){ su = 1; suSource = 'missing'; flags.push({ c:'red', t:t('fl_missing') }); }
      else { su = 1; suSource = 'ignored'; }
    }
    buf = settings.buffer && (suSource==='file' || suSource==='memory') ? su : 0;
    const base = row.sold * cover + buf, target = Math.max(base, min), need = target - real;
    sug = need > 0 ? roundTo(need, su, settings.rounding) : 0;
    if (min > 0 && real + sug < min) sug = Math.ceil((min - real) / su) * su;
    if (sug === 0 && real <= 0 && row.sold > 0) sug = su;
    cx = need > 0 ? (min > base ? { k:'min', m:min, r:real, n:need, rd:su>1 } : { k:'need', s:row.sold*cover, b:buf, r:real, n:need, rd:su>1 }) : { k:'ok', r:real, tg:target };
    if (real < 0) flags.push({ c:'amber', t:t('fl_neg') });
  }
  sug = Math.max(0, sug);
  const ov = session.overrides[cat][row.code];
  const manual = ov != null && ov !== '' && !isNaN(ov);
  const final = manual ? Math.max(0, +ov) : sug;
  if (manual) flags.push({ c:'blue', t:t('fl_manual', sug) });
  if (suSource === 'memory') flags.push({ c:'grey', t:t('fl_mem') });
  const status = flags.some(f=>f.c==='red') ? 'red' : flags.some(f=>f.c==='amber') ? 'amber' : 'ok';
  return { real, newStock: real + final, soldDisp, su, suSource, buf, sug, final, manual, unit, rule, cx, flags, status, value: final * (row.price||0) };
}
function calcText(x){
  const c = x.cx, d = v => x.rule ? fmt(v,1) : fmtq(v);
  if (!c) return '';
  if (c.k==='ok') return t('calc_ok', d(c.r), d(c.tg));
  if (c.k==='min') return t('calc_min', c.m, d(c.r), d(c.n), x.sug, c.rd);
  return t('calc_need', d(c.s), c.b, d(c.r), d(c.n), x.sug, c.rd);
}
function computed(cat){ const d = session.data[cat]; return d ? d.rows.map(r => Object.assign({ cat }, r, calc(cat, r))) : []; }
function summary(cat){
  const Lr = computed(cat);
  return { lines: Lr.length, order: Lr.filter(x=>x.final>0).length, units: Lr.reduce((a,x)=>a+x.final,0), value: Lr.reduce((a,x)=>a+x.value,0),
    red: Lr.filter(x=>x.status==='red').length, amber: Lr.filter(x=>x.status==='amber').length, manual: Lr.filter(x=>x.manual).length, list: Lr };
}

async function loadOrderFile(cat, file, quiet){

    if (!rows.length) throw new Error('0 rows');
    const g = guessCat(file.name);
    if (g && g !== cat && CATS[g] && !confirm(t('cMismatch', file.name, catName(g), catName(cat)))) return;

function donut(parts, size=132, w=16, center='', sub=''){
  const r = (size - w) / 2, C = 2 * Math.PI * r, tot = parts.reduce((a,p)=>a+p.v,0);
  let off = 0, segs = '';
  if (tot > 0) for (const p of parts){ if (p.v <= 0) continue; const len = p.v / tot * C; segs += `<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${p.color}" stroke-width="${w}" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`; off += len; }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"><circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--sunk)" stroke-width="${w}"/>${segs}
    <text x="50%" y="${size/2 + (sub?2:6)}" text-anchor="middle" font-size="${center.length>7?17:21}" font-weight="800" fill="var(--ink)">${esc(center)}</text>
    ${sub?`<text x="50%" y="${size/2+20}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink-3)">${esc(sub)}</text>`:''}</svg>`;
}
function gauge(pct, size=170){
  const w = 16, r = (size - w) / 2, cx = size/2, cy = size/2 + 4;
  const arc = p => { const a = Math.PI * (1 - p), x = cx + r*Math.cos(a), y = cy - r*Math.sin(a); return `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}`; };
  const col = pct >= 1 ? 'var(--ok)' : pct >= .97 ? 'var(--warn)' : 'var(--bad)';
  return `<svg width="${size}" height="${size/2+22}" viewBox="0 0 ${size} ${size/2+22}" role="img">
    <path d="${arc(1)}" fill="none" stroke="var(--sunk)" stroke-width="${w}" stroke-linecap="round"/>
    ${pct>0?`<path d="${arc(Math.min(1,pct))}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`:''}
    <text x="50%" y="${cy-6}" text-anchor="middle" font-size="30" font-weight="800" fill="${col}">${fmt(pct*100, pct<1&&pct>.99?1:0)}%</text></svg>`;
}

function catRows(all){
  const qq = ui.q.trim().toLowerCase();
  let R = all.filter(x => {
    if (ui.filter==='order' && !(x.final>0)) return false;
    if (ui.filter==='check' && x.status==='ok') return false;
    if (ui.filter==='manual' && !x.manual) return false;
    if (qq && !(x.desc.toLowerCase().includes(qq) || x.code.includes(qq) || x.art.includes(qq))) return false;
    return true;
  });
  const { key, dir } = ui.sort;
  if (key){
    const get = { code:x=>+x.code||x.code, art:x=>+x.art||x.art, desc:x=>x.desc.toLowerCase(), sold:x=>x.soldDisp, stock:x=>x.stock,
      real:x=>x.real, su:x=>x.su, price:x=>x.price, final:x=>x.final, newStock:x=>x.newStock, value:x=>x.value }[key];
    R = R.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  } else { const rank = { red:0, amber:1, ok:2 }; R = R.slice().sort((a,b)=> rank[a.status]-rank[b.status]); }
  return R;
}
function renderCatBody(cat, all){

/* =====================================================================
   Varemodtagelse — CDL fra Heinemann → CSV til Winpos
   ===================================================================== */
const RX_COLS = [
  { k:'inv', h:['billing document'] }, { k:'art', h:['article'] }, { k:'desc', h:['article description'] },
  { k:'qty', h:['delivery quantity'], num:true }, { k:'price', h:['price per sales unit'], num:true }, { k:'net', h:['net value'], num:true },
  { k:'ref', h:['customer reference','po number'] }, { k:'brand', h:['brand name'] }, { k:'mgrp', h:['material group'] },
  { k:'unit', h:['sales unit'], hidden:true }, { k:'credit', h:['credit price'], num:true, hidden:true }, { k:'gtin', h:['gtin'], hidden:true },
];
const RX_SHOW = RX_COLS.filter(c=>!c.hidden);
function rxSave(){ store.set(K_RX, rx); }
function parseCDL(sheets){
  for (const { aoa } of sheets){
    let h = -1;
    for (let i=0;i<Math.min(aoa.length,40);i++){ const r = (aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase()); if (r.includes('billing document') && r.includes('article')) { h=i; break; } }
    if (h<0) continue;
    const head = aoa[h].map(x=>String(x??'').trim().toLowerCase());
    const idx = {}; for (const c of RX_COLS) idx[c.k] = c.h.map(n=>head.indexOf(n)).find(i=>i>=0) ?? -1;
    if (idx.art<0 || idx.qty<0 || idx.price<0) throw new Error('Article / Delivery Quantity / Price per Sales Unit ?');
    const rows = [], sums = {}; let total = null;
    for (let i=h+1;i<aoa.length;i++){
      const r = aoa[i]||[], inv = String(r[idx.inv]??'').trim();
      if (!inv) continue;
      if (/[ƩΣ]/.test(inv)){ const no = inv.replace(/[ƩΣ]/g,'').trim(), v = { qty: parseNum(r[idx.qty]) ?? 0, net: parseNum(r[idx.net]) ?? 0 }; if (no) sums[no] = v; else total = v; continue; }
      const o = { id: rows.length };
      for (const c of RX_COLS){ const v = idx[c.k]>=0 ? r[idx[c.k]] : null; o[c.k] = c.num ? (parseNum(v) ?? 0) : String(v ?? '').trim(); }
      if (!o.art) continue;
      o.tester = /^T\s/.test(o.desc) || /^T8/i.test(o.mgrp);
      o.posm = /^X/i.test(o.mgrp) || /pseudo/i.test(o.brand) || /posm/i.test(o.ref);
      o.on = !(rxPref.autoZero && o.price === 0);
      rows.push(o);
    }
    if (rows.length) return { rows, sums, total };
  }
  throw new Error('"Billing Document" / "Article" ?');
}
async function rxLoad(file){
  try{
    const p = parseCDL(await readSheets(file));
    if (rx && rx.rows?.some(r=>!r.on && r.price!==0) && !confirm(t('cRxReplace'))) return;
    rx = { fileName:file.name, loadedAt:Date.now(), rows:p.rows, sums:p.sums, total:p.total };
    rxSave();
    Object.assign(rui, { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} });
    ui.tab = 'receive'; saveUi(); render();
    toast(t('tRx', p.rows.length, rxInvoices().length, p.rows.filter(r=>!r.on).length));
  }catch(e){ console.error(e); alert(t('errRead') + '\n' + e.message); }
}
function rxInvoices(){
  if (!rx) return [];
  const m = new Map();
  for (const r of rx.rows){
    if (!m.has(r.inv)) m.set(r.inv, { no:r.inv, lines:0, qty:0, net:0, on:0, onNet:0, refs:new Set(), zero:0 });
    const v = m.get(r.inv); v.lines++; v.qty += r.qty; v.net += r.net; if (r.ref) v.refs.add(r.ref);
    if (r.on){ v.on++; v.onNet += r.net; } if (r.price===0) v.zero++;
  }
  return [...m.values()].map(v => { const s = rx.sums?.[v.no]; v.sum = s; v.check = s ? (Math.abs(s.net - v.net) < 0.05 && Math.abs(s.qty - v.qty) < 0.001 ? 'ok' : 'diff') : 'none'; return v; });
}
function colMatch(col, val, f){
  f = f.trim(); if (!f) return true;
  if (col.num){
    const m = f.match(/^(>=|<=|<>|!=|>|<|=)\s*(-?[\d.,]+)$/);
    if (m){ const n = parseNum(m[2]); switch(m[1]){ case '>':return val>n; case '<':return val<n; case '>=':return val>=n; case '<=':return val<=n; case '=':return val===n; default:return val!==n; } }
    if (/^-?[\d.,]+$/.test(f)) return val === parseNum(f);
  }
  const neg = /^(!|<>)/.test(f), needle = f.replace(/^(!|<>)/,'').toLowerCase(), hit = String(val).toLowerCase().includes(needle);
  return neg ? !hit : hit;
}
function rxVisible(){
  if (!rx) return [];
  const qq = rui.q.trim().toLowerCase();
  let R = rx.rows.filter(r => {
    if (rui.inv!=='all' && r.inv!==rui.inv) return false;
    if (rui.filter==='on' && !r.on) return false;
    if (rui.filter==='off' && r.on) return false;
    if (rui.filter==='zero' && r.price!==0) return false;
    if (rui.filter==='tester' && !r.tester) return false;
    if (qq && !(r.desc.toLowerCase().includes(qq) || r.art.includes(qq) || r.brand.toLowerCase().includes(qq) || (r.gtin||'').includes(qq))) return false;
    for (const c of RX_SHOW){ const f = rui.colf[c.k]; if (f && !colMatch(c, r[c.k], f)) return false; }
    return true;
  });
  const { key, dir } = rui.sort;
  if (key){
    const col = RX_COLS.find(c=>c.k===key);
    const get = key==='on' ? (r=>r.on?1:0) : col?.num ? (r=>r[key]) : (r=>{ const v=r[key]; return /^\d+$/.test(v) ? +v : String(v).toLowerCase(); });
    R = R.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  }
  return R;
}

const csvField = (v, sep) => { const s = String(v ?? ''); return /["\r\n]/.test(s) || s.includes(sep) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const csvNum = (n, dec) => { const s = String(Math.round(n*10000)/10000); return dec===',' ? s.replace('.', ',') : s; };
function buildCsv(rows, p){
  const sep = p.sep==='tab' ? '\t' : p.sep, out = [];
  if (p.header) out.push(p.headers.map(h=>csvField(h,sep)).join(sep));
  for (const r of rows) out.push([csvField(r.art,sep), csvNum(r.qty,p.dec), csvNum(r.price,p.dec)].join(sep));
  return out.join('\r\n') + '\r\n';
}

}
function ruleRow(r){
  return `<tr><td><input type="text" data-r="match" value="${esc(r.match)}"></td><td><input type="number" min="1" data-r="factor" value="${r.factor}" style="width:84px"></td>
    <td><input type="number" min="1" data-r="step" value="${r.step||1}" style="width:84px"><input type="hidden" data-r="cats" value="${esc(r.cats||'ltc')}"></td>
    <td><button class="x-btn" data-act="del-rule" aria-label="×">×</button></td></tr>`;
}
function saveSettings(){
  for (const c of CAT_KEYS) settings.minShelf[c] = Math.max(0, parseInt($('#min_'+c).value,10)||0);
  settings.buffer = $('#setBuffer').checked; settings.showWinposStock = $('#setStock').checked;
  settings.cover = +$('#setCover').value || 1; settings.rounding = $('#setRound').value;
  settings.rules = [...document.querySelectorAll('#rulesBody tr')].map(tr => { const g = k => tr.querySelector(`[data-r="${k}"]`).value;
    return { match:g('match').trim().toLowerCase(), factor:Math.max(1,+g('factor')||1), step:Math.max(1,+g('step')||1), cats:g('cats')||'ltc' }; }).filter(r=>r.match);
  saveSettingsStore(); $('#mSettings').classList.remove('show'); render(); toast(t('tSaved'));
}
function applyTheme(){ document.documentElement.dataset.theme = settings.theme === 'dark' ? 'dark' : 'light'; document.documentElement.lang = settings.lang; }
function openHelp(){
  $('#mHelpT').textContent = t('hTitle');
  const li = a => a.map(x=>`<li>${esc(x)}</li>`).join('');
  $('#helpBody').innerHTML = `<div><h3>${t('hOrder')}</h3><ol>${li(L().hO)}</ol></div><div><h3>${t('hCalc')}</h3><ul>${li(L().hC)}</ul></div><div><h3>${t('hRx')}</h3><ol>${li(L().hR)}</ol></div><p class="help">${t('hPriv')}</p>`;
  $('#mHelp').classList.add('show');
}

/* =====================================================================
   Render + hændelser
   ===================================================================== */
function render(){
  if (!(ui.tab in CATS) && ui.tab!=='overview' && ui.tab!=='receive') ui.tab = 'overview';
  applyTheme(); renderTop(); renderFilebar(); renderTabs();
  if (ui.tab==='overview') renderOverview(); else if (ui.tab==='receive') renderReceive(); else renderCat(ui.tab);
}
function pickFile(cat){ const i = $('#file_'+cat); if (i){ i.value=''; i.click(); } }
async function loadAny(files){
  const unknown = [], hit = new Set();
  for (const f of files){
    let c = guessCat(f.name);
    if (!c && ui.tab==='receive') c = 'cdl';
    if (!c && CATS[ui.tab] && files.length===1) c = ui.tab;
    if (c==='cdl') await rxLoad(f); else if (c){ await loadOrderFile(c, f, files.length>1); hit.add(c); } else unknown.push(f.name);
  }
  if (hit.size > 1){ ui.tab = 'overview'; saveUi(); render(); }
  if (unknown.length) toast(t('tUnknown', unknown.join(', ')));
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (el.tagName === 'INPUT' && a !== 'none') return;
  switch (a){
    case 'tab': ui.tab = el.dataset.v; Object.assign(ui, { filter:'all', q:'', sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'lang': settings.lang = el.dataset.v; saveSettingsStore(); render(); break;
    case 'theme': settings.theme = settings.theme==='dark' ? 'light' : 'dark'; saveSettingsStore(); render(); break;
    case 'pick': pickFile(el.dataset.cat); break;
    case 'clear': if (confirm(t('cRemove', catName(el.dataset.cat)))){ delete session.data[el.dataset.cat]; session.overrides[el.dataset.cat]={}; saveSession(); render(); } break;
    case 'filter': ui.filter = el.dataset.v; renderCat(ui.tab); break;
    case 'sort': { const k=el.dataset.k; ui.sort = ui.sort.key===k ? {key:k,dir:-ui.sort.dir} : {key:k,dir:(['desc','code','art'].includes(k)?1:-1)}; renderCat(ui.tab); break; }
    case 'step': { const x = computed(ui.tab).find(r=>r.code===el.dataset.code); setOverride(ui.tab, el.dataset.code, Math.max(0, x.final + (+el.dataset.d))); break; }
    case 'goto': Object.assign(ui, { tab:el.dataset.cat, filter:'all', q:el.dataset.code, sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'reset-ov': session.overrides[ui.tab]={}; saveSession(); render(); toast(t('tReset')); break;
    case 'print': window.print(); break;
    case 'export-order': openExport(); break;
    case 'do-export': doExport(); break;
    case 'copy-lines': copyLines(); break;
    case 'export-overview': exportOverview(); break;
    case 'export-cat': exportOverview([el.dataset.cat]); break;
    case 'copy-summary': copySummary(); break;
    case 'settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-settings': if (confirm(t('cReset'))){ const lang=settings.lang, theme=settings.theme; settings = structuredClone(DEFAULT_SETTINGS); settings.lang=lang; settings.theme=theme; saveSettingsStore(); openSettings(); render(); } break;
    case 'add-rule': $('#rulesBody').insertAdjacentHTML('beforeend', ruleRow({match:'',factor:24,step:1,cats:'ltc'})); break;
    case 'del-rule': el.closest('tr').remove(); break;
    case 'clear-su': if (confirm(t('cClearSu'))){ suMemory={}; store.set(K_SU,suMemory); el.disabled=true; render(); } break;
    case 'backup': { const b=document.createElement('a'); b.href=URL.createObjectURL(new Blob([JSON.stringify({settings,suMemory,rxPref,history,v:4},null,2)],{type:'application/json'})); b.download='shop-bestilling-backup.json'; b.click(); break; }
    case 'restore': $('#inRestore').value=''; $('#inRestore').click(); break;
    case 'help': openHelp(); break;
    case 'close': el.closest('.modal-bg').classList.remove('show'); break;
    case 'rx-clear': if (confirm(t('cRxRemove'))){ rx=null; store.del(K_RX); render(); } break;
    case 'rx-inv': rui.inv = el.dataset.v; renderReceive(); break;
    case 'rx-filter': rui.filter = el.dataset.v; renderReceive(); break;
    case 'rx-sort': { const k=el.dataset.k; rui.sort = rui.sort.key===k ? {key:k,dir:-rui.sort.dir} : {key:k,dir:RX_COLS.find(c=>c.k===k)?.num?-1:1}; renderReceive(); break; }
    case 'rx-all': { const on = el.dataset.v==='1', R = rxVisible(); R.forEach(r=>r.on=on); rxSave(); render(); toast(t('tRxAll', R.length, on)); break; }
    case 'rx-clearf': rui.colf = {}; renderReceive(); break;
    case 'rx-export': openCsv(); break;
    case 'do-csv': doCsv(); break;
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.key==='Enter' || e.key===' ') && el.classList?.contains('drop')){ e.preventDefault(); el.click(); return; }
  if (e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)){ const s = $('#q') || $('#rxQ'); if (s){ e.preventDefault(); s.focus(); } return; }
  if (e.key==='Enter' && (el.dataset?.qty!=null || el.dataset?.su!=null)){
    e.preventDefault();
    const attr = el.dataset.qty!=null ? 'data-qty' : 'data-su', list = [...document.querySelectorAll(`[${attr}]`)];
    const next = list[list.indexOf(el) + (e.shiftKey?-1:1)]?.getAttribute(attr);
    const nextSel = next!=null ? `[${attr}="${CSS.escape(next)}"]` : '';
    el.dataset.nextSel = nextSel; el.blur();
    if (nextSel){ const n = document.querySelector(nextSel); if (n){ n.focus(); n.select(); } }
  }
  if (e.key==='Escape') document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id?.startsWith('file_') && el.files.length){
    const cat = el.id.slice(5), files = [...el.files];
    if (cat==='any') loadAny(files); else if (cat==='cdl') rxLoad(files[0]); else loadOrderFile(cat, files[0]);
    return;
  }
  if (el.id==='inRestore' && el.files[0]){
    el.files[0].text().then(txt => {
      try{ const j = JSON.parse(txt);
        if (j.settings){ const lang=settings.lang, theme=settings.theme; store.set(K_SET, j.settings.v===4 ? j.settings : { minShelf:j.settings.minShelf, buffer:j.settings.buffer }); settings = loadSettings(); settings.lang=lang; settings.theme=theme; }
        if (j.suMemory) suMemory = j.suMemory; if (j.rxPref) rxPref = Object.assign(rxPref, j.rxPref); if (j.history) history = j.history;
        store.set(K_SU,suMemory); store.set(K_RXP, rxPref); store.set(K_HIST, history); saveSettingsStore(); openSettings(); render(); toast(t('tRestored')); }
      catch(err){ alert(t('badBackup')); }
    });
    return;
  }
  if (el.dataset.actChange==='calc'){ settings.showCalc = el.checked; saveSettingsStore(); renderCatBody(ui.tab); return; }
  if (el.dataset.qty!=null){ const ns = el.dataset.nextSel; setOverride(ui.tab, el.dataset.qty, el.value); if (ns){ const n=document.querySelector(ns); if(n){ n.focus(); n.select(); } } return; }
  if (el.dataset.su!=null){
    const v = parseSU(el.value), code = el.dataset.su, ns = el.dataset.nextSel;
    if (el.value.trim()==='') delete suMemory[code]; else if (!v){ toast(t('tSuBad')); render(); return; } else suMemory[code] = v;
    store.set(K_SU, suMemory); delete session.overrides[ui.tab][code]; saveSession();
    refresh(ns || undefined); toast(v ? t('tSu', v) : t('tSuDel'));
    return;
  }
  if (el.dataset.rxon!=null){
    rx.rows[+el.dataset.rxon].on = el.checked; rxSave();
    const st = document.querySelector('.tablewrap')?.scrollTop; render(); const w=document.querySelector('.tablewrap'); if (w && st!=null) w.scrollTop = st;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id==='q'){ ui.q = el.value; renderCatBody(ui.tab); return; }
  if (el.id==='rxQ'){ rui.q = el.value; rxRenderBody(); return; }
  if (el.dataset.colf!=null){ rui.colf[el.dataset.colf] = el.value; el.classList.toggle('act', !!el.value.trim()); rxRenderBody(); const b=$('#rxClearF'); if (b) b.disabled = !Object.values(rui.colf).some(x=>x&&x.trim()); }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); const z = e.target.closest?.('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach(x=>x.classList.toggle('drag', x===z));
}));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag')); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));
  const files = [...(e.dataTransfer?.files||[])]; if (!files.length) return;
  const c = e.target.closest?.('[data-drop]')?.dataset.drop;
  if (c && c!=='any' && files.length===1) return c==='cdl' ? rxLoad(files[0]) : loadOrderFile(c, files[0]);
  loadAny(files);
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('mousedown', e => { if (e.target===m) m.classList.remove('show'); }));

render();
</script>
</body>
</html>
