<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bestilling</title>
<meta name="description" content="Bestilling ud fra Winpos-eksporter med eksport til Order Heinemann, og varemodtagelse fra CDL-fil til Winpos-CSV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2313243A'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23D4A23C' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ------------------------------------------------------------------
   Roligt arbejdsværktøj: lyse flader, hårfine linjer, én dæmpet
   petroleumsblå accent. Farve bruges kun til status og kategori.
   ------------------------------------------------------------------ */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --hover:#F2F4F7;
  --line:#E6E9EE; --line-2:#D8DDE4;
  --ink:#1D2330; --ink-2:#5A6372; --ink-3:#8F97A4;
  --accent:#2B5B86; --accent-hi:#234C71; --accent-soft:#EBF1F7;
  --red:#C0443C; --red-soft:#FBEEED; --amber:#A66A10; --amber-soft:#FBF3E3;
  --green:#2C7A57; --green-soft:#E8F3EE; --blue:#3D62C6; --blue-soft:#ECF0FA;
  --c-ltc:#5B82B0; --c-perfume:#B06A93; --c-andet:#4C978B; --c-cosmetic:#8A76C2;
  --r:10px; --hdr-h:57px;
  --shadow:0 1px 2px rgba(20,28,40,.04);
}
:root[data-theme="dark"]{
  --bg:#15181D; --surface:#1C2027; --surface-2:#20252D; --hover:#252A33;
  --line:#2A3039; --line-2:#363D48;
  --ink:#E3E7ED; --ink-2:#A1A9B5; --ink-3:#6E7786;
  --accent:#7EA7D3; --accent-hi:#9BBCE0; --accent-soft:#1F2A37;
  --red:#E48079; --red-soft:#372223; --amber:#DDB062; --amber-soft:#342C1D;
  --green:#6CC39A; --green-soft:#1B3027; --blue:#93ADF0; --blue-soft:#222B42;
  --c-ltc:#7FA2CF; --c-perfume:#CF8DB3; --c-andet:#6DB8AC; --c-cosmetic:#A898DA;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
.wrap{max-width:1440px;margin:0 auto;padding:0 32px}
@media (max-width:760px){ .wrap{padding:0 16px} }

/* ---------- Topbjælke ---------- */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.hdr-row{display:flex;align-items:center;gap:22px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap;color:var(--ink)}
.brand .mk{width:22px;height:22px;border-radius:50%;border:5px solid var(--accent);flex-shrink:0}
.nav{display:flex;gap:2px;align-self:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav button:first-child{padding-left:0}
.nav::-webkit-scrollbar{display:none}
.nav button{border:none;background:none;padding:0 12px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.nav .cnt{font-size:11px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:9px;padding:0 6px;line-height:18px}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.mnav{display:inline-flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.mnav button{border:none;background:none;padding:6px 14px;border-radius:7px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.mnav button:hover{color:var(--ink)}
.mnav button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mnav .cnt,.nav .cnt{font-size:11px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:9px;padding:0 6px;line-height:18px}
.sub-row{display:flex;min-height:42px}
.sub-row .nav{flex:1}
.nav button.add{color:var(--accent)}
.lang{display:inline-flex;gap:0;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.lang button{border:none;background:none;padding:4px 9px;font-size:12px;font-weight:600;color:var(--ink-3);cursor:pointer}
.lang button.on{background:var(--ink);color:var(--surface)}
.ib{border:none;background:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--ink)}
@media (max-width:760px){
  .hdr-row{gap:10px;padding:8px 0}
  .mnav{order:3;flex-basis:100%}
  .mnav button{flex:1;justify-content:center}
}

/* ---------- Knapper ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1722}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{flex-shrink:0;opacity:.85}
@media (max-width:760px){ .tools .btn .lbl{display:none} }

/* ---------- Sidehoved ---------- */
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:28px 0 20px}
.phead h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.phead h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.phead .meta{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.lead{color:var(--ink-2);margin:-8px 0 20px;max-width:90ch;font-size:13.5px}

/* ---------- Paneler ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;padding:16px 20px 12px}
.ph h2{margin:0;font-size:14.5px;font-weight:600}
.ph .s{color:var(--ink-3);font-size:13px}
.pb{padding:0 20px 16px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:1050px){.cols{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:18px 20px;border-left:1px solid var(--line);min-width:0}
.stat:first-child{border-left:none}
.stat .l{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat .v{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px;line-height:1.2}
.stat .v.red{color:var(--red)}
.stat .d{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
@media (max-width:860px){ .stats{grid-template-columns:1fr 1fr} .stat:nth-child(3){border-left:none} .stat:nth-child(n+3){border-top:1px solid var(--line)} }

.catrow{display:grid;grid-template-columns:10px minmax(150px,1.3fr) minmax(80px,1fr) 90px 100px 90px 18px;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.catrow:hover{background:var(--hover)}
.catrow .dt{width:10px;height:10px;border-radius:50%;background:var(--cat)}
.catrow .nm b{display:block;font-weight:600}
.catrow .nm span{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.catrow .bar i{display:block;height:100%;border-radius:3px;background:var(--cat)}
.catrow .n{text-align:right;color:var(--ink-2)}
.catrow .n.v{color:var(--ink);font-weight:600}
.catrow .iss{text-align:right;font-size:13px;color:var(--ink-3)}
.catrow .iss.r{color:var(--red);font-weight:500}
.catrow .ch{color:var(--ink-3)}
.catrow.off .nm b{color:var(--ink-2);font-weight:500}
@media (max-width:760px){ .catrow{grid-template-columns:10px minmax(0,1fr) auto 18px} .catrow .bar,.catrow .n:not(.v),.catrow .iss{display:none} }

.li{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 20px;border-top:1px solid var(--line)}
.li .dt{width:8px;height:8px;border-radius:50%;background:var(--cat)}
.li .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.li .v{color:var(--ink-2);white-space:nowrap;text-align:right}
.li .v b{color:var(--ink);font-weight:600}
.allok{display:flex;gap:10px;align-items:center;color:var(--green);padding:14px 20px 18px;border-top:1px solid var(--line)}
.more{padding:10px 20px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
@media (max-width:600px){ .li{grid-template-columns:8px minmax(0,1fr) auto} .li .st{display:none} }

.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.red{color:var(--red)} .st.amber{color:var(--amber)} .st.blue{color:var(--blue)} .st.teal{color:var(--green)} .st.grey{color:var(--ink-3)}

/* ---------- Tom tilstand ---------- */
.drop{display:block;width:100%;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--surface);padding:52px 24px;text-align:center;cursor:pointer;transition:border-color .12s,background .12s;color:var(--ink)}
.drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop .ico{width:44px;height:44px;border-radius:50%;background:var(--hover);display:inline-grid;place-items:center;color:var(--ink-2)}
.drop h2{margin:14px 0 6px;font-size:17px;font-weight:600}
.drop p{margin:0 auto;color:var(--ink-2);max-width:56ch}
.drop .hint{margin-top:10px;font-size:13px;color:var(--accent);font-weight:500}

/* ---------- Værktøjslinje ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--hover);padding:3px;border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{border:none;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button:hover,.seg label:hover{color:var(--ink)}
.seg .on,.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input{display:none}
.seg .c{color:var(--ink-3);margin-left:6px}
.seg .c.r{color:var(--red)}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{width:15px;height:15px;accent-color:var(--accent)}
.q{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line-2);color:var(--ink-3);font-size:10.5px;font-weight:600;cursor:help;flex-shrink:0}

/* ---------- Tabel (ruller med siden, ingen indre scrollbar) ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{position:sticky;top:var(--hdr-h);background:var(--surface-2);z-index:2;text-align:left;font-size:12.5px;font-weight:500;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead tr:first-child th:first-child{border-top-left-radius:var(--r)}
thead tr:first-child th:last-child{border-top-right-radius:var(--r)}
thead th:hover{color:var(--ink)}
thead th .arr{font-size:9px;color:var(--accent)}
th.r,td.r{text-align:right;white-space:nowrap}
th.col-order{color:var(--accent)}
td.col-order{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--hover)}
tr.st-red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.st-amber td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.zero td{color:var(--ink-3)}
td.desc{min-width:240px;max-width:420px}
td.desc .d{font-weight:500;color:var(--ink)}
tr.zero td.desc .d{color:var(--ink-2);font-weight:400}
td.desc .flags{display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
td.desc .why{font-size:12px;color:var(--ink-3);margin-top:2px}
td.code{font-size:13px;white-space:nowrap;color:var(--ink-3)}
td .u{font-size:11px;color:var(--ink-3);margin-left:3px}
td.neg{color:var(--red);font-weight:500}
td.newst{font-weight:500;color:var(--ink)}
.su-in{width:60px;padding:5px 8px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);text-align:right}
.su-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.su-in.missing{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.su-in.missing::placeholder{color:var(--red)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.qty button{border:none;background:transparent;width:26px;height:30px;cursor:pointer;font-size:15px;color:var(--ink-3)}
.qty button:hover{background:var(--hover);color:var(--ink)}
.qty input{width:50px;border:none;text-align:center;height:30px;font-weight:600;background:transparent}
.qty.has input{color:var(--accent)}
.qty.manual{border-color:var(--blue)} .qty.manual input{color:var(--blue)}
.qty input:focus{outline:none} .qty:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:500;border-top:1px solid var(--line);padding:10px 12px;z-index:1;color:var(--ink-2)}
tfoot td:first-child{border-bottom-left-radius:var(--r)} tfoot td:last-child{border-bottom-right-radius:var(--r)}
tfoot td b{color:var(--ink);font-weight:600}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-3)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin:10px 2px 0}
@media (max-width:900px){ .tablewrap{overflow-x:auto} thead th{top:0} }

/* Modtagelse */
.invrow{display:grid;grid-template-columns:minmax(120px,1fr) 190px 170px 130px 18px;gap:16px;align-items:center;padding:11px 20px;border-top:1px solid var(--line);cursor:pointer}
.invrow:hover{background:var(--hover)}
.invrow.on{background:var(--accent-soft)}
.invrow .no{font-weight:600}
.invrow .no span{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.invrow .n{text-align:right;color:var(--ink-2)}
.invrow .v{text-align:right;font-weight:600}
@media (max-width:760px){ .invrow{grid-template-columns:minmax(0,1fr) auto} .invrow .n,.invrow .st,.invrow .ch{display:none} }
.rx-table td.chk,.rx-table th.chk{width:44px;text-align:center}
.rx-table input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.rx-table tr.off td{color:var(--ink-3)}
.rx-table tr.off td.desc .d{text-decoration:line-through;color:var(--ink-3);font-weight:400}
.rx-table thead tr.f th{top:calc(var(--hdr-h) + 39px);padding:6px;background:var(--surface);cursor:default;border-radius:0}
.rx-table thead tr.f input{width:100%;min-width:56px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:var(--surface)}
.rx-table thead tr.f input.act{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:900px){ .rx-table thead tr.f th{top:39px} }

/* ---------- Dialoger ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,28,.4);display:none;align-items:flex-start;justify-content:center;z-index:60;padding:56px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:12px;max-width:620px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.18);border:1px solid var(--line)}
.modal.wide{max-width:760px}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:16px;font-weight:600}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
.x-btn:hover{background:var(--hover);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lab{font-size:13px;font-weight:600}
.help{font-size:13px;color:var(--ink-2)}
.field input[type=number],.field input[type=text],.field select{padding:7px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row3,.row4{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}
.note{padding:10px 12px;border-radius:8px;font-size:13.5px}
.note.ok{background:var(--green-soft);color:var(--green)} .note.bad{background:var(--red-soft);color:var(--red)}
.tag{display:inline-flex;font-size:12px;font-weight:500;padding:1px 7px;border-radius:5px;line-height:1.6}
.tag.red{background:var(--red-soft);color:var(--red)}
.rules-table{width:100%;font-size:13.5px;border-collapse:collapse}
.rules-table th{font-size:12px;color:var(--ink-3);font-weight:500;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);position:static;background:none;cursor:default}
.rules-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.rules-table input{width:100%;padding:5px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.csv-preview{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--hover);border-radius:8px;padding:10px 12px;white-space:pre;overflow:auto;max-height:150px}
.helpdoc h3{font-size:14.5px;margin:0 0 6px;font-weight:600}
.helpdoc ol,.helpdoc ul{margin:0;padding-left:20px;color:var(--ink-2)}
.helpdoc li{margin:4px 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;opacity:0;transition:.2s;z-index:70;font-size:13.5px;max-width:calc(100% - 32px);pointer-events:none}

'use strict';
/* =====================================================================
   Shop Bestilling (DA/EN) — én fil til GitHub Pages
   ===================================================================== */
const CATS = {
  ltc:      { suMode:'strict',  color:'var(--c-ltc)' },
  perfume:  { suMode:'none',    color:'var(--c-perfume)' },
  andet:    { suMode:'numeric', color:'var(--c-andet)' },
  cosmetic: { suMode:'numeric', color:'var(--c-cosmetic)' },
};
const CAT_KEYS = Object.keys(CATS);

/* Særregler: factor = antal stk i én kasse. Winpos lægger fejlagtigt
   solgt × factor til lageret ("New stock"), så lager nu = New stock − solgt × factor.
   Salget er i stk og regnes om til kasser. step = der bestilles i hele "step" kasser. */
const DEFAULT_SETTINGS = {
  v: 4, lang: 'da', theme: 'light',
  minShelf: { ltc:0, perfume:4, andet:4, cosmetic:4 },
  buffer: true, cover: 1, rounding: 'nearest', showWinposStock: false, showCalc: false,
  rules: [
    { match:'coca cola',   cats:'ltc', factor:24, step:99 },
    { match:'fanta',       cats:'ltc', factor:24, step:99 },
    { match:'redbull',     cats:'ltc', factor:24, step:1 },
    { match:'capri sonne', cats:'ltc', factor:4,  step:1 },
  ],
};

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const K_SET='sb_settings_v4', K_SU='sb_su_memory_v1', K_SES='sb_session_v1', K_RX='sb_receive_v1', K_RXP='sb_receive_pref_v1', K_UI='sb_ui_v3', K_HIST='sb_history_v1';

function loadSettings(){
  const d = structuredClone(DEFAULT_SETTINGS);
  let s = store.get(K_SET, null);
  if (!s){
    const old = store.get('sb_settings_v3', null);           // flyt gamle indstillinger med
    if (old){ s = { minShelf: old.minShelf, buffer: old.buffer, cover: old.cover, rounding: old.rounding, showWinposStock: old.showWinposStock }; }
  }
  if (!s) return d;
  const out = Object.assign(d, s, { minShelf: Object.assign(d.minShelf, s.minShelf||{}) });
  if (!s.rules) out.rules = d.rules;
  return out;
}
let settings = loadSettings();
let suMemory = store.get(K_SU, {});
let session  = store.get(K_SES, null) || { data:{}, overrides:{} };
for (const c of CAT_KEYS) session.overrides[c] = session.overrides[c] || {};
session.sup = session.sup || {}; session.supOv = session.supOv || {};
let rx = store.get(K_RX, null);
let rxPref = Object.assign({ autoZero:true, sep:';', dec:',', header:true, headers:['Article','Qty','Price/Qty'], mode:'split' }, store.get(K_RXP, {}));
let history = store.get(K_HIST, []);
const uiSaved = store.get(K_UI, {});
const ui  = { section: uiSaved.section || 'heinemann', sup: uiSaved.sup || 'overview', tab: uiSaved.tab || 'overview', filter:'all', q:'', sort:{key:null,dir:1} };
const rui = { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} };
function saveUi(){ store.set(K_UI, { tab:ui.tab, section:ui.section, sup:ui.sup }); }
function saveSettingsStore(){ store.set(K_SET, settings); }

/** Tal fra Winpos-celler: 46 · "46 Stk" · "9.872 0,33ltr" (punktum = tusind) · "2,5" */
function parseNum(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/ /g,' ').trim().match(/^-?[\d.,]+/);
  if (!m) return null;
  let s = m[0];
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/** Sekundær enhed tæller kun hvis det er et rent tal (12, 24 …) */
function parseSU(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v > 0 ? v : null;
  const s = String(v).trim();
  return /^\d+$/.test(s) && +s > 0 ? +s : null;
}
function detectWeek(name){ const m = String(name||'').match(/(?:week|uge|wk)[\s_-]*(\d{1,2})/i); return m ? +m[1] : null; }
function isoWeek(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(),0,1))) / 86400000 + 1) / 7);
}
function guessCat(name){
  const n = String(name||'').toLowerCase();
  if (/cosm|hygi|hyg/.test(n)) return 'cosmetic';
  if (/ltc/.test(n)) return 'ltc';
  if (/perfum|parfum/.test(n)) return 'perfume';
  if (/andet|other|misc/.test(n)) return 'andet';
  if (/cdl|transp/.test(n)) return 'cdl';
  return null;
}


/* =====================================================================
   Indbygget .xlsx-læser.
   Heinemanns CDL-filer er pakket med Windows-stier ("xl\worksheets\…"),
   som Excel-biblioteket ikke kan åbne. Denne læser klarer det.
   ===================================================================== */
async function inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('Ikke en .xlsx-fil');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/').replace(/^\/+/, '');
    files[name.toLowerCase()] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  return {
    async text(path){
      const f = files[path.replace(/\\/g,'/').replace(/^\/+/, '').toLowerCase()];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return new TextDecoder().decode(out).replace(/^﻿/, '');
    }
  };
}
async function readXlsxNative(buf){
  const z = unzip(buf);
  const P = s => new DOMParser().parseFromString(s, 'application/xml');
  const wbTxt = await z.text('xl/workbook.xml');
  if (!wbTxt) throw new Error('Mangler workbook.xml');
  const wb = P(wbTxt);
  const rels = {};
  const relTxt = await z.text('xl/_rels/workbook.xml.rels');
  if (relTxt) for (const r of P(relTxt).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
  const ss = [];
  const ssTxt = await z.text('xl/sharedStrings.xml');
  if (ssTxt) for (const si of P(ssTxt).getElementsByTagName('si')){
    let t = ''; for (const x of si.getElementsByTagName('t')) if (x.parentNode.nodeName !== 'rPh') t += x.textContent; ss.push(t);
  }
  const colIdx = ref => { const m = /^([A-Z]+)/.exec(ref||''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; };
  const out = [];
  let si = 0;
  for (const sh of wb.getElementsByTagName('sheet')){
    si++;
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = (rels[rid] || `worksheets/sheet${si}.xml`).replace(/\\/g,'/');
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    const txt = await z.text(target);
    if (!txt) continue;
    const doc = P(txt), aoa = [];
    let rAuto = 0;
    for (const row of doc.getElementsByTagName('row')){
      const ri = row.getAttribute('r') ? +row.getAttribute('r') - 1 : rAuto;
      rAuto = ri + 1;
      const arr = []; let cAuto = 0;
      for (const c of row.getElementsByTagName('c')){
        let ci = colIdx(c.getAttribute('r')); if (ci < 0) ci = cAuto; cAuto = ci + 1;
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : null;
        let val = null;
        if (t === 's') val = v != null ? ss[+v] : null;
        else if (t === 'inlineStr'){ const is = c.getElementsByTagName('t'); val = [...is].map(x=>x.textContent).join(''); }
        else if (t === 'str' || t === 'e') val = v;
        else if (t === 'b') val = v === '1';
        else if (v != null && v !== ''){ const n = +v; val = isNaN(n) ? v : n; }
        arr[ci] = val;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = null;
      aoa[ri] = arr;
    }
    for (let i = 0; i < aoa.length; i++) if (!aoa[i]) aoa[i] = [];
    out.push({ name: sh.getAttribute('name'), aoa });
  }
  if (!out.length) throw new Error('Ingen ark fundet');
  return out;
}
/** Læs regneark → [{name, aoa}] — indbygget læser til .xlsx, Excel-biblioteket til .xls */
async function readSheets(file){
  const buf = await file.arrayBuffer();
  const isZip = new Uint8Array(buf, 0, 2)[0] === 0x50 && new Uint8Array(buf, 0, 2)[1] === 0x4b;
  let nativeErr = null;
  if (isZip && typeof DecompressionStream !== 'undefined'){
    try { return await readXlsxNative(buf); } catch(e){ nativeErr = e; console.warn('Indbygget læser fejlede, prøver biblioteket', e); }
  }
  if (typeof XLSX === 'undefined') throw nativeErr || new Error('Excel-læseren kunne ikke indlæses (kræver internet første gang).');
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(n => ({ name:n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null }) }));
}

function parseWinpos(aoa){
  let h = -1;
  for (let i=0;i<Math.min(aoa.length,60);i++){
    const r = (aoa[i]||[]).map(x => String(x??'').trim().toLowerCase());
    if (r.includes('code') && r.includes('description')) { h=i; break; }
  }
  if (h<0) throw new Error('Kunne ikke finde kolonnerne "Code" og "Description".');
  const head = aoa[h].map(x => String(x??'').trim().toLowerCase());
  const col = (...names) => { for (const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const C = {
    code: col('code'), desc: col('description'), sold: col('quantity'),
    stock: col('new stock','in stock','stock'), price: col('purchase price eur','purchase price'),
    su: col('secondary unit'), art: col('artikel nr','artikel nr.','article no'), unit: col('unit'),
  };
  const missing = ['code','desc','sold','stock'].filter(k => C[k]<0);
  if (missing.length) throw new Error('Mangler kolonner: ' + missing.join(', '));
  const meta = {};
  for (let i=0;i<h;i++){ const r=aoa[i]||[]; const k=String(r[1]??'').trim(); if(k && r[2]!=null) meta[k]=String(r[2]).trim(); }
  const rows = [];
  for (let i=h+1;i<aoa.length;i++){
    const r = aoa[i]||[];
    const code = r[C.code];
    if (code==null || String(code).trim()==='') continue;
    const desc = String(r[C.desc]??'').replace(/ /g,' ').trim();
    if (!desc) continue;
    rows.push({
      code: String(code).trim(), desc,
      sold: parseNum(r[C.sold]) ?? 0, stock: parseNum(r[C.stock]) ?? 0, stockRaw: String(r[C.stock]??'').trim(),
      price: C.price>=0 ? (parseNum(r[C.price]) ?? 0) : 0,
      suRaw: C.su>=0 ? (r[C.su]==null ? '' : String(r[C.su]).trim()) : '',
      art: C.art>=0 ? (r[C.art]==null ? '' : String(r[C.art]).trim()) : '',
      unit: C.unit>=0 ? String(r[C.unit]??'').trim() : '',
    });
  }
  meta.__cur = /eur/.test(head[C.price]||'') ? '€' : 'kr.';
  return { meta, rows };
}

function roundTo(x, step, mode){
  if (x <= 0) return 0;
  return (mode==='up' ? Math.ceil(x/step - 1e-9) : Math.round(x/step + 1e-9)) * step;
}
function findRule(cat, desc){
  const d = desc.toLowerCase();
  return settings.rules.find(r => r.match && (!r.cats || r.cats.split(',').map(s=>s.trim()).includes(cat)) && d.includes(r.match.toLowerCase().trim())) || null;
}

   Beregning
   ===================================================================== */
function calc(cat, row){
  const min = +settings.minShelf[cat] || 0;
  const cover = +settings.cover || 1;
  const flags = [];
  let su = 1, suSource = 'none', sug = 0, unit = '', real, soldDisp = row.sold, buf = 0, cx;
  const rule = findRule(cat, row.desc);

  if (rule){
    const f = +rule.factor || 1, step = +rule.step || 1;
    unit = t('cs');
    const realPcs = row.stock - row.sold * f;       // ret Winpos-fejlen
    real = realPcs / f; soldDisp = row.sold / f;
    buf = settings.buffer ? 1 : 0;
    const target = soldDisp * cover + buf, need = target - real;
    su = step; suSource = 'rule';
    sug = need > 0 ? Math.ceil(need / step - 1e-9) * step : 0;
    cx = need > 0 ? { k:'need', s:soldDisp*cover, b:buf, r:real, n:need, rd:true } : { k:'ok', r:real, tg:target };
    flags.push({ c:'teal', t:t('fl_rule', f) });
    if (realPcs < 0) flags.push({ c:'amber', t:t('fl_neg') });
  } else {
    real = row.stock - row.sold;
    if (CATS[cat].suMode !== 'none'){
      const fromFile = parseSU(row.suRaw), mem = suMemory[row.code];
      if (mem){ su = mem; suSource = 'memory'; }
      else if (fromFile){ su = fromFile; suSource = 'file'; }
      else if (CATS[cat].suMode === 'strict'){ su = 1; suSource = 'missing'; flags.push({ c:'red', t:t('fl_missing') }); }
      else { su = 1; suSource = 'ignored'; }
    }
    buf = settings.buffer && (suSource==='file' || suSource==='memory') ? su : 0;
    const base = row.sold * cover + buf, target = Math.max(base, min), need = target - real;
    sug = need > 0 ? roundTo(need, su, settings.rounding) : 0;
    if (min > 0 && real + sug < min) sug = Math.ceil((min - real) / su) * su;
    if (sug === 0 && real <= 0 && row.sold > 0) sug = su;
    cx = need > 0 ? (min > base ? { k:'min', m:min, r:real, n:need, rd:su>1 } : { k:'need', s:row.sold*cover, b:buf, r:real, n:need, rd:su>1 }) : { k:'ok', r:real, tg:target };
    if (real < 0) flags.push({ c:'amber', t:t('fl_neg') });
  }
  sug = Math.max(0, sug);
  const ov = session.overrides[cat][row.code];
  const manual = ov != null && ov !== '' && !isNaN(ov);
  const final = manual ? Math.max(0, +ov) : sug;
  if (manual) flags.push({ c:'blue', t:t('fl_manual', sug) });
  if (suSource === 'memory') flags.push({ c:'grey', t:t('fl_mem') });
  const status = flags.some(f=>f.c==='red') ? 'red' : flags.some(f=>f.c==='amber') ? 'amber' : 'ok';
  return { real, newStock: real + final, soldDisp, su, suSource, buf, sug, final, manual, unit, rule, cx, flags, status, value: final * (row.price||0) };
}
function calcText(x){
  const c = x.cx, d = v => x.rule ? fmt(v,1) : fmtq(v);
  if (!c) return '';
  if (c.k==='ok') return t('calc_ok', d(c.r), d(c.tg));
  if (c.k==='min') return t('calc_min', c.m, d(c.r), d(c.n), x.sug, c.rd);
  return t('calc_need', d(c.s), c.b, d(c.r), d(c.n), x.sug, c.rd);
}
function computed(cat){ const d = session.data[cat]; return d ? d.rows.map(r => Object.assign({ cat }, r, calc(cat, r))) : []; }
function summary(cat){
  const Lr = computed(cat);
  return { lines: Lr.length, order: Lr.filter(x=>x.final>0).length, units: Lr.reduce((a,x)=>a+x.final,0), value: Lr.reduce((a,x)=>a+x.value,0),
    red: Lr.filter(x=>x.status==='red').length, amber: Lr.filter(x=>x.status==='amber').length, manual: Lr.filter(x=>x.manual).length, list: Lr };
}
function currentWeek(){ for (const c of CAT_KEYS){ const w = session.data[c]?.week; if (w) return w; } return isoWeek(); }

/* ---------- Indlæsning: Heinemann-kategori eller anden leverandør ---------- */
const isHeinemann = meta => /heinem/i.test(meta?.Supplier || '');
async function parseFile(file){
  const sheets = await readSheets(file);
  try { const p = parseWinpos(sheets[0].aoa); if (p.rows.length) return { kind:'winpos', ...p, sheets }; } catch(e){}
  try { const c = parseCDL(sheets); return { kind:'cdl', cdl:c, sheets }; } catch(e){}
  throw new Error(t('errFormat'));
}
function storeHeinemann(cat, file, p, quiet){
  session.data[cat] = { fileName:file.name, meta:p.meta, rows:p.rows, week: detectWeek(file.name), loadedAt: Date.now() };
  session.overrides[cat] = {};
  saveSession();
  if (!quiet){ Object.assign(ui, { section:'heinemann', tab:cat, filter:'all', q:'', sort:{key:null,dir:1} }); saveUi(); }
  render();
  const s = summary(cat);
  toast(t('tLoaded', catName(cat), s.order, s.lines, s.red));
}
function supKeyOf(meta, fileName){
  const m = /^(\d+)\s+(.+)$/.exec(meta?.Supplier || '');
  if (m) return { key:m[1], name:m[2].trim() };
  const n = String(fileName).replace(/\.[^.]+$/,'').replace(/^[0-9a-f]{8}-/,'').replace(/[_-]?(week|uge)[_\s-]*\d+/i,'').trim();
  return { key:n.toLowerCase(), name:n };
}
function storeSupplier(file, p, quiet){
  const { key, name } = supKeyOf(p.meta, file.name);
  session.sup[key] = { key, name, port: p.meta.Port || '', fileName:file.name, meta:p.meta, rows:p.rows, cur: p.meta.__cur || 'kr.', week: detectWeek(file.name), loadedAt: Date.now() };
  session.supOv[key] = {};
  saveSession();
  if (!quiet){ Object.assign(ui, { section:'others', sup:key, filter:'all', q:'', sort:{key:null,dir:1} }); saveUi(); }
  render();
  const s = supSummary(key);
  toast(t('tLoaded', name, s.order, s.lines, s.red));
}
/** Én fil hvor brugeren selv har valgt Heinemann-kategori */
async function loadOrderFile(cat, file, quiet){
  try{
    const p = await parseFile(file);
    if (p.kind === 'cdl'){ return rxLoad(file); }
    if (p.meta.Supplier && !isHeinemann(p.meta)) return storeSupplier(file, p, quiet);
    const g = guessCat(file.name);
    if (g && g !== cat && CATS[g] && !confirm(t('cMismatch', file.name, catName(g), catName(cat)))) return;
    storeHeinemann(cat, file, p, quiet);
  }catch(e){ console.error(e); alert(t('errRead') + '\n' + file.name + '\n' + e.message); }
}
/** En eller flere filer — appen finder selv ud af hvad de er */
async function loadAny(files, hint){
  const unknown = [];
  let heinCount = 0, supCount = 0, many = files.length > 1;
  for (const f of files){
    try{
      const p = await parseFile(f);
      if (p.kind === 'cdl'){ await rxLoad(f); continue; }
      if (p.meta.Supplier && !isHeinemann(p.meta)){ storeSupplier(f, p, many); supCount++; continue; }
      let c = guessCat(f.name);
      if (c === 'cdl') c = null;
      if (!c && CATS[hint]) c = hint;
      if (!c && !many && ui.section==='heinemann' && CATS[ui.tab]) c = ui.tab;
      if (c){ storeHeinemann(c, f, p, many); heinCount++; } else unknown.push(f.name);
    }catch(e){ console.error(e); unknown.push(f.name); }
  }
  if (many){
    if (heinCount && !supCount){ ui.section='heinemann'; ui.tab='overview'; }
    else if (supCount && !heinCount){ ui.section='others'; ui.sup='overview'; }
    saveUi(); render();
    toast(t('tMany', heinCount, supCount));
  }
  if (unknown.length) setTimeout(()=>toast(t('tUnknown', unknown.join(', '))), many ? 1600 : 0);
}

function catRows(all){
  const qq = ui.q.trim().toLowerCase();
  let R = all.filter(x => {
    if (ui.filter==='order' && !(x.final>0)) return false;
    if (ui.filter==='check' && x.status==='ok') return false;
    if (ui.filter==='manual' && !x.manual) return false;
    if (qq && !(x.desc.toLowerCase().includes(qq) || x.code.includes(qq) || x.art.includes(qq))) return false;
    return true;
  });
  const { key, dir } = ui.sort;
  if (key){
    const get = { pcs:x=>x.pcs, code:x=>+x.code||x.code, art:x=>+x.art||x.art, desc:x=>x.desc.toLowerCase(), sold:x=>x.soldDisp ?? x.sold, stock:x=>x.stock,
      real:x=>x.real, su:x=>x.su ?? x.pack, price:x=>x.price, final:x=>x.final, newStock:x=>x.newStock, value:x=>x.value }[key];
    R = R.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  } else { const rank = { red:0, amber:1, ok:2 }; R = R.slice().sort((a,b)=> rank[a.status]-rank[b.status]); }
  return R;
}
function renderCatBody(cat, all){
  all = all || computed(cat);

  return `<tr class="st-${x.status} ${x.final>0?'':'zero'}">
    <td class="code">${esc(x.code)}</td><td class="code">${esc(x.art)}</td>
    <td class="desc"><div class="d">${esc(x.desc)}</div>
      ${tags.length?`<div class="flags">${tags.map(f=>`<span class="st ${f.c}">${esc(f.t)}</span>`).join('')}</div>`:''}
      ${settings.showCalc?`<div class="why">${esc(calcText(x))}</div>`:''}</td>
    <td class="r">${d(x.soldDisp)}${u}</td>
    ${showStock ? `<td class="r" title="${esc(x.stockRaw)}">${fmt(x.stock)}</td>` : ''}
    <td class="r ${x.real<0?'neg':''}">${d(x.real)}${u}</td>

/* =====================================================================

   ===================================================================== */
const RX_COLS = [
  { k:'inv', h:['billing document'] }, { k:'art', h:['article'] }, { k:'desc', h:['article description'] },
  { k:'qty', h:['delivery quantity'], num:true }, { k:'price', h:['price per sales unit'], num:true }, { k:'net', h:['net value'], num:true },
  { k:'ref', h:['customer reference','po number'] }, { k:'brand', h:['brand name'] }, { k:'mgrp', h:['material group'] },
  { k:'unit', h:['sales unit'], hidden:true }, { k:'credit', h:['credit price'], num:true, hidden:true }, { k:'gtin', h:['gtin'], hidden:true },
];
const RX_SHOW = RX_COLS.filter(c=>!c.hidden);
function rxSave(){ store.set(K_RX, rx); }
function parseCDL(sheets){
  for (const { aoa } of sheets){
    let h = -1;
    for (let i=0;i<Math.min(aoa.length,40);i++){ const r = (aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase()); if (r.includes('billing document') && r.includes('article')) { h=i; break; } }
    if (h<0) continue;
    const head = aoa[h].map(x=>String(x??'').trim().toLowerCase());
    const idx = {}; for (const c of RX_COLS) idx[c.k] = c.h.map(n=>head.indexOf(n)).find(i=>i>=0) ?? -1;
    if (idx.art<0 || idx.qty<0 || idx.price<0) throw new Error('Article / Delivery Quantity / Price per Sales Unit ?');
    const rows = [], sums = {}; let total = null;
    for (let i=h+1;i<aoa.length;i++){
      const r = aoa[i]||[], inv = String(r[idx.inv]??'').trim();
      if (!inv) continue;
      if (/[ƩΣ]/.test(inv)){ const no = inv.replace(/[ƩΣ]/g,'').trim(), v = { qty: parseNum(r[idx.qty]) ?? 0, net: parseNum(r[idx.net]) ?? 0 }; if (no) sums[no] = v; else total = v; continue; }
      const o = { id: rows.length };
      for (const c of RX_COLS){ const v = idx[c.k]>=0 ? r[idx[c.k]] : null; o[c.k] = c.num ? (parseNum(v) ?? 0) : String(v ?? '').trim(); }
      if (!o.art) continue;
      o.tester = /^T\s/.test(o.desc) || /^T8/i.test(o.mgrp);
      o.posm = /^X/i.test(o.mgrp) || /pseudo/i.test(o.brand) || /posm/i.test(o.ref);
      o.on = !(rxPref.autoZero && o.price === 0);
      rows.push(o);
    }
    if (rows.length) return { rows, sums, total };
  }
  throw new Error('"Billing Document" / "Article" ?');
}

function rxInvoices(){

    const v = m.get(r.inv); v.lines++; v.qty += r.qty; v.net += r.net; if (r.ref) v.refs.add(r.ref);

function colMatch(col, val, f){
  f = f.trim(); if (!f) return true;
  if (col.num){
    const m = f.match(/^(>=|<=|<>|!=|>|<|=)\s*(-?[\d.,]+)$/);
    if (m){ const n = parseNum(m[2]); switch(m[1]){ case '>':return val>n; case '<':return val<n; case '>=':return val>=n; case '<=':return val<=n; case '=':return val===n; default:return val!==n; } }
    if (/^-?[\d.,]+$/.test(f)) return val === parseNum(f);
  }
  const neg = /^(!|<>)/.test(f), needle = f.replace(/^(!|<>)/,'').toLowerCase(), hit = String(val).toLowerCase().includes(needle);
  return neg ? !hit : hit;
}

/* =====================================================================
   ANDRE LEVERANDØRER
   Kolli-størrelsen står i kolonne F "Unit" (fx 16xStk, 48Stk, 5x15g).
   Winpos lægger "solgt × kolli" til lageret i New stock — samme fejl som
   Cola hos Heinemann — så lager nu = New stock − solgt × kolli.
   Indkøbsprisen er pr. kolli, og der bestilles i hele kolli.
   ===================================================================== */
const supKeys = () => Object.keys(session.sup).sort((a,b)=>session.sup[a].name.localeCompare(session.sup[b].name));
const money = (v, cur, d=2) => cur === '€' ? eur(v,d) : `${fmt(v,d)} ${cur}`;
function packFromUnit(u){
  const s = String(u||'').trim();
  const m = /^(\d+)\s*x/i.exec(s) || /^(\d+)\s*(stk|pcs|pc)\.?$/i.exec(s);
  return m ? +m[1] : null;
}
function stockUnitSize(row){
  const suf = String(row.stockRaw||'').replace(/^-?[\d.,]+\s*/,'');
  const m = /^(\d+)\s*x/i.exec(suf);
  return m ? +m[1] : 1;
}
function calcSup(key, row){
  const flags = [], cover = +settings.cover || 1;
  const memKey = 's:' + key + ':' + row.code;
  let pack = suMemory[memKey], src = 'memory';
  if (!pack){ pack = packFromUnit(row.unit); src = pack ? 'file' : 'missing'; }
  if (!pack){ pack = 1; flags.push({ c:'red', t:t('fl_missing') }); }
  const f = Math.max(1, pack / stockUnitSize(row));       // lagerenheder pr. kolli
  const real = row.stock - row.sold * f;                   // ret Winpos-fejlen
  const buf = settings.buffer && src !== 'missing' ? f : 0;
  const target = row.sold * cover + buf, need = target - real;
  let sug = need > 0 ? roundTo(need / f, 1, settings.rounding) : 0;
  if (sug === 0 && real <= 0 && row.sold > 0) sug = 1;
  if (real < 0) flags.push({ c:'amber', t:t('fl_neg') });
  const ov = session.supOv[key]?.[row.code];
  const manual = ov != null && ov !== '' && !isNaN(ov);
  const final = manual ? Math.max(0, +ov) : sug;
  if (manual) flags.push({ c:'blue', t:t('fl_manual', sug) });
  const status = flags.some(x=>x.c==='red') ? 'red' : flags.some(x=>x.c==='amber') ? 'amber' : 'ok';
  const cx = need > 0 ? { k:'need', s:row.sold*cover, b:buf?1:0, r:real, n:need, rd:true } : { k:'ok', r:real, tg:target };
  return { pack, f, src, memKey, real, sug, final, manual, pcs: final * f, newStock: real + final * f, flags, status, cx, value: final * (row.price||0) };
}
function supComputed(key){ const d = session.sup[key]; return d ? d.rows.map(r => Object.assign({ sup:key }, r, calcSup(key, r))) : []; }
function supSummary(key){
  const L2 = supComputed(key);
  return { lines:L2.length, order:L2.filter(x=>x.final>0).length, packs:L2.reduce((a,x)=>a+x.final,0), value:L2.reduce((a,x)=>a+x.value,0),
    red:L2.filter(x=>x.status==='red').length, amber:L2.filter(x=>x.status==='amber').length, manual:L2.filter(x=>x.manual).length, list:L2 };
}
function supCalcText(x){
  const c = x.cx; if (!c) return '';
  if (c.k==='ok') return t('calc_ok', fmtq(c.r), fmtq(c.tg));
  return t('calc_need_sup', fmtq(c.s), c.b, fmtq(c.r), fmtq(c.n), x.f, x.sug);
}

    case 'sup-goto': Object.assign(ui, { section:'others', sup:el.dataset.sup, filter:'all', q:el.dataset.code, sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'sup-clear': if (confirm(t('cRemove', session.sup[el.dataset.sup].name))){ delete session.sup[el.dataset.sup]; delete session.supOv[el.dataset.sup]; saveSession(); ui.sup='overview'; saveUi(); render(); } break;
    case 'sup-export': exportSuppliers([el.dataset.sup]); break;
    case 'sup-export-all': exportSuppliers(supKeys()); break;
    case 'tab': ui.section='heinemann'; ui.tab = el.dataset.v; Object.assign(ui, { filter:'all', q:'', sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'lang': settings.lang = el.dataset.v; saveSettingsStore(); render(); break;
    case 'theme': settings.theme = settings.theme==='dark' ? 'light' : 'dark'; saveSettingsStore(); render(); break;
    case 'pick': pickFile(el.dataset.cat); break;
    case 'clear': if (confirm(t('cRemove', catName(el.dataset.cat)))){ delete session.data[el.dataset.cat]; session.overrides[el.dataset.cat]={}; saveSession(); render(); } break;
    case 'filter': ui.filter = el.dataset.v; rerenderTable(); break;
    case 'sort': { const k=el.dataset.k; ui.sort = ui.sort.key===k ? {key:k,dir:-ui.sort.dir} : {key:k,dir:(['desc','code','art'].includes(k)?1:-1)}; rerenderTable(); break; }
    case 'step': if (ui.section==='others'){ const x = supComputed(ui.sup).find(r=>r.code===el.dataset.code); setSupOverride(ui.sup, el.dataset.code, Math.max(0, x.final + (+el.dataset.d))); break; } { const x = computed(ui.tab).find(r=>r.code===el.dataset.code); setOverride(ui.tab, el.dataset.code, Math.max(0, x.final + (+el.dataset.d))); break; }
    case 'goto': Object.assign(ui, { tab:el.dataset.cat, filter:'all', q:el.dataset.code, sort:{key:null,dir:1} }); saveUi(); render(); break;
    case 'reset-ov': if (ui.section==='others') session.supOv[ui.sup]={}; else session.overrides[ui.tab]={}; saveSession(); render(); toast(t('tReset')); break;
    case 'print': window.print(); break;
    case 'export-order': openExport(); break;
    case 'do-export': doExport(); break;
    case 'export-overview': exportOverview(); break;
    case 'export-cat': exportOverview([el.dataset.cat]); break;
    case 'settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-settings': if (confirm(t('cReset'))){ const lang=settings.lang, theme=settings.theme; settings = structuredClone(DEFAULT_SETTINGS); settings.lang=lang; settings.theme=theme; saveSettingsStore(); openSettings(); render(); } break;
    case 'add-rule': $('#rulesBody').insertAdjacentHTML('beforeend', ruleRow({match:'',factor:24,step:1,cats:'ltc'})); break;
    case 'del-rule': el.closest('tr').remove(); break;
    case 'clear-su': if (confirm(t('cClearSu'))){ suMemory={}; store.set(K_SU,suMemory); el.disabled=true; render(); } break;
    case 'backup': { const b=document.createElement('a'); b.href=URL.createObjectURL(new Blob([JSON.stringify({settings,suMemory,rxPref,history,v:4},null,2)],{type:'application/json'})); b.download='shop-bestilling-backup.json'; b.click(); break; }
    case 'restore': $('#inRestore').value=''; $('#inRestore').click(); break;
    case 'help': openHelp(); break;
    case 'close': el.closest('.modal-bg').classList.remove('show'); break;
    case 'rx-clear': if (confirm(t('cRxRemove'))){ rx=null; store.del(K_RX); render(); } break;
    case 'rx-inv': rui.inv = el.dataset.v; renderReceive(); break;
    case 'rx-filter': rui.filter = el.dataset.v; renderReceive(); break;
    case 'rx-sort': { const k=el.dataset.k; rui.sort = rui.sort.key===k ? {key:k,dir:-rui.sort.dir} : {key:k,dir:RX_COLS.find(c=>c.k===k)?.num?-1:1}; renderReceive(); break; }
    case 'rx-all': { const on = el.dataset.v==='1', R = rxVisible(); R.forEach(r=>r.on=on); rxSave(); render(); toast(t('tRxAll', R.length, on)); break; }
    case 'rx-clearf': rui.colf = {}; renderReceive(); break;
    case 'rx-export': openCsv(); break;
    case 'do-csv': doCsv(); break;
  }
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if ((e.key==='Enter' || e.key===' ') && el.classList?.contains('drop')){ e.preventDefault(); el.click(); return; }
  if (e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(el.tagName)){ const s = $('#q') || $('#rxQ'); if (s){ e.preventDefault(); s.focus(); } return; }
  if (e.key==='Enter' && (el.dataset?.qty!=null || el.dataset?.su!=null)){
    e.preventDefault();
    const attr = el.dataset.qty!=null ? 'data-qty' : 'data-su', list = [...document.querySelectorAll(`[${attr}]`)];
    const next = list[list.indexOf(el) + (e.shiftKey?-1:1)]?.getAttribute(attr);
    const nextSel = next!=null ? `[${attr}="${CSS.escape(next)}"]` : '';
    el.dataset.nextSel = nextSel; el.blur();
    if (nextSel){ const n = document.querySelector(nextSel); if (n){ n.focus(); n.select(); } }
  }
  if (e.key==='Escape') document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id?.startsWith('file_') && el.files.length){
    const cat = el.id.slice(5), files = [...el.files];
    if (cat==='any') loadAny(files); else if (cat==='cdl') rxLoad(files[0]); else loadOrderFile(cat, files[0]);
    return;
  }
  if (el.id==='inRestore' && el.files[0]){
    el.files[0].text().then(txt => {
      try{ const j = JSON.parse(txt);
        if (j.settings){ const lang=settings.lang, theme=settings.theme; store.set(K_SET, j.settings.v===4 ? j.settings : { minShelf:j.settings.minShelf, buffer:j.settings.buffer }); settings = loadSettings(); settings.lang=lang; settings.theme=theme; }
        if (j.suMemory) suMemory = j.suMemory; if (j.rxPref) rxPref = Object.assign(rxPref, j.rxPref); if (j.history) history = j.history;
        store.set(K_SU,suMemory); store.set(K_RXP, rxPref); store.set(K_HIST, history); saveSettingsStore(); openSettings(); render(); toast(t('tRestored')); }
      catch(err){ alert(t('badBackup')); }
    });
    return;
  }
  if (el.dataset.actChange==='calc'){ settings.showCalc = el.checked; saveSettingsStore(); rerenderBody(); return; }
  if (el.dataset.qty!=null){ const ns = el.dataset.nextSel; ui.section==='others' ? setSupOverride(ui.sup, el.dataset.qty, el.value) : setOverride(ui.tab, el.dataset.qty, el.value); if (ns){ const n=document.querySelector(ns); if(n){ n.focus(); n.select(); } } return; }
  if (el.dataset.su!=null){
    const v = parseSU(el.value), code = el.dataset.su, ns = el.dataset.nextSel, others = ui.section==='others';
    const mk = others ? 's:' + ui.sup + ':' + code : code;
    if (el.value.trim()==='') delete suMemory[mk]; else if (!v){ toast(t('tSuBad')); render(); return; } else suMemory[mk] = v;
    store.set(K_SU, suMemory); if (others) delete session.supOv[ui.sup]?.[code]; else delete session.overrides[ui.tab][code]; saveSession();
    refresh(ns || undefined); toast(v ? t('tSu', v) : t('tSuDel'));
    return;
  }
  if (el.dataset.rxon!=null){
    rx.rows[+el.dataset.rxon].on = el.checked; rxSave();
    const st = document.querySelector('.tablewrap')?.scrollTop; render(); const w=document.querySelector('.tablewrap'); if (w && st!=null) w.scrollTop = st;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id==='q'){ ui.q = el.value; rerenderBody(); return; }
  if (el.id==='rxQ'){ rui.q = el.value; rxRenderBody(); return; }
  if (el.dataset.colf!=null){ rui.colf[el.dataset.colf] = el.value; el.classList.toggle('act', !!el.value.trim()); rxRenderBody(); const b=$('#rxClearF'); if (b) b.disabled = !Object.values(rui.colf).some(x=>x&&x.trim()); }
});
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault(); const z = e.target.closest?.('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach(x=>x.classList.toggle('drag', x===z));
}));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag')); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));
  const files = [...(e.dataTransfer?.files||[])]; if (!files.length) return;
  const c = e.target.closest?.('[data-drop]')?.dataset.drop;
  if (c && c!=='any' && files.length===1) return c==='cdl' ? rxLoad(files[0]) : loadOrderFile(c, files[0]);
  loadAny(files);
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('mousedown', e => { if (e.target===m) m.classList.remove('show'); }));

render();
</script>
</body>
</html>
