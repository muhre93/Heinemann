<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bestilling</title>
<meta name="description" content="Bestilling ud fra Winpos-eksporter til Heinemann og andre leverandører, og varemodtagelse fra CDL-fil til Winpos-CSV.">
<meta name="theme-color" content="#0D2A3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D2A3E'/%3E%3Cg fill='none' stroke='%23C79A45' stroke-width='2.2' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='7'/%3E%3Cpath d='M16 4v5M16 23v5M4 16h5M23 16h5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header class="hdr"><div class="wrap hdr-row" id="top"></div><div class="wrap sub-row" id="subnav"></div></header>
<div class="wrap"><main id="main" style="padding-bottom:80px"></main></div>

<input type="file" id="file_any" accept=".xls,.xlsx,.xlsm" multiple hidden>
<input type="file" id="file_ltc" accept=".xls,.xlsx" hidden>
<input type="file" id="file_perfume" accept=".xls,.xlsx" hidden>
<input type="file" id="file_andet" accept=".xls,.xlsx" hidden>
<input type="file" id="file_cosmetic" accept=".xls,.xlsx" hidden>
<input type="file" id="file_cdl" accept=".xlsx,.xlsm,.xls" hidden>

<div class="modal-bg" id="mExport"><div class="modal" role="dialog"><header><h2 id="mExportT"></h2><button class="x-btn" data-act="close">×</button></header><div class="body" id="exportBody"></div><footer id="exportFoot"></footer></div></div>
<div class="modal-bg" id="mCsv"><div class="modal" role="dialog"><header><h2 id="mCsvT"></h2><button class="x-btn" data-act="close">×</button></header><div class="body" id="csvBody"></div><footer id="csvFoot"></footer></div></div>
<div class="modal-bg" id="mSettings"><div class="modal wide" role="dialog"><header><h2 id="mSetT"></h2><button class="x-btn" data-act="close">×</button></header><div class="body" id="settingsBody"></div><footer id="setFoot"></footer></div></div>
<div class="modal-bg" id="mHelp"><div class="modal wide" role="dialog"><header><h2 id="mHelpT"></h2><button class="x-btn" data-act="close">×</button></header><div class="body helpdoc" id="helpBody"></div></div></div>
<input type="file" id="inRestore" accept=".json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="js/i18n.js"></script>
<script src="js/excel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
