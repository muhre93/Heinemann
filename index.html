<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Bestilling</title>
<meta name="description" content="Bestilling ud fra Winpos-eksporter (LTC, Perfume, Andet) med eksport til Order Heinemann, og varemodtagelse fra CDL-fil til Winpos-CSV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f2742'/%3E%3Cpath d='M6 19h20l-3 6H9z' fill='%2334c3b4'/%3E%3Cpath d='M15 6v12M15 6l7 9h-7' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8f9fb; --sunk:#eef0f3;
  --ink:#1b2433; --ink-2:#556274; --ink-3:#8b96a5; --line:#e3e6eb; --line-2:#d3d8df;
  --navy:#0f2742; --accent:#0d7c72; --accent-ink:#ffffff; --accent-soft:#e3f3f1; --accent-line:#a8dad4;
  --red:#c2322b; --red-soft:#fdecea; --amber:#a35d06; --amber-soft:#fdf3e1; --blue:#2858b8; --blue-soft:#e8effc;
  --green:#1d7a46; --green-soft:#e6f4ec;
  --c-ltc:#3b6fb6; --c-perfume:#a2559c; --c-andet:#c7832a;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.05);
  --r:12px; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e141c; --surface:#151d28; --surface-2:#18212d; --sunk:#111821;
    --ink:#e4e9f0; --ink-2:#a2aebd; --ink-3:#6c7889; --line:#232e3c; --line-2:#2e3a4a;
    --navy:#0a1626; --accent:#3cc2b3; --accent-ink:#06201d; --accent-soft:#13302d; --accent-line:#235750;
    --red:#f0807a; --red-soft:#3a1a19; --amber:#f0b45a; --amber-soft:#35270f; --blue:#8fb2f5; --blue-soft:#192a49;
    --green:#6fd59a; --green-soft:#12301f; --c-ltc:#77a3e0; --c-perfume:#cf8bc8; --c-andet:#e5a85a;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#151d28; --surface-2:#18212d; --sunk:#111821;
  --ink:#e4e9f0; --ink-2:#a2aebd; --ink-3:#6c7889; --line:#232e3c; --line-2:#2e3a4a;
  --navy:#0a1626; --accent:#3cc2b3; --accent-ink:#06201d; --accent-soft:#13302d; --accent-line:#235750;
  --red:#f0807a; --red-soft:#3a1a19; --amber:#f0b45a; --amber-soft:#35270f; --blue:#8fb2f5; --blue-soft:#192a49;
  --green:#6fd59a; --green-soft:#12301f; --c-ltc:#77a3e0; --c-perfume:#cf8bc8; --c-andet:#e5a85a;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
[hidden]{display:none !important}

/* ---------- Header ---------- */
.top{background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;white-space:nowrap}
.sections{display:flex;gap:4px;background:rgba(255,255,255,.07);padding:4px;border-radius:11px}
.sec-btn{border:none;background:transparent;color:#b9c6d6;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
.sec-btn:hover{color:#fff}
.sec-btn.on{background:#fff;color:var(--navy)}
:root[data-theme="dark"] .sec-btn.on{background:#e4e9f0}
.sec-btn .dot{width:7px;height:7px;border-radius:50%;background:#f0807a}
.top-tools{margin-left:auto;display:flex;gap:6px}
.icon-btn{border:1px solid rgba(255,255,255,.16);background:transparent;color:#d7e1ec;height:36px;min-width:36px;padding:0 10px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.icon-btn:hover{border-color:rgba(255,255,255,.4);color:#fff}
@media (max-width:720px){
  .top-in{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .sections{order:3;width:100%}
  .sec-btn{flex:1;justify-content:center}
  .icon-btn .lbl{display:none}
}

main{max-width:1440px;margin:0 auto;padding:22px 20px 70px}
@media (max-width:720px){ main{padding:16px 16px 60px} }

/* ---------- Section head ---------- */
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.head p{margin:2px 0 0;color:var(--ink-2);font-size:14px;max-width:640px}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip-week{font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:99px}

.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn svg{flex-shrink:0}

/* ---------- Cards row ---------- */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1050px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kcard{position:relative;padding:14px 16px 14px;cursor:pointer;text-align:left;min-height:138px;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,box-shadow .12s;border-top:3px solid var(--cat,var(--line))}
.kcard:hover{border-color:var(--line-2);border-top-color:var(--cat,var(--line-2))}
.kcard.on{box-shadow:0 0 0 2px var(--accent) inset, var(--shadow)}
.kcard .k-top{display:flex;align-items:center;gap:8px}
.kcard .k-name{font-weight:600;font-size:15px}
.kcard .k-sub{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .k-val{font-size:24px;font-weight:600;letter-spacing:-.3px;line-height:1.2;margin-top:2px}
.kcard .k-val small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.kcard .k-meta{font-size:13px;color:var(--ink-2)}
.kcard .k-status{margin-top:auto;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.k-tools{margin-left:auto;display:flex;gap:2px}
.k-tool{border:none;background:transparent;color:var(--ink-3);width:28px;height:28px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.k-tool:hover{background:var(--sunk);color:var(--ink)}
.k-tool.del:hover{background:var(--red-soft);color:var(--red)}
.kcard.empty{border-style:dashed;border-top-style:dashed;box-shadow:none;background:var(--surface-2);justify-content:center;align-items:center;text-align:center;gap:4px}
.kcard.empty .k-name{font-size:15px}
.kcard.empty .hint{font-size:13px;color:var(--ink-3)}
.kcard.empty .up{width:38px;height:38px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2);margin-bottom:4px}
.kcard.drag{border-color:var(--accent) !important;background:var(--accent-soft)}
.ok-t{color:var(--green)} .bad-t{color:var(--red)} .warn-t{color:var(--amber)}
.catdot{width:9px;height:9px;border-radius:3px;background:var(--cat);flex-shrink:0}

/* ---------- Content panels ---------- */
.content{margin-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{padding:16px 18px}
.panel h2{margin:0 0 4px;font-size:15px;font-weight:600}
.panel .sub{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:14px}

.issue{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:none}
.issue .nm{flex:1;min-width:0}
.issue .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue .nm span{font-size:12px;color:var(--ink-3)}
.allgood{display:flex;gap:12px;align-items:center;background:var(--green-soft);color:var(--green);padding:14px 16px;border-radius:10px;font-weight:500}

.bars .bar-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.bars .track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:var(--cat);border-radius:99px}
.bars .lbl{font-size:13px;display:flex;align-items:center;gap:7px}
.bars .v{font-size:13px;text-align:right;white-space:nowrap}

.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.toplist li:first-child{border-top:none}
.toplist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .v{white-space:nowrap;color:var(--ink-2)}

.rules{margin:0;padding:0;list-style:none}
.rules li{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.rules li:first-child{border-top:none}
.rules li b{color:var(--ink);font-weight:600}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap;line-height:1.6}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.teal{background:var(--accent-soft);color:var(--accent)}
.tag.grey{background:var(--sunk);color:var(--ink-2)}
.tag.cat{background:color-mix(in srgb,var(--cat) 14%,transparent);color:var(--cat)}

/* ---------- Info banner ---------- */
.info{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink-2);margin-bottom:12px}
.info b{color:var(--ink)}
.info .x{margin-left:auto;border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:10px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{border:none;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.seg button:hover,.seg label:hover{color:var(--ink)}
.seg .on,.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input{display:none}
.seg .c{color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}
.seg .c.r{color:var(--red)}

/* ---------- Table ---------- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 230px);min-height:200px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
thead th{position:sticky;top:0;background:var(--surface-2);z-index:2;text-align:left;font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
th.r,td.r{text-align:right}
thead th .arr{font-size:10px;color:var(--accent)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface-2)}
tr.st-red td{background:color-mix(in srgb,var(--red-soft) 65%,var(--surface))}
tr.st-red td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.st-amber td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.zero td{color:var(--ink-3)}
tr.zero td.desc .d{color:var(--ink-2)}
td.desc{min-width:240px;max-width:380px}
td.desc .d{font-weight:500}
td.desc .why{font-size:12px;color:var(--ink-3);margin-top:1px}
td.code{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--ink-2)}
td .u{font-size:11px;color:var(--ink-3);margin-left:3px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.su-in{width:58px;padding:5px 7px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);text-align:right}
.su-in.missing{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.su-in.missing::placeholder{color:var(--red);font-weight:700}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.qty button{border:none;background:transparent;width:28px;height:32px;cursor:pointer;font-size:16px;color:var(--ink-3)}
.qty button:hover{background:var(--sunk);color:var(--ink)}
.qty input{width:54px;border:none;text-align:center;height:32px;font-weight:600;font-size:15px;background:transparent;font-variant-numeric:tabular-nums}
.qty.has{border-color:var(--accent-line);background:var(--accent-soft)}
.qty.manual{border-color:var(--blue);background:var(--blue-soft)}
.sug{font-size:11px;color:var(--blue);margin-top:2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.qty input:focus{outline:none}
.qty:focus-within{box-shadow:0 0 0 2px var(--accent)}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty-state h3{margin:0 0 6px;color:var(--ink);font-size:16px}
tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:600;border-top:1px solid var(--line);padding:9px 10px;z-index:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin:8px 2px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* Receive table */
.rx-table td.chk,.rx-table th.chk{width:38px;text-align:center}
.rx-table input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.rx-table tr.off td{color:var(--ink-3)}
.rx-table tr.off td.desc .d{text-decoration:line-through;color:var(--ink-3)}
.rx-table thead tr.f th{top:38px;padding:5px 6px;background:var(--surface);cursor:default}
.rx-table thead tr.f input{width:100%;min-width:56px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--surface);font-weight:400}
.rx-table thead tr.f input.act{border-color:var(--accent);background:var(--accent-soft)}
.inv-card .k-val{font-size:20px}
.inv-card .no{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--ink-2)}
.inv-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.inv-row .kcard{flex:0 0 230px;min-height:128px}
.inv-row .kcard.upload{flex-basis:250px}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,24,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:48px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:640px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:760px}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal header h2{margin:0;font-size:17px;font-weight:600}
.modal .body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x-btn{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:22px;line-height:1;padding:2px 6px;border-radius:6px}
.x-btn:hover{background:var(--sunk);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field .lab{font-size:13px;font-weight:600}
.help{font-size:12.5px;color:var(--ink-2)}
.field input[type=number],.field input[type=text],.field select{padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row3{grid-template-columns:1fr}}
.check{display:flex;gap:9px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.note{padding:10px 12px;border-radius:9px;font-size:13px}
.note.ok{background:var(--green-soft);color:var(--green)}
.note.bad{background:var(--red-soft);color:var(--red)}
.note.warn{background:var(--amber-soft);color:var(--amber)}
.rules-table{width:100%;font-size:13px;border-collapse:collapse}
.rules-table th{font-size:12px;color:var(--ink-2);font-weight:600;text-align:left;padding:4px;cursor:default;position:static;background:none;border-bottom:1px solid var(--line)}
.rules-table td{padding:4px;border-bottom:1px solid var(--line)}
.rules-table input{width:100%;padding:5px 7px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)}
.csv-preview{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:8px;padding:9px 11px;white-space:pre;overflow:auto;max-height:150px}
.exp-opt{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px}
.exp-opt h3{margin:0 0 2px;font-size:14.5px}
.exp-opt p{margin:0;font-size:13px;color:var(--ink-2)}
.exp-opt .btn{margin-left:auto;flex-shrink:0}
.helpdoc h3{font-size:15px;margin:4px 0 6px}
.helpdoc ol,.helpdoc ul{margin:0 0 6px;padding-left:20px;font-size:14px}
.helpdoc li{margin:4px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;font-size:14px;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  .top,.cards,.inv-row,.toolbar,.legend,.info,.head .actions,.qty button,.no-print{display:none !important}
  body{background:#fff;color:#000;font-size:11px}
  .tablewrap{max-height:none;overflow:visible;box-shadow:none;border:none}
  thead th,tfoot td{position:static}
  tr.zero{display:none}
  .qty{border:none;background:none} .qty input{width:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">

<script>
'use strict';
/* =====================================================================
   Shop Bestilling — én fil til GitHub Pages
   Bestilling:      Winpos-eksporter (LTC / Perfume / Andet) → Order Heinemann.xlsx
   Varemodtagelse:  CDL-fil fra Heinemann → CSV (Article, Qty, Price) til Winpos
   Alt kører i browseren; intet sendes nogen steder hen.
   ===================================================================== */

const CATS = {
  ltc:     { name:'LTC',     sub:'Slik, drikke, vin & spiritus', suMode:'strict',  color:'var(--c-ltc)' },
  perfume: { name:'Perfume', sub:'Parfume & kosmetik',            suMode:'none',    color:'var(--c-perfume)' },
  andet:   { name:'Andet',   sub:'Ure, legetøj, tilbehør',        suMode:'numeric', color:'var(--c-andet)' },
};
const CAT_KEYS = Object.keys(CATS);

const DEFAULT_SETTINGS = {
  v: 2,
  minShelf: { ltc:0, perfume:4, andet:4 },
  cover: 1,                    // bestil til X gange det solgte
  rounding: 'nearest',         // 'nearest' | 'up'
  showWinposStock: false,
  rules: [
    { match:'coca cola',   cats:'ltc', factor:24, step:99, unit:'kasser', note:'Solgt tælles i kasser (1 = 24 dåser). Bestilles i hele 99 kasser.' },
    { match:'fanta',       cats:'ltc', factor:24, step:99, unit:'kasser', note:'Solgt tælles i kasser (1 = 24 dåser). Bestilles i hele 99 kasser.' },
    { match:'capri sonne', cats:'ltc', factor:4,  step:1,  unit:'kasser', note:'1 = 40 stk. Lager tælles i 10-pakker, så 1 kasse = 4 pakker.' },
  ],
};

/* ---------- Lager i browseren (fejler stille hvis blokeret) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};
const K_SET='sb_settings_v2', K_SU='sb_su_memory_v1', K_SES='sb_session_v1', K_RX='sb_receive_v1', K_RXP='sb_receive_pref_v1', K_UI='sb_ui_v1';

function loadSettings(){
  const s = store.get(K_SET, null);
  const d = structuredClone(DEFAULT_SETTINGS);
  if (!s) return d;
  return Object.assign(d, s, { minShelf: Object.assign(d.minShelf, s.minShelf||{}) });
}
let settings = loadSettings();
let suMemory = store.get(K_SU, {});
let session  = store.get(K_SES, null) || { data:{}, overrides:{} };
for (const c of CAT_KEYS) session.overrides[c] = session.overrides[c] || {};
let rx = store.get(K_RX, null);
let rxPref = Object.assign({ autoZero:true, sep:';', dec:',', header:true, headers:['Article','Qty','Price/Qty'], mode:'split' }, store.get(K_RXP, {}));
const uiSaved = store.get(K_UI, {});
const ui  = { section: uiSaved.section || 'order', view:'overview', filter:'all', q:'', sort:{key:null,dir:1}, hiddenInfo: uiSaved.hiddenInfo || {} };
const rui = { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} };
function saveUi(){ store.set(K_UI, { section:ui.section, hiddenInfo:ui.hiddenInfo }); }

/* ---------- Hjælpere ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null || isNaN(n)) ? '–' : Number(n).toLocaleString('da-DK',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtq = n => fmt(n, Number.isInteger(+n) ? 0 : 1);
const eur = (n, d=2) => fmt(n,d) + ' €';
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2800); }
const ICON = {
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>',
  swap:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M5 15a8 8 0 0 0 14 2M19 9A8 8 0 0 0 5 7"/></svg>',
  x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  dl:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>',
  sheet:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 3v18"/></svg>',
  search:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  print:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>',
};

/** Tal fra Winpos-celler: 46 · "46 Stk" · "9.872 0,33ltr" (punktum = tusind) · "2,5" */
function parseNum(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v;
  const m = String(v).replace(/ /g,' ').trim().match(/^-?[\d.,]+/);
  if (!m) return null;
  let s = m[0];
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
/** Sekundær enhed tæller kun hvis det er et rent tal (12, 24 …) */
function parseSU(v){
  if (v==null || v==='') return null;
  if (typeof v === 'number') return v > 0 ? v : null;
  const s = String(v).trim();
  return /^\d+$/.test(s) && +s > 0 ? +s : null;
}
function detectWeek(name){ const m = String(name||'').match(/(?:week|uge|wk)[\s_-]*(\d{1,2})/i); return m ? +m[1] : null; }
function isoWeek(d=new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(),0,1))) / 86400000 + 1) / 7);
}
function guessCat(name){
  const n = String(name||'').toLowerCase();
  if (/ltc/.test(n)) return 'ltc';
  if (/perfum|parfum/.test(n)) return 'perfume';
  if (/andet|other|misc/.test(n)) return 'andet';
  if (/cdl|transp/.test(n)) return 'cdl';
  return null;
}

/* =====================================================================
   Indbygget .xlsx-læser.
   Heinemanns CDL-filer er pakket med Windows-stier ("xl\worksheets\…"),
   som Excel-biblioteket ikke kan åbne. Denne læser klarer det.
   ===================================================================== */
async function inflateRaw(u8){
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
function unzip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder();
  let e = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50){ e = i; break; }
  if (e < 0) throw new Error('Ikke en .xlsx-fil');
  const count = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < count && dv.getUint32(p, true) === 0x02014b50; k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen)).replace(/\\/g, '/').replace(/^\/+/, '');
    files[name.toLowerCase()] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  return {
    async text(path){
      const f = files[path.replace(/\\/g,'/').replace(/^\/+/, '').toLowerCase()];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return new TextDecoder().decode(out).replace(/^﻿/, '');
    }
  };
}
async function readXlsxNative(buf){
  const z = unzip(buf);
  const P = s => new DOMParser().parseFromString(s, 'application/xml');
  const wbTxt = await z.text('xl/workbook.xml');
  if (!wbTxt) throw new Error('Mangler workbook.xml');
  const wb = P(wbTxt);
  const rels = {};
  const relTxt = await z.text('xl/_rels/workbook.xml.rels');
  if (relTxt) for (const r of P(relTxt).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
  const ss = [];
  const ssTxt = await z.text('xl/sharedStrings.xml');
  if (ssTxt) for (const si of P(ssTxt).getElementsByTagName('si')){
    let t = ''; for (const x of si.getElementsByTagName('t')) if (x.parentNode.nodeName !== 'rPh') t += x.textContent; ss.push(t);
  }
  const colIdx = ref => { const m = /^([A-Z]+)/.exec(ref||''); if (!m) return -1; let n = 0; for (const ch of m[1]) n = n*26 + ch.charCodeAt(0) - 64; return n - 1; };
  const out = [];
  let si = 0;
  for (const sh of wb.getElementsByTagName('sheet')){
    si++;
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target = (rels[rid] || `worksheets/sheet${si}.xml`).replace(/\\/g,'/');
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//,'');
    const txt = await z.text(target);
    if (!txt) continue;
    const doc = P(txt), aoa = [];
    let rAuto = 0;
    for (const row of doc.getElementsByTagName('row')){
      const ri = row.getAttribute('r') ? +row.getAttribute('r') - 1 : rAuto;
      rAuto = ri + 1;
      const arr = []; let cAuto = 0;
      for (const c of row.getElementsByTagName('c')){
        let ci = colIdx(c.getAttribute('r')); if (ci < 0) ci = cAuto; cAuto = ci + 1;
        const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0], v = vEl ? vEl.textContent : null;
        let val = null;
        if (t === 's') val = v != null ? ss[+v] : null;
        else if (t === 'inlineStr'){ const is = c.getElementsByTagName('t'); val = [...is].map(x=>x.textContent).join(''); }
        else if (t === 'str' || t === 'e') val = v;
        else if (t === 'b') val = v === '1';
        else if (v != null && v !== ''){ const n = +v; val = isNaN(n) ? v : n; }
        arr[ci] = val;
      }
      for (let i = 0; i < arr.length; i++) if (arr[i] === undefined) arr[i] = null;
      aoa[ri] = arr;
    }
    for (let i = 0; i < aoa.length; i++) if (!aoa[i]) aoa[i] = [];
    out.push({ name: sh.getAttribute('name'), aoa });
  }
  if (!out.length) throw new Error('Ingen ark fundet');
  return out;
}
/** Læs regneark → [{name, aoa}] — indbygget læser til .xlsx, Excel-biblioteket til .xls */
async function readSheets(file){
  const buf = await file.arrayBuffer();
  const isZip = new Uint8Array(buf, 0, 2)[0] === 0x50 && new Uint8Array(buf, 0, 2)[1] === 0x4b;
  let nativeErr = null;
  if (isZip && typeof DecompressionStream !== 'undefined'){
    try { return await readXlsxNative(buf); } catch(e){ nativeErr = e; console.warn('Indbygget læser fejlede, prøver biblioteket', e); }
  }
  if (typeof XLSX === 'undefined') throw nativeErr || new Error('Excel-læseren kunne ikke indlæses (kræver internet første gang).');
  const wb = XLSX.read(buf, { type:'array' });
  return wb.SheetNames.map(n => ({ name:n, aoa: XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:true, defval:null }) }));
}

/* =====================================================================
   BESTILLING
   ===================================================================== */
function parseWinpos(aoa){
  let h = -1;
  for (let i=0;i<Math.min(aoa.length,60);i++){
    const r = (aoa[i]||[]).map(x => String(x??'').trim().toLowerCase());
    if (r.includes('code') && r.includes('description')) { h=i; break; }
  }
  if (h<0) throw new Error('Kunne ikke finde kolonnerne "Code" og "Description".');
  const head = aoa[h].map(x => String(x??'').trim().toLowerCase());
  const col = (...names) => { for (const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const C = {
    code: col('code'), desc: col('description'), sold: col('quantity'),
    stock: col('new stock','in stock','stock'), price: col('purchase price eur','purchase price'),
    su: col('secondary unit'), art: col('artikel nr','artikel nr.','article no'), unit: col('unit'),
  };
  const missing = ['code','desc','sold','stock'].filter(k => C[k]<0);
  if (missing.length) throw new Error('Mangler kolonner: ' + missing.join(', '));
  const meta = {};
  for (let i=0;i<h;i++){ const r=aoa[i]||[]; const k=String(r[1]??'').trim(); if(k && r[2]!=null) meta[k]=String(r[2]).trim(); }
  const rows = [];
  for (let i=h+1;i<aoa.length;i++){
    const r = aoa[i]||[];
    const code = r[C.code];
    if (code==null || String(code).trim()==='') continue;
    const desc = String(r[C.desc]??'').replace(/ /g,' ').trim();
    if (!desc) continue;
    rows.push({
      code: String(code).trim(), desc,
      sold: parseNum(r[C.sold]) ?? 0, stock: parseNum(r[C.stock]) ?? 0, stockRaw: String(r[C.stock]??'').trim(),
      price: C.price>=0 ? (parseNum(r[C.price]) ?? 0) : 0,
      suRaw: C.su>=0 ? (r[C.su]==null ? '' : String(r[C.su]).trim()) : '',
      art: C.art>=0 ? (r[C.art]==null ? '' : String(r[C.art]).trim()) : '',
      unit: C.unit>=0 ? String(r[C.unit]??'').trim() : '',
    });
  }
  return { meta, rows };
}

function roundTo(x, step, mode){
  if (x <= 0) return 0;
  return (mode==='up' ? Math.ceil(x/step - 1e-9) : Math.round(x/step + 1e-9)) * step;
}
function findRule(cat, desc){
  const d = desc.toLowerCase();
  return settings.rules.find(r => r.match && (!r.cats || r.cats.split(',').map(s=>s.trim()).includes(cat)) && d.includes(r.match.toLowerCase().trim())) || null;
}

/**
 * Beregning pr. linje
 *   Reel lager  = lager − solgt          (særregler: lager − solgt × "1 =")
 *   Mål         = max(solgt × dækning, min. på hylden)
 *   Mangler     = mål − reel lager
 *   Bestil      = mangler afrundet til sekundær enhed (0 hvis reel lager dækker)
 */
function calc(cat, row){
  const min = +settings.minShelf[cat] || 0;
  const cover = +settings.cover || 1;
  const flags = [];
  let su = 1, suSource = 'none', sug = 0, unit = '', why = '', realDisp, soldDisp;
  const rule = findRule(cat, row.desc);

  if (rule){
    const f = +rule.factor || 1, step = +rule.step || 1;
    unit = rule.unit || 'kasser';
    const realStock = row.stock - row.sold * f;          // i lagerenheder (dåser / pakker)
    const realU = realStock / f;                           // i kasser
    realDisp = realU; soldDisp = row.sold;
    const need = row.sold * cover - realU;
    su = step; suSource = 'rule';
    sug = need > 0 ? roundTo(need, step, settings.rounding) : 0;
    if (sug === 0 && realU <= 0 && row.sold > 0) sug = step;
    why = need > 0 ? `Mangler ${fmtq(need)} ${unit} → ${sug ? 'bestil '+sug : 'under halv enhed'}` : `Reel lager ${fmt(realU,1)} ${unit} dækker salget`;
    flags.push({ c:'teal', t:`1 = ${f} · i hele ${step}` });
    row = Object.assign({}, row, { _real: realU, _realStock: realStock });
    if (realStock < 0) flags.push({ c:'amber', t:'Solgt mere end lager' });
  } else {
    const real = row.stock - row.sold;
    realDisp = real; soldDisp = row.sold;
    if (CATS[cat].suMode !== 'none'){
      const fromFile = parseSU(row.suRaw), mem = suMemory[row.code];
      if (mem){ su = mem; suSource = 'memory'; }
      else if (fromFile){ su = fromFile; suSource = 'file'; }
      else if (CATS[cat].suMode === 'strict'){ su = 1; suSource = 'missing'; flags.push({ c:'red', t:'Mangler sek. enhed' }); }
      else { su = 1; suSource = 'ignored'; }
    }
    const target = Math.max(row.sold * cover, min);
    const need = target - real;
    sug = need > 0 ? roundTo(need, su, settings.rounding) : 0;
    if (min > 0 && real + sug < min) sug = Math.ceil((min - real) / su) * su;
    if (sug === 0 && real <= 0 && row.sold > 0) sug = su;
    why = need > 0
      ? `Mangler ${fmtq(need)}${min>0 && target===min && min>row.sold*cover ? ` (min. ${min} på hylde)` : ''}${su>1 ? ` → rundet til ${su}-tal = ${sug}` : ''}`
      : `Reel lager ${fmtq(real)} dækker ${min>row.sold*cover ? 'min. '+min : 'salget ('+fmtq(row.sold*cover)+')'}`;
    if (real < 0) flags.push({ c:'amber', t:'Solgt mere end lager' });
  }
  sug = Math.max(0, sug);

  const ov = session.overrides[cat][row.code];
  const manual = ov != null && ov !== '' && !isNaN(ov);
  const final = manual ? Math.max(0, +ov) : sug;
  if (manual) flags.push({ c:'blue', t:'Rettet manuelt' });
  if (suSource === 'memory') flags.push({ c:'grey', t:'Sek. enhed husket' });
  const status = flags.some(f=>f.c==='red') ? 'red' : flags.some(f=>f.c==='amber') ? 'amber' : 'ok';
  return { real: realDisp, soldDisp, su, suSource, sug, final, manual, unit, rule, why, flags, status, value: final * (row.price||0) };
}

function computed(cat){
  const d = session.data[cat];
  return d ? d.rows.map(r => Object.assign({ cat }, r, calc(cat, r))) : [];
}
function summary(cat){
  const L = computed(cat);
  return {
    lines: L.length, order: L.filter(x=>x.final>0).length,
    units: L.reduce((a,x)=>a+x.final,0), value: L.reduce((a,x)=>a+x.value,0),
    red: L.filter(x=>x.status==='red').length, amber: L.filter(x=>x.status==='amber').length,
    manual: L.filter(x=>x.manual).length, list: L,
  };
}
function currentWeek(){ for (const c of CAT_KEYS){ const w = session.data[c]?.week; if (w) return w; } return isoWeek(); }
function saveSession(){ store.set(K_SES, session); }

async function loadOrderFile(cat, file){
  try{
    const sheets = await readSheets(file);
    const { meta, rows } = parseWinpos(sheets[0].aoa);
    if (!rows.length) throw new Error('Ingen varelinjer fundet.');
    const g = guessCat(file.name);
    if (g && g !== cat && CATS[g] && !confirm(`Filnavnet "${file.name}" ligner ${CATS[g].name}, men du har valgt ${CATS[cat].name}. Fortsæt?`)) return;
    session.data[cat] = { fileName:file.name, meta, rows, week: detectWeek(file.name), loadedAt: Date.now() };
    session.overrides[cat] = {};
    saveSession();
    Object.assign(ui, { view:cat, filter:'all', q:'', sort:{key:null,dir:1} });
    render();
    const s = summary(cat);
    toast(`${CATS[cat].name}: ${s.lines} linjer · ${s.order} skal bestilles${s.red ? ' · '+s.red+' skal tjekkes' : ''}`);
  }catch(e){ console.error(e); alert('Kunne ikke læse filen:\n' + e.message); }
}

function catRows(all){
  const q = ui.q.trim().toLowerCase();
  let L = all.filter(x => {
    if (ui.filter==='order' && !(x.final>0)) return false;
    if (ui.filter==='check' && x.status==='ok') return false;
    if (ui.filter==='manual' && !x.manual) return false;
    if (q && !(x.desc.toLowerCase().includes(q) || x.code.includes(q) || x.art.includes(q))) return false;
    return true;
  });
  const { key, dir } = ui.sort;
  if (key){
    const get = { code:x=>+x.code||x.code, art:x=>+x.art||x.art, desc:x=>x.desc.toLowerCase(), sold:x=>x.soldDisp, stock:x=>x.stock,
      real:x=>x.real, su:x=>x.su, price:x=>x.price, final:x=>x.final, value:x=>x.value }[key];
    L = L.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  } else {
    // standard: fejl øverst, derefter filens rækkefølge
    const rank = { red:0, amber:1, ok:2 };
    L = L.slice().sort((a,b)=> rank[a.status]-rank[b.status]);
  }
  return L;
}

/* =====================================================================
   VAREMODTAGELSE — CDL fra Heinemann → CSV til Winpos
   Gule linjer i CDL ("Ʃ 9502227809") er sumlinjen for én faktura.
   ===================================================================== */
const RX_COLS = [
  { k:'inv',   n:'Faktura',     h:['billing document'] },
  { k:'art',   n:'Article',     h:['article'] },
  { k:'desc',  n:'Beskrivelse', h:['article description'] },
  { k:'qty',   n:'Antal',       h:['delivery quantity'], num:true },
  { k:'price', n:'Pris/enhed',  h:['price per sales unit'], num:true },
  { k:'net',   n:'Nettoværdi',  h:['net value'], num:true },
  { k:'ref',   n:'Ordre',       h:['customer reference','po number'] },
  { k:'brand', n:'Brand',       h:['brand name'] },
  { k:'mgrp',  n:'Varegruppe',  h:['material group'] },
  { k:'unit',  h:['sales unit'], hidden:true },
  { k:'credit',h:['credit price'], num:true, hidden:true },
  { k:'gtin',  h:['gtin'], hidden:true },
];
const RX_SHOW = RX_COLS.filter(c=>!c.hidden);
function rxSave(){ store.set(K_RX, rx); }

function parseCDL(sheets){
  for (const { aoa } of sheets){
    let h = -1;
    for (let i=0;i<Math.min(aoa.length,40);i++){
      const r = (aoa[i]||[]).map(x=>String(x??'').trim().toLowerCase());
      if (r.includes('billing document') && r.includes('article')) { h=i; break; }
    }
    if (h<0) continue;
    const head = aoa[h].map(x=>String(x??'').trim().toLowerCase());
    const idx = {}; for (const c of RX_COLS){ idx[c.k] = c.h.map(n=>head.indexOf(n)).find(i=>i>=0) ?? -1; }
    if (idx.art<0 || idx.qty<0 || idx.price<0) throw new Error('Mangler kolonnerne Article / Delivery Quantity / Price per Sales Unit.');
    const rows = [], sums = {}; let total = null;
    for (let i=h+1;i<aoa.length;i++){
      const r = aoa[i]||[];
      const inv = String(r[idx.inv]??'').trim();
      if (!inv) continue;
      if (inv.includes('Ʃ') || inv.includes('Σ')){
        const no = inv.replace(/[ƩΣ]/g,'').trim();
        const v = { qty: parseNum(r[idx.qty]) ?? 0, net: parseNum(r[idx.net]) ?? 0 };
        if (no) sums[no] = v; else total = v;
        continue;
      }
      const o = { id: rows.length };
      for (const c of RX_COLS){ const v = idx[c.k]>=0 ? r[idx[c.k]] : null; o[c.k] = c.num ? (parseNum(v) ?? 0) : String(v ?? '').trim(); }
      if (!o.art) continue;
      o.tester = /^T\s/.test(o.desc) || /^T8/i.test(o.mgrp);
      o.posm = /^X/i.test(o.mgrp) || /pseudo/i.test(o.brand) || /posm/i.test(o.ref);
      o.on = !(rxPref.autoZero && o.price === 0);
      rows.push(o);
    }
    if (rows.length) return { rows, sums, total };
  }
  throw new Error('Kunne ikke finde CDL-tabellen (kolonnerne "Billing Document" og "Article").');
}
async function rxLoad(file){
  try{
    const p = parseCDL(await readSheets(file));
    if (rx && rx.rows?.some(r=>!r.on && r.price!==0) && !confirm('Der er allerede en CDL med dine fravalg. Erstat den?')) return;
    rx = { fileName:file.name, loadedAt:Date.now(), rows:p.rows, sums:p.sums, total:p.total };
    rxSave();
    Object.assign(rui, { inv:'all', filter:'all', q:'', colf:{}, sort:{key:null,dir:1} });
    ui.section = 'receive'; saveUi(); render();
    const off = p.rows.filter(r=>!r.on).length;
    toast(`${p.rows.length} linjer · ${rxInvoices().length} fakturaer${off ? ` · ${off} med pris 0 fravalgt` : ''}`);
  }catch(e){ console.error(e); alert('Kunne ikke læse CDL-filen:\n' + e.message); }
}
function rxInvoices(){
  if (!rx) return [];
  const m = new Map();
  for (const r of rx.rows){
    if (!m.has(r.inv)) m.set(r.inv, { no:r.inv, lines:0, qty:0, net:0, on:0, onNet:0, refs:new Set(), zero:0 });
    const v = m.get(r.inv);
    v.lines++; v.qty += r.qty; v.net += r.net; if (r.ref) v.refs.add(r.ref);
    if (r.on){ v.on++; v.onNet += r.net; }
    if (r.price===0) v.zero++;
  }
  return [...m.values()].map(v => { const s = rx.sums?.[v.no]; v.sum = s; v.check = s ? (Math.abs(s.net - v.net) < 0.05 && Math.abs(s.qty - v.qty) < 0.001 ? 'ok' : 'diff') : 'none'; return v; });
}
/** Excel-agtigt filter: tekst = indeholder · !tekst = indeholder ikke · tal: >5 <10 >=, <=, =0, <>0 */
function colMatch(col, val, f){
  f = f.trim(); if (!f) return true;
  if (col.num){
    const m = f.match(/^(>=|<=|<>|!=|>|<|=)\s*(-?[\d.,]+)$/);
    if (m){ const n = parseNum(m[2]);
      switch(m[1]){ case '>':return val>n; case '<':return val<n; case '>=':return val>=n; case '<=':return val<=n; case '=':return val===n; default:return val!==n; } }
    if (/^-?[\d.,]+$/.test(f)) return val === parseNum(f);
  }
  const neg = /^(!|<>)/.test(f), needle = f.replace(/^(!|<>)/,'').toLowerCase();
  const hit = String(val).toLowerCase().includes(needle);
  return neg ? !hit : hit;
}
function rxVisible(){
  if (!rx) return [];
  const q = rui.q.trim().toLowerCase();
  let L = rx.rows.filter(r => {
    if (rui.inv!=='all' && r.inv!==rui.inv) return false;
    if (rui.filter==='on' && !r.on) return false;
    if (rui.filter==='off' && r.on) return false;
    if (rui.filter==='zero' && r.price!==0) return false;
    if (rui.filter==='tester' && !r.tester) return false;
    if (q && !(r.desc.toLowerCase().includes(q) || r.art.includes(q) || r.brand.toLowerCase().includes(q) || (r.gtin||'').includes(q))) return false;
    for (const c of RX_SHOW){ const f = rui.colf[c.k]; if (f && !colMatch(c, r[c.k], f)) return false; }
    return true;
  });
  const { key, dir } = rui.sort;
  if (key){
    const col = RX_COLS.find(c=>c.k===key);
    const get = key==='on' ? (r=>r.on?1:0) : col?.num ? (r=>r[key]) : (r=>{ const v=r[key]; return /^\d+$/.test(v) ? +v : String(v).toLowerCase(); });
    L = L.slice().sort((a,b)=>{ const A=get(a),B=get(b); return (A>B?1:A<B?-1:0)*dir; });
  }
  return L;
}

/* ---------- CSV ---------- */
const csvField = (v, sep) => { const s = String(v ?? ''); return /["\r\n]/.test(s) || s.includes(sep) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const csvNum = (n, dec) => { const s = String(Math.round(n*10000)/10000); return dec===',' ? s.replace('.', ',') : s; };
function buildCsv(rows, p){
  const sep = p.sep==='tab' ? '\t' : p.sep, out = [];
  if (p.header) out.push(p.headers.map(h=>csvField(h,sep)).join(sep));
  for (const r of rows) out.push([csvField(r.art,sep), csvNum(r.qty,p.dec), csvNum(r.price,p.dec)].join(sep));
  return out.join('\r\n') + '\r\n';
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function openCsv(){
  const invs = rxInvoices();
  const pre = rui.inv==='all' ? invs.map(i=>i.no) : [rui.inv];
  const seg = (name, opts, cur) => `<div class="seg">${opts.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${String(cur)===String(v)?'checked':''}>${l}</label>`).join('')}</div>`;
  $('#csvBody').innerHTML = `
    <div class="field"><span class="lab">Fakturaer</span>
      ${invs.map(i=>`<label class="check"><input type="checkbox" name="cinv" value="${esc(i.no)}" ${pre.includes(i.no)?'checked':''}>
        <span class="mono">${esc(i.no)}</span> <span class="help">${i.on} af ${i.lines} linjer · ${eur(i.onNet)}</span>
        ${i.check==='diff'?'<span class="tag red">sum afviger</span>':''}</label>`).join('')}</div>
    <div class="field"><span class="lab">Filer</span>${seg('cmode',[['split','Én fil pr. faktura'],['one','Én samlet fil']], rxPref.mode)}</div>
    <div class="row3">
      <div class="field"><span class="lab">Skilletegn</span>${seg('csep',[[';',' ; '],[',',' , '],['tab','Tab']], rxPref.sep)}</div>
      <div class="field"><span class="lab">Decimaltegn</span>${seg('cdec',[[',','0,64'],['.','0.64']], rxPref.dec)}</div>
      <div class="field"><span class="lab">Overskrift</span>${seg('chead',[['1','Med'],['0','Uden']], rxPref.header?'1':'0')}</div>
    </div>
    <div class="field" id="headNames"><span class="lab">Overskrifter</span>
      <div class="row3">${rxPref.headers.map((h,i)=>`<input type="text" data-hn="${i}" value="${esc(h)}">`).join('')}</div>
      <span class="help">Kolonnerne er altid Article · Delivery quantity · Price per Sales Unit (som fanen CSV PC).</span></div>
    <div class="field"><span class="lab">Forhåndsvisning</span><div class="csv-preview" id="csvPrev"></div></div>`;
  const upd = () => {
    const p = csvPrefFromForm();
    $('#headNames').style.display = p.header ? '' : 'none';
    const sel = [...document.querySelectorAll('[name=cinv]:checked')].map(i=>i.value);
    const rows = rx.rows.filter(r=>r.on && sel.includes(r.inv));
    $('#csvPrev').textContent = buildCsv(rows.slice(0,6), p).trimEnd().split('\r\n').join('\n') + (rows.length>6 ? `\n… (${rows.length} linjer i alt)` : '');
  };
  $('#csvBody').oninput = upd; $('#csvBody').onchange = upd; upd();
  $('#mCsv').classList.add('show');
}
function csvPrefFromForm(){
  const g = n => document.querySelector(`[name=${n}]:checked`)?.value;
  return Object.assign({}, rxPref, { mode:g('cmode'), sep:g('csep'), dec:g('cdec'), header:g('chead')==='1',
    headers:[0,1,2].map(i => document.querySelector(`[data-hn="${i}"]`)?.value ?? rxPref.headers[i]) });
}
function doCsv(){
  const p = csvPrefFromForm();
  rxPref = Object.assign(rxPref, p); store.set(K_RXP, rxPref);
  const sel = [...document.querySelectorAll('[name=cinv]:checked')].map(i=>i.value);
  if (!sel.length){ toast('Vælg mindst én faktura'); return; }
  const groups = p.mode==='split' ? sel.map(s=>[s]) : [sel];
  let n = 0;
  groups.forEach((g, gi) => {
    const rows = rx.rows.filter(r=>r.on && g.includes(r.inv));
    if (!rows.length) return;
    const name = p.mode==='split' ? `CSV PC ${g[0]}.csv` : `CSV PC ${sel.length===1 ? sel[0] : 'samlet ' + new Date().toISOString().slice(0,10)}.csv`;
    setTimeout(() => download(name, buildCsv(rows, p)), gi*400);
    n++;
  });
  $('#mCsv').classList.remove('show');
  toast(n ? `${n} CSV-fil(er) downloadet` : 'Ingen markerede linjer');
}

/* =====================================================================
   Indstillinger og hjælp
   ===================================================================== */
function openSettings(){
  const s = settings;
  $('#settingsBody').innerHTML = `
    <div class="field"><span class="lab">Mindst på hylden</span>
      <div class="row3">${CAT_KEYS.map(c=>`<div class="field"><span class="help">${CATS[c].name}</span><input type="number" min="0" id="min_${c}" value="${s.minShelf[c]}"></div>`).join('')}</div>
      <span class="help">Er reel lager + bestilling under dette tal, bestilles der op til det.</span></div>
    <div class="row3">
      <div class="field"><label for="setCover">Dæk salget</label>
        <select id="setCover">${[1,1.5,2,3].map(v=>`<option value="${v}" ${+s.cover===v?'selected':''}>${v===1?'1 × solgt (standard)':v+' × solgt'}</option>`).join('')}</select></div>
      <div class="field"><label for="setRound">Afrunding</label>
        <select id="setRound"><option value="nearest" ${s.rounding==='nearest'?'selected':''}>Til nærmeste (15→12, 20→24)</option><option value="up" ${s.rounding==='up'?'selected':''}>Altid op (15→24)</option></select></div>
      <div class="field"><label for="setTheme">Tema</label>
        <select id="setTheme"><option value="">Følg systemet</option><option value="light">Lyst</option><option value="dark">Mørkt</option></select></div>
    </div>
    <label class="check"><input type="checkbox" id="setStock" ${s.showWinposStock?'checked':''}> Vis kolonnen "Lager (Winpos)" – til at kontrollere at tallene passer med Winpos</label>
    <div class="field"><span class="lab">Særregler (varenavnet indeholder …)</span>
      <table class="rules-table"><thead><tr><th>Tekst</th><th title="Hvor mange lagerenheder 1 solgt/bestilt svarer til">1 solgt =</th><th title="Bestilles i hele …">Bestil i hele</th><th>Enhed</th><th></th></tr></thead>
      <tbody id="rulesBody">${s.rules.map(ruleRow).join('')}</tbody></table>
      <div><button class="btn sm" data-act="add-rule">+ Tilføj regel</button></div>
      <span class="help"><b>1 solgt =</b> hvor mange lagerenheder én solgt/bestilt svarer til. Cola: solgt tælles i kasser, lager i dåser → 24. Reel lager = lager − solgt × 24.<br><b>Bestil i hele:</b> Cola bestilles i 99 ad gangen.</span></div>
    <div class="field"><span class="lab">Huskede sekundære enheder</span>
      <span class="help">${Object.keys(suMemory).length} varer husket. <button class="btn sm" data-act="clear-su" ${Object.keys(suMemory).length?'':'disabled'}>Slet alle</button></span></div>`;
  $('#setTheme').value = store.get('sb_theme','');
  $('#mSettings').classList.add('show');
}
function ruleRow(r){
  return `<tr><td><input type="text" data-r="match" value="${esc(r.match)}"></td>
    <td><input type="number" min="1" data-r="factor" value="${r.factor}" style="width:70px"></td>
    <td><input type="number" min="1" data-r="step" value="${r.step||1}" style="width:70px"></td>
    <td><input type="text" data-r="unit" value="${esc(r.unit||'kasser')}" style="width:80px"><input type="hidden" data-r="note" value="${esc(r.note||'')}"><input type="hidden" data-r="cats" value="${esc(r.cats||'ltc')}"></td>
    <td><button class="x-btn" data-act="del-rule" title="Slet">×</button></td></tr>`;
}
function saveSettings(){
  for (const c of CAT_KEYS) settings.minShelf[c] = Math.max(0, parseInt($('#min_'+c).value,10)||0);
  settings.cover = +$('#setCover').value || 1;
  settings.rounding = $('#setRound').value;
  settings.showWinposStock = $('#setStock').checked;
  settings.rules = [...document.querySelectorAll('#rulesBody tr')].map(tr => {
    const g = k => tr.querySelector(`[data-r="${k}"]`).value;
    const r = { match:g('match').trim(), factor:Math.max(1,+g('factor')||1), step:Math.max(1,+g('step')||1), unit:g('unit').trim()||'kasser', cats:g('cats')||'ltc', note:g('note') };
    const old = settings.rules.find(o=>o.match===r.match);
    if (!old || old.factor!==r.factor || old.step!==r.step) r.note = `1 = ${r.factor}, bestilles i hele ${r.step} ${r.unit}.`;
    return r;
  }).filter(r=>r.match);
  store.set(K_SET, settings);
  applyTheme($('#setTheme').value);
  $('#mSettings').classList.remove('show');
  render(); toast('Indstillinger gemt');
}
function applyTheme(v){ store.set('sb_theme', v); if (v) document.documentElement.dataset.theme=v; else delete document.documentElement.dataset.theme; }

function openHelp(){
  $('#helpBody').innerHTML = `
    <div><h3>📦 Bestilling – hver uge</h3><ol>
      <li>Eksportér <b>LTC</b>, <b>Perfume</b> og <b>Andet</b> fra Winpos som Excel.</li>
      <li>Træk filerne ind på kortene øverst. Du kan også slippe alle tre på én gang – appen kan se på filnavnet hvilken der er hvilken.</li>
      <li>Kig på <b>Samlet overblik</b> → <b>Fejl-tjek</b>. Tryk "Vis" for at hoppe direkte til linjen.</li>
      <li>Ret antal i <b>Bestil</b>-feltet eller med − / +. Enter hopper til næste linje.</li>
      <li>Mangler en vare sekundær enhed (rød), så skriv den i feltet – appen husker den til næste uge.</li>
      <li>Tryk <b>Order Heinemann</b> for bestillingsfilen, og <b>Overblik til Excel</b> hvis du vil have hele beregningen som regneark.</li>
    </ol></div>
    <div><h3>🧮 Regnestykket</h3><ul>
      <li><b>Reel lager</b> = lager − solgt. (Winpos' eget lagertal kan slås til under Indstillinger, hvis du vil sammenligne.)</li>
      <li><b>Bestil</b> = det der mangler for at reel lager dækker det solgte. Er der nok på lager, bestilles 0.</li>
      <li>Perfume og Andet: altid mindst ${settings.minShelf.perfume} / ${settings.minShelf.andet} på hylden.</li>
      <li>Cola og Fanta: solgt er kasser á 24 – reel lager = dåser − solgt × 24. Bestilles i 99 kasser. Capri Sonne: 1 = 40 stk.</li>
    </ul></div>
    <div><h3>🚚 Varemodtagelse</h3><ol>
      <li>Upload CDL-filen fra Heinemann under <b>Varemodtagelse</b>.</li>
      <li>Hver faktura får sit eget kort. "✓ Sum passer" betyder at linjerne stemmer med den gule sumlinje.</li>
      <li>Pris 0-linjer (testere, POSM) er fravalgt. Fjern/sæt flueben for at styre hvad der kommer med.</li>
      <li>Tryk <b>CSV til Winpos</b> – én fil pr. faktura med Article, Delivery quantity og Price per Sales Unit.</li>
    </ol></div>
    <div><h3>🎨 Farver</h3><ul>
      <li><span class="tag red">Rød</span> skal rettes · <span class="tag amber">Gul</span> værd at kigge på · <span class="tag blue">Blå</span> rettet af dig · <span class="tag teal">Grøn</span> særregel / OK</li>
    </ul></div>
    <p class="help">Alt gemmes kun i din egen browser. Brug "Gem backup" under Indstillinger, hvis du skifter computer.</p>`;
  $('#mHelp').classList.add('show');
}

/* =====================================================================
   Render + hændelser
   ===================================================================== */
function render(){
  document.querySelectorAll('.sec-btn').forEach(b => {
    b.classList.toggle('on', b.dataset.s === ui.section);
    b.querySelector('.dot')?.remove();
    if (b.dataset.s==='order' && ui.section!=='order' && CAT_KEYS.some(c=>session.data[c] && summary(c).red)) b.insertAdjacentHTML('beforeend','<span class="dot"></span>');
  });
  if (ui.section === 'receive') renderReceive(); else renderOrder();
}
function pickFile(cat){ const i = $('#file_'+cat); if (i){ i.value=''; i.click(); } }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  // knapper inde i et kort må ikke også aktivere kortet
  if (t.closest('.kcard') && t.classList.contains('k-tool')) e.stopPropagation();
  switch (a){
    case 'section': ui.section = t.dataset.s; saveUi(); render(); window.scrollTo({top:0}); break;
    case 'view': ui.view = t.dataset.v; Object.assign(ui, { filter:'all', q:'', sort:{key:null,dir:1} }); render(); break;
    case 'pick': pickFile(t.dataset.cat); break;
    case 'clear': if (confirm(`Fjern ${CATS[t.dataset.cat].name}-filen og dine rettelser?`)){ delete session.data[t.dataset.cat]; session.overrides[t.dataset.cat]={}; saveSession(); if (ui.view===t.dataset.cat) ui.view='overview'; render(); } break;
    case 'filter': ui.filter = t.dataset.v; renderCat(ui.view); break;
    case 'sort': { const k=t.dataset.k; ui.sort = ui.sort.key===k ? {key:k,dir:-ui.sort.dir} : {key:k,dir:(['desc','code','art'].includes(k)?1:-1)}; renderCat(ui.view); break; }
    case 'step': { const cat=ui.view, x=computed(cat).find(r=>r.code===t.dataset.code); setOverride(cat, t.dataset.code, Math.max(0, x.final + (+t.dataset.d))); break; }
    case 'goto': Object.assign(ui, { view:t.dataset.cat, filter:'all', q:t.dataset.code, sort:{key:null,dir:1} }); render(); break;
    case 'reset-ov': session.overrides[ui.view]={}; saveSession(); render(); toast('Rettelser nulstillet'); break;
    case 'hide-info': ui.hiddenInfo[t.dataset.cat] = true; saveUi(); render(); break;
    case 'print': window.print(); break;
    case 'export-order': openExport(); break;
    case 'do-export': doExport(); break;
    case 'copy-lines': copyLines(); break;
    case 'export-overview': exportOverview(); break;
    case 'settings': openSettings(); break;
    case 'save-settings': saveSettings(); break;
    case 'reset-settings': if (confirm('Nulstil indstillinger til standard?')){ settings = structuredClone(DEFAULT_SETTINGS); store.set(K_SET,settings); openSettings(); render(); } break;
    case 'add-rule': $('#rulesBody').insertAdjacentHTML('beforeend', ruleRow({match:'',factor:1,step:1,unit:'kasser',cats:'ltc'})); break;
    case 'del-rule': t.closest('tr').remove(); break;
    case 'clear-su': if (confirm('Slet alle huskede sekundære enheder?')){ suMemory={}; store.set(K_SU,suMemory); t.disabled=true; render(); } break;
    case 'backup': { const a2=document.createElement('a'); a2.href=URL.createObjectURL(new Blob([JSON.stringify({settings,suMemory,rxPref,v:2},null,2)],{type:'application/json'})); a2.download='shop-bestilling-backup.json'; a2.click(); break; }
    case 'help': openHelp(); break;
    case 'close': t.closest('.modal-bg').classList.remove('show'); break;
    case 'rx-clear': if (confirm('Fjern CDL-filen og dine fravalg?')){ rx=null; store.del(K_RX); render(); } break;
    case 'rx-inv': rui.inv = t.dataset.v; renderReceive(); break;
    case 'rx-filter': rui.filter = t.dataset.v; renderReceive(); break;
    case 'rx-sort': { if (e.target.matches('input')) break; const k=t.dataset.k; rui.sort = rui.sort.key===k ? {key:k,dir:-rui.sort.dir} : {key:k,dir:RX_COLS.find(c=>c.k===k)?.num?-1:1}; renderReceive(); break; }
    case 'rx-all': { const on = t.dataset.v==='1', L = rxVisible(); L.forEach(r=>r.on=on); rxSave(); renderReceive(); toast(`${L.length} linjer ${on?'med':'fravalgt'}`); break; }
    case 'rx-clearf': rui.colf = {}; renderReceive(); break;
    case 'rx-export': openCsv(); break;
    case 'do-csv': doCsv(); break;
  }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key==='Enter' || e.key===' ') && t.classList?.contains('kcard') && t.dataset.act){ e.preventDefault(); t.click(); return; }
  if (e.key==='Enter' && (t.dataset?.qty!=null || t.dataset?.su!=null)){
    e.preventDefault();
    const attr = t.dataset.qty!=null ? 'data-qty' : 'data-su';
    const list = [...document.querySelectorAll(`[${attr}]`)];
    const next = list[list.indexOf(t) + (e.shiftKey?-1:1)]?.getAttribute(attr);
    const nextSel = next!=null ? `[${attr}="${CSS.escape(next)}"]` : null;
    t.dataset.nextSel = nextSel || '';
    t.blur();
    if (nextSel){ const n = document.querySelector(nextSel); if (n){ n.focus(); n.select(); } }
  }
  if (e.key==='Escape') document.querySelectorAll('.modal-bg.show').forEach(m=>m.classList.remove('show'));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id?.startsWith('file_') && t.files[0]){
    const cat = t.id.slice(5), f = t.files[0];
    if (cat==='cdl') rxLoad(f); else loadOrderFile(cat, f);
    return;
  }
  if (t.id==='inRestore' && t.files[0]){
    t.files[0].text().then(txt => {
      try{ const j = JSON.parse(txt); if (j.settings){ store.set(K_SET, j.settings); settings = loadSettings(); } if (j.suMemory) suMemory = j.suMemory; if (j.rxPref) rxPref = Object.assign(rxPref, j.rxPref);
        store.set(K_SU,suMemory); store.set(K_RXP, rxPref); openSettings(); render(); toast('Backup indlæst'); }
      catch(err){ alert('Ugyldig backup-fil'); }
    });
    return;
  }
  if (t.dataset.qty!=null){ const ns = t.dataset.nextSel; setOverride(ui.view, t.dataset.qty, t.value); if (ns){ const n=document.querySelector(ns); if(n){ n.focus(); n.select(); } } return; }
  if (t.dataset.su!=null){
    const v = parseSU(t.value), code = t.dataset.su, ns = t.dataset.nextSel;
    if (t.value.trim()==='') delete suMemory[code];
    else if (!v){ toast('Sekundær enhed skal være et helt tal'); render(); return; }
    else suMemory[code] = v;
    store.set(K_SU, suMemory);
    delete session.overrides[ui.view][code]; saveSession();
    refreshOrder(ns || undefined);
    toast(v ? `Sekundær enhed ${v} gemt – huskes til næste uge` : 'Sekundær enhed fjernet');
    return;
  }
  if (t.dataset.rxon!=null){
    rx.rows[+t.dataset.rxon].on = t.checked; rxSave();
    const st = document.querySelector('.tablewrap')?.scrollTop;
    renderReceive(); const w=document.querySelector('.tablewrap'); if (w && st!=null) w.scrollTop = st;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id==='q'){ ui.q = t.value; renderCatBody(ui.view); return; }
  if (t.id==='rxQ'){ rui.q = t.value; rxRenderBody(); return; }
  if (t.dataset.colf!=null){ rui.colf[t.dataset.colf] = t.value; t.classList.toggle('act', !!t.value.trim()); rxRenderBody(); const b=$('#rxClearF'); if (b) b.disabled = !Object.values(rui.colf).some(x=>x&&x.trim()); }
});

/* Træk-og-slip: på et kort → den kategori; ellers gættes ud fra filnavnet */
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => {
  e.preventDefault();
  const z = e.target.closest?.('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach(x=>x.classList.toggle('drag', x===z));
}));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag')); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.querySelectorAll('.drag').forEach(x=>x.classList.remove('drag'));
  const files = [...(e.dataTransfer?.files||[])];
  if (!files.length) return;
  const z = e.target.closest?.('[data-drop]');
  if (z && files.length===1){ const c = z.dataset.drop; return c==='cdl' ? rxLoad(files[0]) : loadOrderFile(c, files[0]); }
  const unknown = [];
  for (const f of files){
    let c = guessCat(f.name);
    if (!c && ui.section==='receive') c = 'cdl';
    if (c==='cdl') await rxLoad(f); else if (c) await loadOrderFile(c, f); else unknown.push(f.name);
  }
  if (unknown.length) toast('Kunne ikke se hvilken fil det er: ' + unknown.join(', ') + ' – slip den på det rigtige kort.');
});
document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('mousedown', e => { if (e.target===m) m.classList.remove('show'); }));

applyTheme(store.get('sb_theme',''));
render();
</script>
</body>
